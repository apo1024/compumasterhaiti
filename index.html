<title>CNA Prep Haiti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{
  --indigo:#23106B; --indigo-2:#3A22A8; --blue:#2E6FD0;
  --gold:#E8A91D; --green:#2E9E4F; --red:#CE3A2C;
  --ground:#F6F5FB; --card:#FFFFFF; --ink:#171331; --ink-2:#514B72; --ink-3:#8A84A6;
  --line:#E3E0EE; --line-2:#CFCADF;
  --ok-bg:#E9F6ED; --ok-line:#2E9E4F; --no-bg:#FCECEA; --no-line:#CE3A2C;
  --on-accent:#FFFFFF;
  --shadow:0 1px 2px rgba(23,19,49,.05), 0 8px 24px rgba(23,19,49,.07);
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --indigo:#B9AEF0; --indigo-2:#8E79E8; --blue:#6FA3EC;
    --gold:#EFC75E; --green:#63C983; --red:#F08375;
    --ground:#100D1E; --card:#191430; --ink:#EFECFA; --ink-2:#BAB3D6; --ink-3:#847DA3;
    --line:#2B2447; --line-2:#3A3159;
    --ok-bg:#15301F; --ok-line:#63C983; --no-bg:#33161A; --no-line:#F08375;
    --on-accent:#171331;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --indigo:#B9AEF0; --indigo-2:#8E79E8; --blue:#6FA3EC;
  --gold:#EFC75E; --green:#63C983; --red:#F08375;
  --ground:#100D1E; --card:#191430; --ink:#EFECFA; --ink-2:#BAB3D6; --ink-3:#847DA3;
  --line:#2B2447; --line-2:#3A3159;
  --ok-bg:#15301F; --ok-line:#63C983; --no-bg:#33161A; --no-line:#F08375;
  --on-accent:#171331;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{overflow-x:hidden;}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.5;
  padding:0 0 84px;
  overscroll-behavior-y:contain;
}
.wrap{max-width:720px;margin:0 auto;padding:0 16px;}
h1,h2,h3{font-family:"Bricolage Grotesque","Manrope",sans-serif;font-weight:700;letter-spacing:-.02em;margin:0;text-wrap:balance;}

/* ---------- top bar ---------- */
header{
  position:sticky;top:0;z-index:30;background:var(--ground);
  border-bottom:1px solid var(--line);
}
.bar{max-width:720px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;}
.bar img{height:30px;width:auto;display:block;background:#fff;padding:3px 5px;border-radius:6px;}
.bar .who{flex:1;min-width:0;}
.bar .who b{display:block;font-size:13px;font-weight:700;line-height:1.15;}
.bar .who span{display:block;font-size:10.5px;color:var(--ink-3);letter-spacing:.07em;text-transform:uppercase;}
.lang{display:flex;border:1px solid var(--line-2);border-radius:999px;overflow:hidden;flex:none;}
.lang button{
  font:inherit;font-size:12px;font-weight:700;border:0;background:transparent;color:var(--ink-2);
  padding:6px 11px;cursor:pointer;
}
.lang button[aria-pressed="true"]{background:var(--indigo);color:var(--on-accent);}

/* ---------- views ---------- */
.view{display:none;padding-top:18px;}
.view.on{display:block;}

.hero h1{font-size:26px;line-height:1.1;margin-bottom:6px;}
.hero p{color:var(--ink-2);margin:0 0 18px;font-size:14px;}

.levels{display:grid;gap:12px;}
.lvl{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:15px 16px;cursor:pointer;font:inherit;color:inherit;box-shadow:var(--shadow);
}
.lvl:active{transform:scale(.995);}
.lvl .dot{width:10px;height:10px;border-radius:50%;flex:none;}
.lvl .t{flex:1;min-width:0;}
.lvl .t b{display:block;font-size:16px;font-weight:700;font-family:"Bricolage Grotesque",sans-serif;}
.lvl .t span{display:block;font-size:12.5px;color:var(--ink-2);margin-top:1px;}
.lvl .n{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;flex:none;font-weight:600;}
.lvl:focus-visible{outline:2px solid var(--indigo-2);outline-offset:2px;}

.exam{background:var(--indigo);border-color:var(--indigo);color:var(--on-accent);}
.exam .t span,.exam .n{color:color-mix(in srgb, var(--on-accent) 75%, transparent);}

.sectionlabel{
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);
  font-weight:700;margin:26px 0 10px;
}

/* ---------- quiz ---------- */
.qtop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
.qtop .meta{font-size:12px;color:var(--ink-3);font-weight:600;font-variant-numeric:tabular-nums;}
.qtop button{font:inherit;font-size:12.5px;font-weight:600;background:none;border:0;color:var(--ink-2);cursor:pointer;padding:4px;}
.pbar{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:18px;}
.pbar i{display:block;height:100%;background:var(--indigo-2);border-radius:99px;transition:width .25s ease;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);}
.stem{font-size:17px;line-height:1.4;font-weight:600;margin:0 0 4px;font-family:"Bricolage Grotesque",sans-serif;}
.tag{display:inline-block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--ink-3);margin-bottom:10px;}
.opts{display:grid;gap:9px;margin-top:14px;}
.opt{
  display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;font:inherit;
  background:var(--card);border:1.5px solid var(--line-2);border-radius:11px;padding:12px 13px;
  cursor:pointer;color:inherit;line-height:1.35;
}
.opt i{
  flex:none;font-style:normal;font-weight:700;font-size:12px;width:22px;height:22px;border-radius:50%;
  border:1.5px solid var(--line-2);display:grid;place-items:center;color:var(--ink-3);margin-top:1px;
}
.opt:focus-visible{outline:2px solid var(--indigo-2);outline-offset:2px;}
.opt[disabled]{cursor:default;}
.opt.correct{background:var(--ok-bg);border-color:var(--ok-line);}
.opt.correct i{border-color:var(--ok-line);color:var(--ok-line);}
.opt.wrong{background:var(--no-bg);border-color:var(--no-line);}
.opt.wrong i{border-color:var(--no-line);color:var(--no-line);}

.why{margin-top:14px;border-top:1px solid var(--line);padding-top:13px;}
.why .verdict{font-weight:700;font-size:14px;margin:0 0 5px;font-family:"Bricolage Grotesque",sans-serif;}
.why .verdict.ok{color:var(--green);}
.why .verdict.no{color:var(--red);}
.why p{margin:0;font-size:14px;color:var(--ink-2);}
.srcbtn{
  margin-top:11px;display:inline-flex;align-items:center;gap:7px;font:inherit;font-size:12.5px;font-weight:700;
  background:transparent;border:1.5px solid var(--line-2);border-radius:999px;padding:7px 13px;cursor:pointer;color:var(--indigo);
}
.srcbtn:focus-visible{outline:2px solid var(--indigo-2);outline-offset:2px;}

.btn{
  display:block;width:100%;font:inherit;font-size:15px;font-weight:700;
  background:var(--indigo);color:var(--on-accent);border:0;border-radius:11px;padding:14px;margin-top:14px;cursor:pointer;
}
.btn.ghost{background:transparent;color:var(--ink-2);border:1.5px solid var(--line-2);}
.btn:focus-visible{outline:2px solid var(--indigo-2);outline-offset:2px;}

/* ---------- results ---------- */
.score{text-align:center;padding:26px 18px;}
.score .big{font-family:"Bricolage Grotesque",sans-serif;font-size:52px;font-weight:700;line-height:1;letter-spacing:-.03em;}
.score .big small{font-size:20px;color:var(--ink-3);font-weight:600;}
.score .verdict{font-size:14px;color:var(--ink-2);margin-top:8px;}
.brk{margin-top:8px;}
.brkrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
.brkrow span{flex:1;min-width:0;}
.brkrow b{font-variant-numeric:tabular-nums;font-weight:700;flex:none;}
.brkrow .mini{height:5px;width:62px;background:var(--line);border-radius:99px;overflow:hidden;flex:none;}
.brkrow .mini i{display:block;height:100%;background:var(--indigo-2);}
.missed{margin-top:8px;}
.missed details{border:1px solid var(--line);border-radius:11px;margin-bottom:8px;background:var(--card);}
.missed summary{padding:12px 14px;cursor:pointer;font-weight:600;font-size:14px;line-height:1.35;}
.missed summary::-webkit-details-marker{display:none;}
.missed .body{padding:0 14px 14px;font-size:13.5px;color:var(--ink-2);}
.missed .body b{color:var(--ink);}

/* ---------- guide ---------- */
.gsearch{display:flex;gap:8px;margin-bottom:14px;}
.gsearch input{
  flex:1;font:inherit;font-size:15px;padding:12px 14px;border-radius:11px;
  border:1.5px solid var(--line-2);background:var(--card);color:var(--ink);min-width:0;
}
.gsearch input:focus{outline:2px solid var(--indigo-2);outline-offset:0;border-color:transparent;}
.gitem{border-bottom:1px solid var(--line);}
.gitem summary{
  padding:14px 2px;cursor:pointer;display:flex;gap:12px;align-items:baseline;list-style:none;
}
.gitem summary::-webkit-details-marker{display:none;}
.gitem summary .gt{flex:1;font-weight:700;font-size:15px;font-family:"Bricolage Grotesque",sans-serif;line-height:1.3;}
.gitem summary .gp{font-size:11.5px;color:var(--ink-3);font-weight:700;flex:none;font-variant-numeric:tabular-nums;}
.gitem ul{margin:0 0 16px;padding-left:19px;}
.gitem li{margin:0 0 9px;font-size:14px;color:var(--ink-2);line-height:1.5;}
.gitem[open] summary .gt{color:var(--indigo);}
mark{background:rgba(232,169,29,.35);color:inherit;border-radius:2px;padding:0 1px;}

/* ---------- ask ---------- */
.askbox{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);}
.askbox textarea{
  width:100%;font:inherit;font-size:15px;padding:12px 13px;border-radius:11px;resize:vertical;min-height:84px;
  border:1.5px solid var(--line-2);background:var(--ground);color:var(--ink);
}
.askbox textarea:focus{outline:2px solid var(--indigo-2);border-color:transparent;}
.hit{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--indigo-2);border-radius:11px;padding:14px;margin-bottom:10px;}
.hit .src{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--ink-3);margin-bottom:6px;}
.hit p{margin:0 0 10px;font-size:14.5px;line-height:1.5;}
.nores{background:var(--card);border:1px dashed var(--line-2);border-radius:11px;padding:16px;text-align:center;color:var(--ink-2);font-size:14px;}
.board{margin-top:8px;}
.post{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:13px 14px;margin-bottom:9px;}
.post .q{font-weight:600;font-size:14.5px;line-height:1.4;}
.post .m{font-size:11.5px;color:var(--ink-3);margin-top:5px;}
.post .a{margin-top:9px;padding-top:9px;border-top:1px solid var(--line);font-size:14px;color:var(--ink-2);}

/* ---------- progress ---------- */
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px;}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:13px 12px;text-align:center;}
.stat b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:24px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;}
.stat span{display:block;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin-top:5px;font-weight:700;}

/* ---------- bottom nav ---------- */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
}
.navin{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);}
nav button{
  font:inherit;background:none;border:0;padding:9px 4px 11px;cursor:pointer;color:var(--ink-3);
  display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;
  letter-spacing:.02em;
}
nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
nav button[aria-current="true"]{color:var(--indigo);}
nav button:focus-visible{outline:2px solid var(--indigo-2);outline-offset:-3px;}

.foot{margin-top:26px;padding:16px 0 4px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-3);line-height:1.6;}
.install{
  display:none;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line-2);
  border-radius:11px;padding:12px 14px;margin-bottom:16px;box-shadow:var(--shadow);
}
.install.on{display:flex;}
.install p{margin:0;flex:1;font-size:13px;color:var(--ink-2);}
/* ---------- brand footer ---------- */
.brand{margin-top:30px;padding-top:22px;border-top:1px solid var(--line);}
.brand h3{
  font-family:"Archivo",sans-serif;font-size:11px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--ink-3);font-weight:700;margin:0 0 4px;
}
.brand .bn{font-family:"Bricolage Grotesque",sans-serif;font-size:19px;font-weight:700;margin:0 0 3px;color:var(--indigo);}
.brand .bt{font-size:13.5px;color:var(--ink-2);margin:0 0 16px;line-height:1.5;max-width:46ch;}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:9px;}
.lk{
  display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;
  background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 12px;
  box-shadow:var(--shadow);
}
.lk:active{transform:scale(.99);}
.lk:focus-visible{outline:2px solid var(--indigo-2);outline-offset:2px;}
.lk svg{width:19px;height:19px;flex:none;stroke:var(--indigo);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
.lk b{font-size:13.5px;font-weight:700;display:block;line-height:1.2;}
.lk span{font-size:11px;color:var(--ink-3);display:block;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lk .tx{min-width:0;}

.promo{
  display:block;text-decoration:none;color:inherit;margin-top:14px;
  background:var(--indigo);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);
}
.promo img{display:block;width:100%;height:auto;}
.promo .pb{padding:15px 16px;}
.promo .pk{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;
  color:color-mix(in srgb, var(--on-accent) 62%, transparent);margin-bottom:5px;}
.promo .pt{font-family:"Bricolage Grotesque",sans-serif;font-size:17px;font-weight:700;color:var(--on-accent);margin:0 0 4px;line-height:1.25;}
.promo .px{font-size:13px;color:color-mix(in srgb, var(--on-accent) 80%, transparent);margin:0 0 11px;line-height:1.45;}
.promo .pc{display:inline-block;font-size:12.5px;font-weight:700;color:var(--indigo);
  background:var(--on-accent);border-radius:999px;padding:7px 14px;}
.promo:focus-visible{outline:2px solid var(--indigo-2);outline-offset:3px;}
.more{margin-top:12px;border:1px solid var(--line);border-radius:11px;background:var(--card);}
.more summary{
  list-style:none;cursor:pointer;padding:12px 14px;font-size:13px;font-weight:700;color:var(--ink-2);
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.more summary::-webkit-details-marker{display:none;}
.more summary::after{content:"+";font-size:16px;color:var(--ink-3);font-weight:700;}
.more[open] summary::after{content:"\2013";}
.more .mg{display:flex;flex-wrap:wrap;gap:7px;padding:0 14px 14px;}
.more .mg a{
  font-size:12.5px;font-weight:600;text-decoration:none;color:var(--indigo);
  border:1px solid var(--line-2);border-radius:999px;padding:6px 12px;background:var(--ground);
}
.more .mg a:focus-visible{outline:2px solid var(--indigo-2);outline-offset:2px;}
.brand .legal{margin-top:16px;font-size:11px;color:var(--ink-3);line-height:1.6;}

.install button{font:inherit;font-size:13px;font-weight:700;background:var(--indigo);color:var(--on-accent);border:0;border-radius:999px;padding:8px 15px;cursor:pointer;flex:none;}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
</style>

<header>
  <div class="bar">
    <img src="logo.png" alt="CompuMaster Haiti">
    <div class="who"><b id="appname">CNA Prep</b><span id="appby">CompuMaster Haiti</span></div>
    <div class="lang" role="group" aria-label="Language">
      <button id="btn-en" aria-pressed="true">EN</button>
      <button id="btn-fr" aria-pressed="false">FR</button>
    </div>
  </div>
</header>

<main class="wrap">

  <!-- HOME -->
  <section class="view on" id="v-home">
    <div class="install" id="install"><p id="installtxt"></p><button id="installbtn">Install</button></div>
    <div class="hero">
      <h1 id="h-title"></h1>
      <p id="h-sub"></p>
    </div>
    <div class="levels" id="levels"></div>
    <div class="sectionlabel" id="l-recent"></div>
    <div id="recent"></div>
    <div class="brand" id="brand-home"></div>
  </section>

  <!-- QUIZ -->
  <section class="view" id="v-quiz">
    <div class="qtop">
      <span class="meta" id="q-meta"></span>
      <button id="q-quit"></button>
    </div>
    <div class="pbar"><i id="q-bar" style="width:0%"></i></div>
    <div class="card" id="q-card"></div>
    <button class="btn" id="q-next"></button>
  </section>

  <!-- RESULTS -->
  <section class="view" id="v-res">
    <div class="card score">
      <div class="big"><span id="r-score">0</span><small id="r-of"></small></div>
      <div class="verdict" id="r-verdict"></div>
    </div>
    <div class="sectionlabel" id="l-break"></div>
    <div class="brk" id="r-brk"></div>
    <div class="sectionlabel" id="l-missed"></div>
    <div class="missed" id="r-missed"></div>
    <button class="btn" id="r-again"></button>
    <button class="btn ghost" id="r-home"></button>
    <div class="brand" id="brand-res"></div>
  </section>

  <!-- GUIDE -->
  <section class="view" id="v-guide">
    <div class="hero"><h1 id="g-title"></h1><p id="g-sub"></p></div>

<script>
const DATA = {"guide":[{"id":"infection","page":4,"area":"Basic Nursing Skills","en":{"title":"Infection Prevention and Hand Hygiene","points":["Hand hygiene is the single most effective way to stop the spread of infection. Gloves add protection; they never replace washing.","Wash with soap and water for at least 20 seconds, keeping fingertips pointed down so water runs away from clean hands toward the sink.","Wash before and after every resident contact, before gloves and after removing them, after using the restroom, before handling food, and any time hands are visibly soiled.","Alcohol hand rub is acceptable when hands are not visibly dirty, but soap and water are required after caring for a resident with diarrhea or a spore-forming infection.","Use a clean paper towel to turn off the faucet and to open the door, so clean hands do not touch a contaminated surface.","Change gloves between residents and between a dirty task and a clean task on the same resident. Used gloves cannot be washed or sanitized.","Hold soiled linen away from your uniform, never shake it, and never place it on the floor or on another resident's bed."]},"fr":{"title":"Prevention des infections et hygiene des mains","points":["L'hygiene des mains est le moyen le plus efficace d'arreter la propagation des infections. Les gants ajoutent une protection, ils ne remplacent jamais le lavage.","Laver avec du savon et de l'eau pendant au moins 20 secondes, le bout des doigts vers le bas afin que l'eau s'ecoule des mains propres vers le lavabo.","Se laver avant et apres chaque contact avec un resident, avant de mettre les gants et apres les avoir retires, apres etre alle aux toilettes, avant de manipuler des aliments et des que les mains sont visiblement sales.","La solution hydro-alcoolique convient quand les mains ne sont pas visiblement sales, mais le savon et l'eau sont obligatoires apres avoir soigne un resident ayant la diarrhee ou une infection a spores.","Fermer le robinet et ouvrir la porte avec un essuie-tout propre, pour que les mains propres ne touchent pas une surface contaminee.","Changer de gants entre chaque resident et entre une tache sale et une tache propre chez le meme resident. Des gants usages ne se lavent ni ne se desinfectent.","Tenir le linge souille loin de l'uniforme, ne jamais le secouer, ne jamais le poser par terre ni sur le lit d'un autre resident."]}},{"id":"ppe","page":7,"area":"Basic Nursing Skills","en":{"title":"Personal Protective Equipment","points":["Put PPE on in this order: gown, mask, eye protection, gloves. The glove cuffs go over the gown sleeves.","Take PPE off in this order: gloves, eye protection, gown, mask. Gloves are the dirtiest item, so they come off first.","Remove the mask last and by its ties or ear loops only; the front of the mask is contaminated.","Perform hand hygiene immediately after removing all PPE, and again after leaving the room.","A gown is worn once, for one resident, and is discarded in the room. It is never hung up for reuse.","Tears, wet spots or a broken glove mean stop, remove, perform hand hygiene, and re-glove."]},"fr":{"title":"Equipement de protection individuelle","points":["Mettre l'EPI dans cet ordre : blouse, masque, protection oculaire, gants. Les poignets des gants recouvrent les manches de la blouse.","Retirer l'EPI dans cet ordre : gants, protection oculaire, blouse, masque. Les gants sont l'element le plus sale, ils partent en premier.","Retirer le masque en dernier et uniquement par les liens ou les elastiques ; le devant du masque est contamine.","Se laver les mains immediatement apres avoir retire tout l'EPI, puis de nouveau apres avoir quitte la chambre.","Une blouse sert une seule fois, pour un seul resident, et se jette dans la chambre. On ne la suspend jamais pour la reutiliser.","Une dechirure, une zone humide ou un gant perce imposent d'arreter, de retirer, de se laver les mains et de remettre des gants."]}},{"id":"precautions","page":9,"area":"Basic Nursing Skills","en":{"title":"Standard and Transmission-Based Precautions","points":["Standard precautions are used with every resident, every time, regardless of diagnosis. Treat all blood and body fluids as infectious.","Contact precautions add gown and gloves for organisms spread by touch and contaminated surfaces.","Droplet precautions add a mask for organisms spread by coughing, sneezing and talking within a few feet.","Airborne precautions require a fitted respirator and a special room with controlled airflow; the door stays closed.","Dedicated equipment stays in the room. Shared equipment is disinfected between residents.","Isolation is a medical measure, not a punishment. Residents in isolation are at real risk of loneliness and need conversation and contact."]},"fr":{"title":"Precautions standard et precautions selon le mode de transmission","points":["Les precautions standard s'appliquent a chaque resident, chaque fois, quel que soit le diagnostic. Traiter tout sang et tout liquide biologique comme infectieux.","Les precautions contact ajoutent blouse et gants pour les germes transmis par le toucher et les surfaces contaminees.","Les precautions gouttelettes ajoutent un masque pour les germes transmis en toussant, en eternuant et en parlant a courte distance.","Les precautions air exigent un appareil de protection respiratoire ajuste et une chambre a flux d'air controle ; la porte reste fermee.","Le materiel dedie reste dans la chambre. Le materiel partage est desinfecte entre chaque resident.","L'isolement est une mesure medicale, pas une punition. Les residents isoles souffrent reellement de solitude et ont besoin de parole et de contact."]}},{"id":"vitals1","page":11,"area":"Basic Nursing Skills","en":{"title":"Vital Signs: Temperature and Pulse","points":["Average adult oral temperature is about 98.6 degrees F, with a normal range of roughly 97.6 to 99.6.","A rectal reading runs about one degree higher than oral; an axillary (underarm) reading runs about one degree lower.","Never take an oral temperature right after hot or cold drinks, smoking or chewing gum; wait about 15 minutes.","Normal adult pulse is 60 to 100 beats per minute. Below 60 or above 100 is reported to the nurse.","The radial pulse is on the thumb side of the wrist. Count for one full minute if the rhythm is irregular.","Note rate, rhythm and force. A weak, thready or irregular pulse is reported even when the rate is normal.","Never use your thumb to take a pulse; the thumb has its own pulse and you may count your own."]},"fr":{"title":"Signes vitaux : temperature et pouls","points":["La temperature buccale moyenne de l'adulte est d'environ 37 degres C (98,6 F), avec une plage normale d'environ 36,4 a 37,6 C.","La voie rectale donne environ un demi-degre C de plus que la voie buccale ; la voie axillaire environ un demi-degre de moins.","Ne jamais prendre une temperature buccale juste apres une boisson chaude ou froide, du tabac ou du chewing-gum ; attendre environ 15 minutes.","Le pouls normal de l'adulte est de 60 a 100 battements par minute. En dessous de 60 ou au-dessus de 100, prevenir l'infirmiere.","Le pouls radial se prend du cote du pouce au poignet. Compter une minute entiere si le rythme est irregulier.","Noter la frequence, le rythme et la force. Un pouls faible, filant ou irregulier se signale meme si la frequence est normale.","Ne jamais prendre le pouls avec le pouce ; le pouce a son propre pouls et vous risquez de compter le votre."]}},{"id":"vitals2","page":13,"area":"Basic Nursing Skills","en":{"title":"Vital Signs: Respirations and Blood Pressure","points":["Normal adult respirations are 12 to 20 breaths per minute. One respiration is one rise and one fall of the chest.","Count respirations without telling the resident, usually right after the pulse while still holding the wrist, because awareness changes the breathing pattern.","Report noisy, labored or irregular breathing, and any bluish color of the lips or nail beds, immediately.","A typical adult blood pressure is below 120 over 80. Report readings the nurse has set as limits, and any large change from the resident's usual numbers.","The cuff must fit. A cuff that is too narrow reads falsely high; one that is too wide reads falsely low.","Do not take blood pressure on an arm with an IV, a dialysis access, a cast, a recent injury, or on the side of a mastectomy.","The resident should be seated quietly with the arm supported at heart level, feet flat, and no talking during the reading."]},"fr":{"title":"Signes vitaux : respiration et tension arterielle","points":["La respiration normale de l'adulte est de 12 a 20 par minute. Une respiration correspond a une montee et une descente de la poitrine.","Compter les respirations sans le dire au resident, en general juste apres le pouls en gardant le poignet, car le fait de le savoir modifie la respiration.","Signaler immediatement une respiration bruyante, penible ou irreguliere, ainsi qu'une coloration bleutee des levres ou des ongles.","Une tension adulte habituelle est inferieure a 120 sur 80. Signaler les valeurs fixees comme limites par l'infirmiere et tout ecart important par rapport aux chiffres habituels du resident.","Le brassard doit etre a la bonne taille. Un brassard trop etroit donne une valeur faussement elevee, un brassard trop large une valeur faussement basse.","Ne pas prendre la tension sur un bras porteur d'une perfusion, d'un abord de dialyse, d'un platre, d'une blessure recente, ni du cote d'une mastectomie.","Le resident doit etre assis au calme, le bras soutenu a hauteur du coeur, les pieds a plat, sans parler pendant la mesure."]}},{"id":"measure","page":15,"area":"Basic Nursing Skills","en":{"title":"Height, Weight, Intake and Output","points":["Weigh at the same time of day, on the same scale, with similar clothing and after the resident has voided, so changes mean something.","Report a sudden gain or loss. A gain of two to three pounds in a day can mean fluid retention.","Anything liquid at room temperature counts as intake: water, juice, milk, coffee, broth, gelatin, ice cream, popsicles and ice chips.","Ice chips are recorded as about half their volume, because melted ice takes up less space than the packed chips.","Output includes urine, emesis, liquid stool and wound drainage. Measure in a graduate on a flat surface, read at eye level.","Record immediately after measuring, never from memory at the end of the shift."]},"fr":{"title":"Taille, poids, entrees et sorties","points":["Peser a la meme heure, sur la meme balance, avec des vetements comparables et apres que le resident a uriné, pour que les variations aient un sens.","Signaler une prise ou une perte brutale. Une prise de un a un kilo et demi en une journee peut signifier une retention d'eau.","Tout ce qui est liquide a temperature ambiante compte comme entree : eau, jus, lait, cafe, bouillon, gelatine, creme glacee, batonnets glaces et glacons.","Les glacons se notent pour environ la moitie de leur volume, car la glace fondue occupe moins de place que les glacons tasses.","Les sorties comprennent urines, vomissements, selles liquides et ecoulements de plaie. Mesurer dans un pot gradue pose a plat, lecture a hauteur des yeux.","Noter immediatement apres la mesure, jamais de memoire en fin de service."]}},{"id":"hygiene","page":17,"area":"Activities of Daily Living","en":{"title":"Bathing, Grooming and Oral Care","points":["Check water temperature before every bath, shower and bed bath. Aging skin is thin and sensation is often reduced, so water that feels fine to you can burn the resident.","Wash from the cleanest area to the dirtiest, and from the top of the body downward. Rinse and pat dry, especially in skin folds.","Let the resident do everything he or she is able to do. Independence is part of the care, not a delay in it.","Expose only the part being washed. Keep the rest covered for warmth and dignity.","Give oral care at least twice a day, and every two hours for an unconscious resident, who is positioned on the side with the head turned.","Line the sink with a towel or fill it with water before cleaning dentures, and store them in a labeled container with cool water or solution.","Never use hot water on dentures; it warps them. Never cut the nails of a resident with diabetes or poor circulation, report them instead.","Wear gloves for shaving, shave in the direction hair grows, and report any nick immediately."]},"fr":{"title":"Toilette, soins d'apparence et soins de bouche","points":["Verifier la temperature de l'eau avant chaque toilette, chaque bain et chaque douche. La peau agee est fine et la sensibilite souvent diminuee : une eau qui vous semble bonne peut bruler le resident.","Laver du plus propre vers le plus sale, et du haut du corps vers le bas. Rincer et secher en tamponnant, surtout dans les plis.","Laisser le resident faire tout ce dont il est capable. L'autonomie fait partie du soin, elle ne le retarde pas.","Ne decouvrir que la partie lavee. Garder le reste couvert pour la chaleur et la dignite.","Faire les soins de bouche au moins deux fois par jour, et toutes les deux heures chez un resident inconscient, installe sur le cote, tete tournee.","Garnir le lavabo d'une serviette ou le remplir d'eau avant de nettoyer les protheses dentaires, et les ranger dans un recipient etiquete avec de l'eau froide ou une solution.","Jamais d'eau chaude sur les protheses, cela les deforme. Ne jamais couper les ongles d'un resident diabetique ou mal irrigue : les signaler.","Porter des gants pour raser, raser dans le sens du poil, et signaler immediatement toute coupure."]}},{"id":"dressing","page":20,"area":"Activities of Daily Living","en":{"title":"Dressing, Toileting and Perineal Care","points":["Dress the weaker side first and undress the stronger side first, so the affected limb is never forced through a sleeve.","Offer a choice of clothing. Choosing what to wear is a right, and it is often the only choice a resident still controls.","Answer call lights for toileting promptly. Waiting causes incontinence, falls and loss of dignity.","For perineal care, always wash front to back, using a clean area of the cloth with each stroke, to keep bowel organisms away from the urinary opening.","On an uncircumcised male, retract the foreskin, wash, rinse, dry and return it to position to prevent swelling and injury.","Close the door, pull the privacy curtain and keep the resident covered except for the area being washed.","Report redness, swelling, discharge, odor or complaints of burning."]},"fr":{"title":"Habillage, toilettes et soins peri-genitaux","points":["Habiller le cote faible en premier et deshabiller le cote fort en premier, pour ne jamais forcer le membre atteint dans une manche.","Proposer un choix de vetements. Choisir sa tenue est un droit, et c'est souvent le seul choix qui reste au resident.","Repondre vite aux sonnettes pour les toilettes. L'attente provoque incontinence, chutes et perte de dignite.","Pour les soins peri-genitaux, toujours laver d'avant en arriere, avec une partie propre du gant a chaque passage, pour eloigner les germes intestinaux du meat urinaire.","Chez l'homme non circoncis, retracter le prepuce, laver, rincer, secher puis le remettre en place pour eviter gonflement et lesion.","Fermer la porte, tirer le rideau et garder le resident couvert sauf la zone lavee.","Signaler rougeur, gonflement, ecoulement, odeur ou plainte de brulure."]}},{"id":"skin","page":22,"area":"Basic Nursing Skills","en":{"title":"Skin Care and Pressure Injury Prevention","points":["Reposition a resident who cannot move independently at least every two hours in bed, and every hour in a chair.","The first sign of a pressure injury is redness over a bony area that does not turn white when pressed.","Never massage a reddened area. Massage damages tissue that is already injured underneath.","Pressure points to check: heels, ankles, knees, hips, tailbone, elbows, shoulder blades, back of the head and ears.","Keep skin clean and dry, change wet or soiled linen at once, and keep sheets free of wrinkles and crumbs.","Never drag a resident across the sheet. Shearing tears the skin layers. Use a lift sheet and get help.","Report any new redness, blister, open area, bruise or skin tear to the nurse right away."]},"fr":{"title":"Soins de la peau et prevention des escarres","points":["Repositionner (changer de position) un resident qui ne peut pas bouger seul au moins toutes les deux heures au lit, et toutes les heures au fauteuil.","Le premier signe d'escarre est une rougeur sur une zone osseuse qui ne blanchit pas a la pression.","Ne jamais masser une zone rouge. Le massage abime un tissu deja lese en profondeur.","Points d'appui a verifier : talons, chevilles, genoux, hanches, sacrum, coudes, omoplates, arriere de la tete et oreilles.","Garder la peau propre et seche, changer immediatement le linge mouille ou souille, et laisser les draps sans plis ni miettes.","Ne jamais trainer un resident sur le drap. Le cisaillement dechire les couches de la peau. Utiliser un drap de glissement et demander de l'aide.","Signaler tout de suite a l'infirmiere toute rougeur nouvelle, cloque, plaie ouverte, bleu ou dechirure cutanee."]}},{"id":"transfers","page":24,"area":"Basic Nursing Skills","en":{"title":"Positioning, Transfers and Body Mechanics","points":["Bend at the knees and hips, keep your back straight, hold the load close, and keep your feet apart for a wide base.","Never twist your spine. Turn your whole body by moving your feet.","Raise the bed to a comfortable working height when giving care, then lower it to its lowest position before leaving.","Lock the wheels on the bed and the wheelchair before any transfer. Unlocked brakes are a leading cause of falls.","Apply the gait belt snugly over clothing, never on bare skin, with room for a flat hand underneath.","Transfer toward the resident's stronger side, and have the resident hold you around the waist or shoulders, never around the neck.","Count aloud so you and the resident move on the same beat.","Support the head and shoulders when turning, and use pillows to keep alignment after repositioning."]},"fr":{"title":"Installation, transferts et mecanique corporelle","points":["Plier les genoux et les hanches, garder le dos droit, tenir la charge pres de soi et ecarter les pieds pour une base large.","Ne jamais tourner la colonne. Pivoter tout le corps en deplacant les pieds.","Monter le lit a une hauteur de travail confortable pour le soin, puis le redescendre au plus bas avant de partir.","Bloquer les roues du lit et du fauteuil roulant avant tout transfert. Des freins non bloques sont une cause majeure de chutes.","Poser la ceinture de transfert bien ajustee par-dessus les vetements, jamais a meme la peau, en laissant passer une main a plat.","Transferer du cote fort du resident, et lui faire tenir votre taille ou vos epaules, jamais votre cou.","Compter a voix haute pour bouger en meme temps que le resident.","Soutenir la tete et les epaules pendant le retournement, et caler avec des oreillers pour garder l'alignement."]}},{"id":"ambulation","page":26,"area":"Restorative Skills","en":{"title":"Ambulation, Assistive Devices and Fall Prevention","points":["A cane is held on the stronger side and moves forward together with the weaker leg, so the two share the load.","Going up stairs, the stronger leg leads. Going down, the weaker leg leads. Remember: up with the good, down with the bad.","A walker must be lifted or rolled forward first, all four points steady on the ground, before the resident steps into it. The resident never walks ahead of the walker.","Check footwear before walking: non-skid soles, closed heel, properly fastened. Slippers and socks alone cause falls.","Walk slightly behind and to the weaker side, holding the gait belt from underneath.","If a resident starts to fall, do not try to hold them upright. Widen your stance, pull them close, and ease them down your leg to the floor while protecting the head.","After any fall, do not move the resident. Stay with them and call the nurse.","Most falls are preventable: call light in reach, bed low and locked, clear floor, adequate light, prompt toileting."]},"fr":{"title":"Marche, aides techniques et prevention des chutes","points":["La canne se tient du cote fort et avance en meme temps que la jambe faible, pour que les deux se partagent la charge.","En montant un escalier, la jambe forte passe en premier. En descendant, la jambe faible passe en premier. Retenir : monter avec la bonne, descendre avec la mauvaise.","Le deambulateur doit d'abord etre souleve ou roule en avant, ses quatre points stables au sol, avant que le resident n'avance dedans. Le resident ne marche jamais devant le deambulateur.","Verifier les chaussures avant la marche : semelles antiderapantes, talon ferme, bien attachees. Les pantoufles et les chaussettes seules provoquent des chutes.","Marcher legerement en arriere et du cote faible, en tenant la ceinture de transfert par en dessous.","Si un resident commence a tomber, ne pas tenter de le retenir debout. Elargir ses appuis, le ramener contre soi et le laisser glisser le long de sa jambe jusqu'au sol en protegeant la tete.","Apres une chute, ne pas deplacer le resident. Rester aupres de lui et appeler l'infirmiere.","La plupart des chutes sont evitables : sonnette a portee, lit bas et freine, sol degage, eclairage suffisant, passage aux toilettes sans attente."]}},{"id":"nutrition","page":28,"area":"Basic Nursing Skills","en":{"title":"Nutrition, Feeding and Aspiration Precautions","points":["Sit the resident as upright as tolerated, ideally 90 degrees, and keep them upright for at least 30 minutes after eating.","Never feed a resident who is lying flat, and never rush. Offer small bites and allow time to chew and swallow.","Check that the tray matches the resident's name and ordered diet before serving. A wrong diet can be dangerous.","Sit at eye level while feeding. Standing over someone is rushed and undignified.","Alternate solids and liquids, and ask which food the resident wants next rather than deciding for them.","Signs of swallowing trouble include coughing during meals, a wet gurgly voice, pocketing food in the cheek, and drooling. Report them.","For a resident with one-sided weakness, place food in the stronger side of the mouth and check the weak side for pocketed food afterward.","Record the percentage eaten, not a guess like 'ate well'. Report refusals and any change in appetite."]},"fr":{"title":"Nutrition, aide au repas et prevention des fausses routes","points":["Asseoir le resident aussi droit qu'il le supporte, idealement a 90 degres, et le garder assis au moins 30 minutes apres le repas.","Ne jamais faire manger un resident allonge a plat, et ne jamais presser. Proposer de petites bouchees et laisser le temps de macher et d'avaler.","Verifier que le plateau correspond au nom et au regime prescrit avant de servir. Un mauvais regime peut etre dangereux.","S'asseoir a hauteur des yeux pour aider au repas. Rester debout au-dessus de quelqu'un est presse et indigne.","Alterner solides et liquides, et demander quel aliment le resident veut ensuite plutot que de decider a sa place.","Signes de trouble de la deglutition : toux pendant le repas, voix mouillee et gargouillante, aliments stockes dans la joue, bave. Les signaler.","Chez un resident hemiplegique, deposer les aliments du cote fort de la bouche et verifier ensuite le cote faible.","Noter le pourcentage consomme, pas une impression comme « a bien mange ». Signaler les refus et tout changement d'appetit."]}},{"id":"elimination","page":30,"area":"Basic Nursing Skills","en":{"title":"Elimination, Catheters and Bedpans","points":["Keep the urinary drainage bag below the level of the bladder at all times, and never on the floor.","Keep the tubing free of kinks and loops, and never disconnect it. Urine must always flow away from the bladder.","Secure the tubing to the leg so it does not pull. Traction on a catheter causes pain and injury.","Give catheter care daily, washing about four inches of tubing from the body outward, away from the insertion site.","When emptying the bag, do not let the drain spout touch the graduate or the floor. Measure, record and report cloudy urine, blood, sediment or strong odor.","Warm the bedpan, raise the head of the bed if allowed, and give privacy. Leave the call light and toilet paper within reach.","Observe before discarding: color, amount, odor, and anything unusual in urine or stool.","Report no urine output, no bowel movement for three days, diarrhea, or any complaint of burning or urgency."]},"fr":{"title":"Elimination, sondes urinaires et bassins","points":["Garder le sac collecteur toujours plus bas que la vessie, et jamais pose par terre.","Garder la tubulure sans coude ni boucle, et ne jamais la deconnecter. L'urine doit toujours s'eloigner de la vessie.","Fixer la tubulure a la jambe pour qu'elle ne tire pas. Une traction sur la sonde provoque douleur et lesion.","Faire les soins de sonde chaque jour, en lavant environ dix centimetres de tubulure du corps vers l'exterieur, en s'eloignant du point d'insertion.","En vidant le sac, ne pas laisser l'embout toucher le pot gradue ni le sol. Mesurer, noter et signaler urines troubles, sang, depot ou odeur forte.","Rechauffer le bassin, relever la tete du lit si c'est permis, et assurer l'intimite. Laisser la sonnette et le papier a portee.","Observer avant de jeter : couleur, quantite, odeur et tout element inhabituel dans les urines ou les selles.","Signaler une absence d'urine, une absence de selles depuis trois jours, une diarrhee, ou toute plainte de brulure ou d'urgence mictionnelle."]}},{"id":"emergency","page":32,"area":"Basic Nursing Skills","en":{"title":"Emergencies: Choking, Falls, Fire and Sudden Changes","points":["If a choking resident is coughing forcefully and can speak, stay with them and encourage the cough. Do not intervene.","If the cough becomes weak or silent, the resident cannot speak, or clutches the throat, call for help and begin abdominal thrusts if trained and permitted.","In a fire, remember RACE: Rescue anyone in immediate danger, sound the Alarm, Confine the fire by closing doors, then Extinguish or evacuate.","To use an extinguisher, remember PASS: Pull the pin, Aim at the base of the fire, Squeeze the handle, Sweep side to side.","Oxygen supports burning. No smoking, no open flames, no candles. Check that tubing is not kinked, but never change the flow rate; that is the nurse's decision.","Sudden one-sided weakness, facial drooping, slurred speech or confusion may be a stroke. Get the nurse immediately, note the time, and do not give food or drink.","Chest pain, sweating, shortness of breath or grey color need the nurse at once.","If a resident vomits, turn the head to the side so vomit drains out of the mouth instead of into the airway.","During a seizure, do not restrain and do not put anything in the mouth. Protect the head, move furniture away, and time the episode."]},"fr":{"title":"Urgences : etouffement, chutes, incendie et changements brutaux","points":["Si un resident qui s'etouffe tousse fortement et peut parler, rester pres de lui et encourager la toux. Ne pas intervenir.","Si la toux devient faible ou silencieuse, si le resident ne peut plus parler ou porte les mains a la gorge, appeler a l'aide et commencer les compressions abdominales si vous etes forme et autorise.","En cas d'incendie, retenir RACE : sortir (Rescue) toute personne en danger immediat, declencher l'Alarme, Confiner le feu en fermant les portes, puis Eteindre ou evacuer.","Pour l'extincteur, retenir PASS : tirer la goupille, viser la base des flammes, presser la poignee, balayer de gauche a droite.","L'oxygene entretient le feu. Pas de tabac, pas de flamme nue, pas de bougie. Verifier que la tubulure n'est pas pliee, mais ne jamais modifier le debit : c'est la decision de l'infirmiere.","Une faiblesse soudaine d'un cote, un visage qui tombe, une parole pateuse ou une confusion peuvent signaler un AVC. Prevenir l'infirmiere immediatement, noter l'heure, ne rien donner a boire ni a manger.","Douleur thoracique, sueurs, essoufflement ou teint gris exigent l'infirmiere sur-le-champ.","Si un resident vomit, tourner la tete sur le cote pour que le vomi sorte de la bouche au lieu d'aller dans les voies respiratoires.","Pendant une crise convulsive, ne pas maintenir la personne et ne rien mettre dans sa bouche. Proteger la tete, ecarter les meubles et chronometrer la crise."]}},{"id":"restorative","page":35,"area":"Restorative Skills","en":{"title":"Restorative Care and Range of Motion","points":["The goal of restorative care is to keep or regain the highest level of function the resident can reach, not to do things for them.","Range-of-motion exercises keep joints moving and prevent contractures, the permanent shortening that follows disuse.","Active range of motion is done by the resident. Passive range of motion is done by the aide for a resident who cannot move the joint.","Support the joint above and below, move slowly and smoothly, and stop at the point of resistance. Never move a joint through pain.","Repeat each movement the number of times stated in the care plan, usually three to five, and work from the head downward.","Never perform range of motion on a joint that is swollen, red or newly injured, or on the neck unless specifically trained and directed.","Report any new stiffness, pain, swelling or decrease in how far a joint moves."]},"fr":{"title":"Soins de readaptation et amplitude articulaire","points":["Le but des soins de readaptation est de conserver ou de retrouver le meilleur niveau de fonction possible, pas de faire a la place du resident.","Les exercices d'amplitude articulaire gardent les articulations mobiles et previennent les retractions, ce raccourcissement definitif qui suit l'immobilite.","L'amplitude active est realisee par le resident. L'amplitude passive est realisee par l'aide-soignant pour un resident qui ne peut pas bouger l'articulation.","Soutenir l'articulation au-dessus et en dessous, bouger lentement et regulierement, et s'arreter au point de resistance. Ne jamais mobiliser au-dela de la douleur.","Repeter chaque mouvement le nombre de fois indique au plan de soins, en general trois a cinq, en allant de la tete vers le bas.","Ne jamais mobiliser une articulation gonflee, rouge ou recemment blessee, ni le cou sauf formation et consigne precises.","Signaler toute raideur nouvelle, douleur, gonflement ou diminution de l'amplitude."]}},{"id":"mental","page":36,"area":"Emotional and Mental Health Needs","en":{"title":"Mental Health, Dementia and Behavior","points":["Approach from the front, make eye contact, say your name and the resident's name, and give one simple direction at a time.","Do not argue with a resident who has dementia and do not repeatedly correct their reality. Respond to the feeling behind the words and redirect gently.","Sundowning is increased confusion and agitation in the late afternoon and evening. More light, less noise and a steady routine help.","A catastrophic reaction is a sudden outburst from being overwhelmed. Stop the activity, step back, lower the noise, stay calm, and try again later.","Behavior is communication. Agitation often means pain, hunger, a full bladder, cold, fear or too much stimulation. Look for the unmet need.","Wandering is managed with safety and supervision, not restraint. Restraints increase injury, confusion and death.","Withdrawal, appetite loss, sleeping much more, giving away belongings and hopeless statements may be depression. Report them; depression is treatable.","Take any mention of self-harm seriously and report it to the nurse immediately.","Keep the room familiar. Personal photographs and objects orient a person with memory loss better than any sign."]},"fr":{"title":"Sante mentale, demence et comportement","points":["Aborder par l'avant, croiser le regard, dire son nom et celui du resident, et donner une seule consigne simple a la fois.","Ne pas discuter avec un resident atteint de demence et ne pas corriger sans cesse sa realite. Repondre au sentiment derriere les mots et rediriger en douceur.","Le syndrome crepusculaire est une confusion et une agitation accrues en fin de journee et le soir. Plus de lumiere, moins de bruit et une routine stable aident.","La reaction catastrophique est une explosion soudaine due au debordement. Arreter l'activite, reculer, baisser le bruit, rester calme et recommencer plus tard.","Le comportement est un langage. L'agitation signifie souvent douleur, faim, vessie pleine, froid, peur ou trop de stimulation. Chercher le besoin non satisfait.","L'errance se gere par la securite et la surveillance, pas par la contention. Les contentions augmentent les blessures, la confusion et la mortalite.","Repli sur soi, perte d'appetit, sommeil tres augmente, dons d'objets personnels et propos desesperes peuvent signaler une depression. Les signaler : la depression se soigne.","Prendre au serieux toute evocation d'automutilation ou de suicide et la signaler immediatement a l'infirmiere.","Garder la chambre familiere. Les photos et les objets personnels orientent une personne qui perd la memoire mieux que n'importe quel panneau."]}},{"id":"communication","page":38,"area":"Communication","en":{"title":"Communication and Sensory Needs","points":["Face the resident, speak clearly at a normal pace, and reduce background noise. For hearing loss, lowering the noise helps more than raising your voice.","Check that hearing aids are in, switched on and working, and that glasses are clean and on.","For a resident with aphasia after a stroke, allow extra time, use yes-or-no questions, and never finish their sentences for them.","For a resident who is blind or has low vision, announce yourself on entering and before touching, describe what you are about to do, and never move their belongings without telling them.","Open-ended questions invite more than yes or no, and reveal more about how the resident actually is.","Watch nonverbal signals. A resident who says nothing is wrong while turned to the wall and tearful is telling you something.","Report objectively what you observed and measured. 'Ate one quarter of lunch' is a fact; 'seemed depressed' is your interpretation.","Never argue, never use baby talk or pet names like honey and sweetie, and never discuss a resident within anyone else's hearing."]},"fr":{"title":"Communication et besoins sensoriels","points":["Faire face au resident, parler clairement a un rythme normal, et reduire le bruit de fond. En cas de surdite, baisser le bruit aide plus que hausser la voix.","Verifier que les appareils auditifs sont en place, allumes et fonctionnels, et que les lunettes sont propres et portees.","Chez un resident aphasique apres un AVC, laisser plus de temps, poser des questions fermees par oui ou non, et ne jamais terminer ses phrases a sa place.","Chez un resident aveugle ou malvoyant, s'annoncer en entrant et avant de toucher, decrire ce que l'on va faire, et ne jamais deplacer ses affaires sans le dire.","Les questions ouvertes appellent plus qu'un oui ou un non et revelent mieux l'etat reel du resident.","Observer le non-verbal. Un resident qui dit que tout va bien, tourne vers le mur et en larmes, vous dit quelque chose.","Rapporter objectivement ce qui a ete observe et mesure. « A mange un quart du dejeuner » est un fait ; « semblait deprime » est une interpretation.","Ne jamais discuter, ne jamais infantiliser ni utiliser des surnoms comme ma cherie, et ne jamais parler d'un resident a portee d'oreille d'autrui."]}},{"id":"rights","page":40,"area":"Client Rights","en":{"title":"Resident Rights, Abuse Reporting, Law and Ethics","points":["Residents have the right to privacy, dignity, confidentiality, personal possessions, unopened mail, visitors, and to make their own choices.","Residents have the right to refuse any care or treatment, including a bath or a shower. Report and document a refusal; never force, trick or wait until the resident is asleep.","Residents have the right to be free from restraints used for staff convenience or discipline.","Residents have the right to voice grievances without fear of punishment, and to participate in planning their own care.","Confidential information is shared only with those involved in the resident's care, and only in a private place. Not in hallways, elevators, the cafeteria, or on social media.","Abuse may be physical, verbal, psychological, sexual or financial. Neglect is failing to provide needed care. Both are reported immediately, never handled privately.","Assault is threatening someone. Battery is touching without consent. Both apply to care given over a refusal.","Negligence is failing to act as a reasonably careful aide would, causing harm, such as leaving wheelchair brakes unlocked.","Never accept money or valuable gifts, and never take anything belonging to a resident, however small.","Report suspected abuse even when the accused is a coworker, a supervisor or a family member. Waiting leaves the resident in danger."]},"fr":{"title":"Droits du resident, signalement des abus, loi et ethique","points":["Les residents ont droit a l'intimite, a la dignite, a la confidentialite, a leurs effets personnels, a un courrier non ouvert, a des visites et a leurs propres choix.","Les residents ont le droit de refuser tout soin ou traitement, y compris un bain ou une douche. Signaler et documenter le refus ; ne jamais forcer, ruser ni attendre qu'ils dorment.","Les residents ont le droit de ne pas subir de contention utilisee pour la commodite du personnel ou comme punition.","Les residents ont le droit d'exprimer des plaintes sans crainte de represailles et de participer a l'elaboration de leur plan de soins.","Les informations confidentielles se partagent uniquement avec les soignants concernes et dans un lieu prive. Ni dans les couloirs, ni dans l'ascenseur, ni a la cantine, ni sur les reseaux sociaux.","L'abus peut etre physique, verbal, psychologique, sexuel ou financier. La negligence est le defaut de soins necessaires. Les deux se signalent immediatement, jamais en interne entre collegues.","La menace constitue une agression ; le fait de toucher sans consentement constitue une voie de fait. Les deux s'appliquent a un soin impose malgre un refus.","La negligence est le fait de ne pas agir comme un aide-soignant raisonnablement prudent, causant un dommage, par exemple laisser les freins du fauteuil debloques.","Ne jamais accepter d'argent ni de cadeau de valeur, et ne jamais prendre un bien d'un resident, si petit soit-il.","Signaler un abus suspecte meme si la personne mise en cause est un collegue, un superieur ou un membre de la famille. Attendre laisse le resident en danger."]}},{"id":"team","page":43,"area":"Member of the Health Care Team","en":{"title":"The Nurse Aide on the Care Team","points":["The nurse aide works under the supervision of a licensed nurse and follows the care plan developed by the team with the resident.","Know your scope of practice. Nurse aides do not give medications, perform sterile procedures, insert or remove tubes, give tube feedings, or tell a resident or family a diagnosis or prognosis.","If you are asked to do something you have not been trained to do, say so and ask for instruction or reassignment. Doing it anyway endangers the resident and your certificate.","Report a change in condition as soon as you notice it, not at the end of the shift. Delay is what turns a change into an emergency.","Document after care is given, recording only what was actually done and observed. Charting ahead of time is falsification.","Write legibly, use facility-approved abbreviations, never erase or white out; draw one line through an error, initial it, and write the correction.","In the end-of-shift report, give facts the next shift needs: intake and output, skin changes, refusals, behavior changes, complaints of pain.","Be reliable. Arriving on time, staying until relieved, and telling the truth about what you did and did not do are professional duties, not extras."]},"fr":{"title":"L'aide-soignant dans l'equipe de soins","points":["L'aide-soignant travaille sous la supervision d'une infirmiere diplomee et suit le plan de soins elabore par l'equipe avec le resident.","Connaitre son champ d'exercice. L'aide-soignant ne donne pas de medicaments, ne realise pas d'actes steriles, ne pose ni ne retire de sondes, ne fait pas de nutrition par sonde, et n'annonce ni diagnostic ni pronostic.","Si l'on vous demande un geste pour lequel vous n'etes pas forme, le dire et demander une formation ou une reaffectation. Le faire quand meme met en danger le resident et votre certificat.","Signaler un changement d'etat des qu'il est constate, pas en fin de service. Le retard est ce qui transforme un changement en urgence.","Documenter apres le soin, en notant uniquement ce qui a reellement ete fait et observe. Noter a l'avance est une falsification.","Ecrire lisiblement, utiliser les abreviations autorisees par l'etablissement, ne jamais gommer ni effacer ; barrer l'erreur d'un trait, parapher et ecrire la correction.","Dans la transmission de fin de service, donner les faits utiles a l'equipe suivante : entrees et sorties, etat de la peau, refus, changements de comportement, plaintes de douleur.","Etre fiable. Arriver a l'heure, rester jusqu'a la releve et dire la verite sur ce qui a ete fait ou non sont des obligations professionnelles, pas des options."]}}],"q":[{"id":"b1","level":"beginner","ref":"infection","area":"Basic Nursing Skills","a":1,"en":{"q":"What is the single most effective way to prevent the spread of infection?","o":["Wearing gloves at all times","Hand hygiene","Wearing a gown","Opening the windows"],"w":"Hand hygiene breaks the chain of infection where germs most often travel: on hands."},"fr":{"q":"Quel est le moyen le plus efficace pour prevenir la propagation des infections ?","o":["Porter des gants en permanence","L'hygiene des mains","Porter une blouse","Ouvrir les fenetres"],"w":"L'hygiene des mains brise la chaine de transmission la ou les germes circulent le plus : sur les mains."}},{"id":"b2","level":"beginner","ref":"infection","area":"Basic Nursing Skills","a":2,"en":{"q":"How long should the nurse aide wash the hands with soap and water?","o":["5 seconds","10 seconds","At least 20 seconds","At least 2 minutes"],"w":"Twenty seconds of friction with soap is the minimum needed to lift and rinse away organisms."},"fr":{"q":"Combien de temps l'aide-soignant doit-il se laver les mains au savon et a l'eau ?","o":["5 secondes","10 secondes","Au moins 20 secondes","Au moins 2 minutes"],"w":"Vingt secondes de frottement au savon sont le minimum pour decoller et rincer les germes."}},{"id":"b3","level":"beginner","ref":"infection","area":"Basic Nursing Skills","a":1,"en":{"q":"When washing the hands, the fingertips should be pointed:","o":["Upward","Downward","Sideways","It does not matter"],"w":"Pointing down lets water run from the clean forearms toward the fingertips and into the sink."},"fr":{"q":"Pendant le lavage des mains, le bout des doigts doit etre dirige :","o":["Vers le haut","Vers le bas","Sur le cote","Cela n'a pas d'importance"],"w":"Vers le bas, l'eau s'ecoule des avant-bras propres vers les doigts puis dans le lavabo."}},{"id":"b4","level":"beginner","ref":"infection","area":"Basic Nursing Skills","a":2,"en":{"q":"The nurse aide should turn off the faucet using:","o":["The clean bare hand","The elbow only","A clean paper towel","The back of the wrist"],"w":"The handle was touched with dirty hands, so a paper towel keeps freshly washed hands clean."},"fr":{"q":"L'aide-soignant doit fermer le robinet avec :","o":["La main nue propre","Le coude uniquement","Un essuie-tout propre","Le dos du poignet"],"w":"La poignee a ete touchee avec des mains sales : l'essuie-tout garde propres les mains lavees."}},{"id":"b5","level":"beginner","ref":"infection","area":"Basic Nursing Skills","a":1,"en":{"q":"Gloves should be changed:","o":["Once per shift","Between residents and between dirty and clean tasks","Only when torn","Only when visibly soiled"],"w":"Used gloves carry organisms and cannot be washed or sanitized."},"fr":{"q":"Les gants doivent etre changes :","o":["Une fois par service","Entre chaque resident et entre une tache sale et une tache propre","Seulement s'ils sont dechires","Seulement s'ils sont visiblement sales"],"w":"Des gants usages portent des germes et ne peuvent etre ni laves ni desinfectes."}},{"id":"b6","level":"beginner","ref":"infection","area":"Basic Nursing Skills","a":1,"en":{"q":"Soiled linen should be:","o":["Shaken out before bagging","Held away from the uniform","Placed on the floor","Carried under the arm"],"w":"Shaking spreads organisms into the air and contact contaminates the uniform."},"fr":{"q":"Le linge souille doit etre :","o":["Secoue avant d'etre ensache","Tenu loin de l'uniforme","Pose par terre","Porte sous le bras"],"w":"Le secouer disperse les germes dans l'air et le contact contamine l'uniforme."}},{"id":"b7","level":"beginner","ref":"ppe","area":"Basic Nursing Skills","a":1,"en":{"q":"When putting on personal protective equipment, which item goes on FIRST?","o":["Gloves","Gown","Mask","Eye protection"],"w":"Gown first, then mask, then eye protection, then gloves last over the gown cuffs."},"fr":{"q":"En mettant l'equipement de protection, quel element se place EN PREMIER ?","o":["Les gants","La blouse","Le masque","La protection oculaire"],"w":"D'abord la blouse, puis le masque, la protection oculaire, et les gants en dernier par-dessus les manches."}},{"id":"b8","level":"beginner","ref":"ppe","area":"Basic Nursing Skills","a":2,"en":{"q":"When removing personal protective equipment, which item comes off FIRST?","o":["The gown","The mask","The gloves","The eye protection"],"w":"Gloves are the most contaminated item, so they are removed before hands touch anything else."},"fr":{"q":"En retirant l'equipement de protection, quel element s'enleve EN PREMIER ?","o":["La blouse","Le masque","Les gants","La protection oculaire"],"w":"Les gants sont l'element le plus contamine : ils partent avant que les mains touchent autre chose."}},{"id":"b9","level":"beginner","ref":"ppe","area":"Basic Nursing Skills","a":2,"en":{"q":"A disposable gown should be:","o":["Hung behind the door for reuse","Worn for the whole hall","Used once and discarded in the room","Folded and kept in the pocket"],"w":"One gown, one resident, discarded before leaving the room."},"fr":{"q":"Une blouse jetable doit etre :","o":["Suspendue derriere la porte pour etre reutilisee","Portee pour tout le couloir","Utilisee une fois et jetee dans la chambre","Pliee et gardee dans la poche"],"w":"Une blouse, un resident, jetee avant de quitter la chambre."}},{"id":"b10","level":"beginner","ref":"precautions","area":"Basic Nursing Skills","a":1,"en":{"q":"Standard precautions are used:","o":["Only with residents who have an infection","With every resident, every time","Only in isolation rooms","Only when blood is visible"],"w":"All blood and body fluids are treated as infectious regardless of diagnosis."},"fr":{"q":"Les precautions standard s'appliquent :","o":["Seulement aux residents infectes","A chaque resident, a chaque fois","Seulement en chambre d'isolement","Seulement quand du sang est visible"],"w":"Tout sang et liquide biologique est traite comme infectieux, quel que soit le diagnostic."}},{"id":"b11","level":"beginner","ref":"vitals1","area":"Basic Nursing Skills","a":1,"en":{"q":"A normal adult oral temperature is closest to:","o":["96.0 F / 35.5 C","98.6 F / 37 C","100.4 F / 38 C","101.0 F / 38.3 C"],"w":"98.6 F, or 37 C, is the usual average for an oral temperature."},"fr":{"q":"La temperature buccale normale d'un adulte est proche de :","o":["35,5 C","37 C","38 C","38,3 C"],"w":"37 C est la moyenne habituelle pour une temperature buccale."}},{"id":"b12","level":"beginner","ref":"vitals1","area":"Basic Nursing Skills","a":1,"en":{"q":"A normal adult resting pulse is:","o":["40 to 60 beats per minute","60 to 100 beats per minute","100 to 120 beats per minute","120 to 140 beats per minute"],"w":"Sixty to one hundred is the accepted adult range; outside it is reported."},"fr":{"q":"Le pouls normal d'un adulte au repos est de :","o":["40 a 60 battements par minute","60 a 100 battements par minute","100 a 120 battements par minute","120 a 140 battements par minute"],"w":"Soixante a cent est la plage adulte admise ; en dehors, on signale."}},{"id":"b13","level":"beginner","ref":"vitals1","area":"Basic Nursing Skills","a":1,"en":{"q":"The radial pulse is located:","o":["At the side of the neck","On the thumb side of the wrist","Behind the knee","On the top of the foot"],"w":"The radial artery runs along the thumb side of the wrist."},"fr":{"q":"Le pouls radial se situe :","o":["Sur le cote du cou","Du cote du pouce au poignet","Derriere le genou","Sur le dessus du pied"],"w":"L'artere radiale passe du cote du pouce au poignet."}},{"id":"b14","level":"beginner","ref":"vitals1","area":"Basic Nursing Skills","a":2,"en":{"q":"The nurse aide should never take a pulse using:","o":["The index finger","The middle finger","The thumb","Two fingers together"],"w":"The thumb has its own pulse, so you may count your own by mistake."},"fr":{"q":"L'aide-soignant ne doit jamais prendre le pouls avec :","o":["L'index","Le majeur","Le pouce","Deux doigts ensemble"],"w":"Le pouce a son propre pouls : on risque de compter le sien."}},{"id":"b15","level":"beginner","ref":"vitals2","area":"Basic Nursing Skills","a":1,"en":{"q":"A normal adult respiratory rate at rest is:","o":["6 to 10 per minute","12 to 20 per minute","22 to 30 per minute","30 to 40 per minute"],"w":"Twelve to twenty breaths per minute is normal for a resting adult."},"fr":{"q":"La frequence respiratoire normale d'un adulte au repos est de :","o":["6 a 10 par minute","12 a 20 par minute","22 a 30 par minute","30 a 40 par minute"],"w":"Douze a vingt respirations par minute est la normale chez l'adulte au repos."}},{"id":"b16","level":"beginner","ref":"vitals2","area":"Basic Nursing Skills","a":2,"en":{"q":"One respiration is counted as:","o":["One breath in only","One breath out only","One rise and one fall of the chest","Two rises of the chest"],"w":"A complete respiration is one inhalation plus one exhalation."},"fr":{"q":"Une respiration se compte comme :","o":["Une inspiration seulement","Une expiration seulement","Une montee et une descente de la poitrine","Deux montees de la poitrine"],"w":"Une respiration complete est une inspiration plus une expiration."}},{"id":"b17","level":"beginner","ref":"vitals2","area":"Basic Nursing Skills","a":1,"en":{"q":"Respirations are counted without telling the resident because:","o":["It is faster","People change their breathing when they know it is watched","The resident may refuse","Talking raises the temperature"],"w":"Breathing is partly voluntary, so awareness changes what you are measuring."},"fr":{"q":"On compte les respirations sans le dire au resident parce que :","o":["C'est plus rapide","On modifie sa respiration quand on sait qu'elle est observee","Le resident pourrait refuser","Parler fait monter la temperature"],"w":"La respiration est en partie volontaire : le fait de le savoir modifie la mesure."}},{"id":"b18","level":"beginner","ref":"measure","area":"Basic Nursing Skills","a":1,"en":{"q":"Which of the following is recorded as fluid intake?","o":["A slice of bread","A serving of gelatin","A boiled egg","A banana"],"w":"Anything liquid at room temperature counts, including gelatin, ice cream and ice chips."},"fr":{"q":"Lequel de ces elements se note comme entree liquide ?","o":["Une tranche de pain","Une portion de gelatine","Un oeuf dur","Une banane"],"w":"Tout ce qui est liquide a temperature ambiante compte, y compris gelatine, creme glacee et glacons."}},{"id":"b19","level":"beginner","ref":"measure","area":"Basic Nursing Skills","a":2,"en":{"q":"A resident should be weighed:","o":["At any convenient time","After every meal","At the same time of day on the same scale","Only on admission"],"w":"Same time, same scale and similar clothing make a change in weight meaningful."},"fr":{"q":"Un resident doit etre pese :","o":["A n'importe quel moment pratique","Apres chaque repas","A la meme heure et sur la meme balance","Seulement a l'admission"],"w":"Meme heure, meme balance et vetements comparables donnent un sens a la variation."}},{"id":"b20","level":"beginner","ref":"hygiene","area":"Activities of Daily Living","a":2,"en":{"q":"Before giving a bed bath, the nurse aide must:","o":["Open the window","Remove all pillows","Check the water temperature","Turn off the call light"],"w":"Aging skin is thin and sensation reduced, so water that feels fine to you can burn."},"fr":{"q":"Avant une toilette au lit, l'aide-soignant doit :","o":["Ouvrir la fenetre","Retirer tous les oreillers","Verifier la temperature de l'eau","Eteindre la sonnette"],"w":"La peau agee est fine et peu sensible : une eau qui vous semble bonne peut bruler."}},{"id":"b21","level":"beginner","ref":"hygiene","area":"Activities of Daily Living","a":1,"en":{"q":"During a bed bath, the nurse aide should wash:","o":["From the dirtiest to the cleanest area","From the cleanest to the dirtiest area","In any order","The feet first"],"w":"Washing clean to dirty keeps organisms from being carried to clean skin."},"fr":{"q":"Pendant une toilette au lit, l'aide-soignant doit laver :","o":["Du plus sale au plus propre","Du plus propre au plus sale","Dans n'importe quel ordre","Les pieds en premier"],"w":"Laver du propre vers le sale evite de transporter les germes vers une peau propre."}},{"id":"b22","level":"beginner","ref":"hygiene","area":"Activities of Daily Living","a":1,"en":{"q":"Oral care for a conscious resident should be given at least:","o":["Once a week","Twice a day","Once a month","Only on request"],"w":"Twice daily is the minimum; an unconscious resident needs care every two hours."},"fr":{"q":"Les soins de bouche d'un resident conscient doivent etre faits au moins :","o":["Une fois par semaine","Deux fois par jour","Une fois par mois","Sur demande seulement"],"w":"Deux fois par jour est le minimum ; un resident inconscient en a besoin toutes les deux heures."}},{"id":"b23","level":"beginner","ref":"hygiene","area":"Activities of Daily Living","a":1,"en":{"q":"When cleaning dentures, the sink should be:","o":["Left empty","Lined with a towel or filled with water","Filled with hot water","Covered with a lid"],"w":"Dentures shatter easily; padding or water cushions a drop, and hot water warps them."},"fr":{"q":"Pour nettoyer des protheses dentaires, le lavabo doit etre :","o":["Laisse vide","Garni d'une serviette ou rempli d'eau","Rempli d'eau chaude","Recouvert d'un couvercle"],"w":"Les protheses se brisent facilement ; la serviette ou l'eau amortit la chute, et l'eau chaude les deforme."}},{"id":"b24","level":"beginner","ref":"dressing","area":"Activities of Daily Living","a":1,"en":{"q":"When dressing a resident with a weak right arm, the nurse aide dresses:","o":["The left arm first","The right arm first","Both at once","Whichever is easier"],"w":"Dress the weaker side first; undress the stronger side first."},"fr":{"q":"Pour habiller un resident dont le bras droit est faible, l'aide-soignant habille :","o":["Le bras gauche en premier","Le bras droit en premier","Les deux en meme temps","Le plus facile d'abord"],"w":"On habille le cote faible en premier ; on deshabille le cote fort en premier."}},{"id":"b25","level":"beginner","ref":"dressing","area":"Activities of Daily Living","a":1,"en":{"q":"Perineal care is always performed:","o":["From back to front","From front to back","In a circular motion","From the outside inward"],"w":"Front to back keeps bowel organisms away from the urinary opening."},"fr":{"q":"Les soins peri-genitaux se font toujours :","o":["D'arriere en avant","D'avant en arriere","En mouvement circulaire","De l'exterieur vers l'interieur"],"w":"D'avant en arriere pour eloigner les germes intestinaux du meat urinaire."}},{"id":"b26","level":"beginner","ref":"dressing","area":"Activities of Daily Living","a":2,"en":{"q":"To protect privacy during personal care, the nurse aide should:","o":["Work quickly with the door open","Ask others to wait outside the room","Close the door and pull the privacy curtain","Turn off the lights"],"w":"Privacy during care is a legal right, protected by the door, the curtain and covering."},"fr":{"q":"Pour proteger l'intimite pendant un soin, l'aide-soignant doit :","o":["Travailler vite avec la porte ouverte","Demander aux autres d'attendre dehors","Fermer la porte et tirer le rideau","Eteindre la lumiere"],"w":"L'intimite pendant le soin est un droit, protege par la porte, le rideau et la couverture."}},{"id":"b27","level":"beginner","ref":"skin","area":"Basic Nursing Skills","a":2,"en":{"q":"A resident who cannot move independently should be repositioned at least every:","o":["30 minutes","1 hour","2 hours","6 hours"],"w":"Every two hours in bed relieves pressure before tissue damage begins."},"fr":{"q":"Un resident qui ne peut pas bouger seul doit etre repositionne au moins toutes les :","o":["30 minutes","1 heure","2 heures","6 heures"],"w":"Toutes les deux heures au lit soulage la pression avant que les tissus ne souffrent."}},{"id":"b28","level":"beginner","ref":"skin","area":"Basic Nursing Skills","a":2,"en":{"q":"The first sign of a pressure injury is:","o":["An open wound","A blister","Redness that does not turn white when pressed","Black tissue"],"w":"Non-blanchable redness over a bony area is the earliest warning."},"fr":{"q":"Le premier signe d'une escarre est :","o":["Une plaie ouverte","Une cloque","Une rougeur qui ne blanchit pas a la pression","Un tissu noir"],"w":"Une rougeur qui ne blanchit pas sur une zone osseuse est le signe le plus precoce."}},{"id":"b29","level":"beginner","ref":"skin","area":"Basic Nursing Skills","a":3,"en":{"q":"When a reddened area is found over a bony prominence, the nurse aide should:","o":["Massage it","Apply powder","Cover it with tape","Report it to the nurse"],"w":"Never massage: it damages tissue already injured underneath. Report instead."},"fr":{"q":"Devant une rougeur sur une saillie osseuse, l'aide-soignant doit :","o":["La masser","Y mettre du talc","La couvrir de sparadrap","La signaler a l'infirmiere"],"w":"Ne jamais masser : cela abime un tissu deja lese en profondeur. Il faut signaler."}},{"id":"b30","level":"beginner","ref":"transfers","area":"Basic Nursing Skills","a":1,"en":{"q":"When lifting, the nurse aide should:","o":["Bend at the waist","Bend at the knees and hips","Keep the feet together","Hold the load away from the body"],"w":"Bending at the knees and hips uses leg muscles and protects the back."},"fr":{"q":"Pour soulever, l'aide-soignant doit :","o":["Se plier a la taille","Plier les genoux et les hanches","Garder les pieds serres","Tenir la charge loin du corps"],"w":"Plier les genoux et les hanches fait travailler les jambes et protege le dos."}},{"id":"b31","level":"beginner","ref":"transfers","area":"Basic Nursing Skills","a":2,"en":{"q":"Before transferring a resident to a wheelchair, the nurse aide must:","o":["Remove the armrests","Raise the bed to its highest position","Lock the wheels of the bed and the chair","Remove the resident's shoes"],"w":"Unlocked brakes are a leading cause of transfer falls."},"fr":{"q":"Avant de transferer un resident au fauteuil roulant, l'aide-soignant doit :","o":["Retirer les accoudoirs","Monter le lit au plus haut","Bloquer les roues du lit et du fauteuil","Retirer les chaussures du resident"],"w":"Des freins non bloques sont une cause majeure de chute pendant le transfert."}},{"id":"b32","level":"beginner","ref":"transfers","area":"Basic Nursing Skills","a":1,"en":{"q":"A gait belt should be applied:","o":["Against bare skin","Snugly over clothing at the waist","Loosely around the chest","Around the neck"],"w":"Over clothing, snug enough for a flat hand underneath."},"fr":{"q":"La ceinture de transfert se pose :","o":["A meme la peau","Bien ajustee par-dessus les vetements, a la taille","Lachement autour de la poitrine","Autour du cou"],"w":"Par-dessus les vetements, assez serree pour laisser passer une main a plat."}},{"id":"b33","level":"beginner","ref":"transfers","area":"Basic Nursing Skills","a":2,"en":{"q":"Before leaving a resident's room, the bed should be:","o":["In the highest position","Tilted head down","In the lowest position with wheels locked","At the aide's waist height"],"w":"A low, locked bed with the call light in reach prevents falls."},"fr":{"q":"Avant de quitter la chambre, le lit doit etre :","o":["En position haute","Incline tete en bas","En position basse avec les roues bloquees","A hauteur de la taille de l'aide"],"w":"Un lit bas et freine, avec la sonnette a portee, previent les chutes."}},{"id":"b34","level":"beginner","ref":"ambulation","area":"Restorative Skills","a":1,"en":{"q":"A resident using a cane should hold it:","o":["On the weaker side","On the stronger side","In front with both hands","Behind the body"],"w":"The cane goes on the strong side and advances with the weak leg."},"fr":{"q":"Un resident qui utilise une canne doit la tenir :","o":["Du cote faible","Du cote fort","Devant lui a deux mains","Derriere le corps"],"w":"La canne se tient du cote fort et avance avec la jambe faible."}},{"id":"b35","level":"beginner","ref":"ambulation","area":"Restorative Skills","a":2,"en":{"q":"Before walking with a resident, the nurse aide should check that the resident is wearing:","o":["Loose slippers","Socks only","Non-skid footwear","Sandals"],"w":"Non-skid shoes with a closed heel prevent slips; slippers and socks cause falls."},"fr":{"q":
