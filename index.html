"Avant de faire marcher un resident, l'aide-soignant verifie qu'il porte :","o":["Des pantoufles larges","Des chaussettes seulement","Des chaussures antiderapantes","Des sandales"],"w":"Des chaussures antiderapantes a talon ferme evitent les glissades ; pantoufles et chaussettes font tomber."}},{"id":"b36","level":"beginner","ref":"ambulation","area":"Restorative Skills","a":1,"en":{"q":"If a resident begins to fall while walking, the nurse aide should:","o":["Hold the resident upright","Ease the resident to the floor, protecting the head","Step away","Grab the resident's arm and pull"],"w":"Holding an adult upright injures both people; a controlled slide to the floor is safest."},"fr":{"q":"Si un resident commence a tomber pendant la marche, l'aide-soignant doit :","o":["Le maintenir debout","L'accompagner doucement au sol en protegeant sa tete","S'ecarter","Le tirer par le bras"],"w":"Retenir un adulte debout blesse les deux ; l'accompagner au sol de facon controlee est le plus sur."}},{"id":"b37","level":"beginner","ref":"nutrition","area":"Basic Nursing Skills","a":1,"en":{"q":"A resident who must eat in bed should be positioned:","o":["Flat on the back","Sitting upright as near 90 degrees as tolerated","On the left side","Flat with the head turned"],"w":"Upright lets food travel down by gravity and reduces aspiration risk."},"fr":{"q":"Un resident qui doit manger au lit doit etre installe :","o":["A plat sur le dos","Assis le plus droit possible, proche de 90 degres","Sur le cote gauche","A plat, tete tournee"],"w":"La position assise laisse les aliments descendre par gravite et reduit le risque de fausse route."}},{"id":"b38","level":"beginner","ref":"nutrition","area":"Basic Nursing Skills","a":2,"en":{"q":"Before serving a meal tray, the nurse aide should check:","o":["The temperature of the room","Whether the resident is hungry","The name and the ordered diet on the tray card","The time of the last meal"],"w":"Serving the wrong diet can be dangerous, so the card is checked every time."},"fr":{"q":"Avant de servir un plateau repas, l'aide-soignant doit verifier :","o":["La temperature de la chambre","Si le resident a faim","Le nom et le regime prescrit sur la fiche du plateau","L'heure du dernier repas"],"w":"Servir un mauvais regime peut etre dangereux : la fiche se verifie a chaque fois."}},{"id":"b39","level":"beginner","ref":"nutrition","area":"Basic Nursing Skills","a":2,"en":{"q":"After a meal, a resident at risk of aspiration should remain upright for at least:","o":["5 minutes","10 minutes","30 minutes","3 hours"],"w":"Thirty minutes upright lets the stomach empty and reduces reflux and aspiration."},"fr":{"q":"Apres le repas, un resident a risque de fausse route doit rester assis au moins :","o":["5 minutes","10 minutes","30 minutes","3 heures"],"w":"Trente minutes assis laissent l'estomac se vider et reduisent le reflux et la fausse route."}},{"id":"b40","level":"beginner","ref":"elimination","area":"Basic Nursing Skills","a":1,"en":{"q":"A urinary drainage bag must always be kept:","o":["Above the bladder","Below the level of the bladder","On the floor","Hanging on the side rail"],"w":"Gravity must carry urine away from the bladder; a raised bag lets it flow back."},"fr":{"q":"Un sac collecteur d'urine doit toujours etre place :","o":["Au-dessus de la vessie","Plus bas que la vessie","Sur le sol","Accroche a la barriere du lit"],"w":"La gravite doit eloigner l'urine de la vessie ; un sac releve la fait refluer."}},{"id":"b41","level":"beginner","ref":"elimination","area":"Basic Nursing Skills","a":2,"en":{"q":"Before giving a resident a bedpan, the nurse aide should:","o":["Chill it","Leave the door open","Warm it and provide privacy","Fill it with water"],"w":"A cold pan is uncomfortable, and privacy is a right during elimination."},"fr":{"q":"Avant de donner un bassin a un resident, l'aide-soignant doit :","o":["Le refroidir","Laisser la porte ouverte","Le rechauffer et assurer l'intimite","Le remplir d'eau"],"w":"Un bassin froid est desagreable, et l'intimite est un droit pendant l'elimination."}},{"id":"b42","level":"beginner","ref":"emergency","area":"Basic Nursing Skills","a":1,"en":{"q":"A resident is choking but coughing forcefully and can speak. The nurse aide should:","o":["Begin abdominal thrusts","Encourage the resident to keep coughing","Give water","Lay the resident flat"],"w":"A forceful cough is more effective than anything the aide can do; intervene only if it weakens."},"fr":{"q":"Un resident s'etouffe mais tousse fortement et peut parler. L'aide-soignant doit :","o":["Commencer les compressions abdominales","L'encourager a continuer de tousser","Lui donner de l'eau","L'allonger a plat"],"w":"Une toux forte est plus efficace que tout geste de l'aide ; n'intervenir que si elle faiblit."}},{"id":"b43","level":"beginner","ref":"emergency","area":"Basic Nursing Skills","a":1,"en":{"q":"In the fire-safety word RACE, the A stands for:","o":["Assist","Alarm","Assess","Avoid"],"w":"Rescue, Alarm, Confine, Extinguish or evacuate."},"fr":{"q":"Dans le mot RACE pour la securite incendie, le A signifie :","o":["Aider","Alarme","Analyser","Eviter"],"w":"Sortir les personnes, declencher l'Alarme, Confiner, puis Eteindre ou evacuer."}},{"id":"b44","level":"beginner","ref":"emergency","area":"Basic Nursing Skills","a":2,"en":{"q":"A resident is receiving oxygen. The nurse aide should:","o":["Adjust the flow rate as needed","Remove the tubing at meals","Keep open flames out of the room","Turn it off at night"],"w":"Oxygen supports combustion; the flow rate is never changed by the nurse aide."},"fr":{"q":"Un resident recoit de l'oxygene. L'aide-soignant doit :","o":["Ajuster le debit si besoin","Retirer la tubulure aux repas","Interdire toute flamme dans la chambre","L'eteindre la nuit"],"w":"L'oxygene entretient le feu ; le debit n'est jamais modifie par l'aide-soignant."}},{"id":"b45","level":"beginner","ref":"emergency","area":"Basic Nursing Skills","a":1,"en":{"q":"If a resident vomits while lying in bed, the nurse aide should first:","o":["Leave to get the nurse","Turn the resident's head to the side","Offer water","Take the blood pressure"],"w":"Turning the head lets vomit drain out of the mouth instead of into the airway."},"fr":{"q":"Si un resident vomit couche dans son lit, l'aide-soignant doit d'abord :","o":["Partir chercher l'infirmiere","Tourner sa tete sur le cote","Lui donner a boire","Prendre sa tension"],"w":"Tourner la tete laisse le vomi sortir de la bouche au lieu d'aller dans les voies respiratoires."}},{"id":"b46","level":"beginner","ref":"restorative","area":"Restorative Skills","a":1,"en":{"q":"The main purpose of range-of-motion exercises is to:","o":["Build muscle size","Keep joints moving and prevent contractures","Improve appetite","Lower the pulse"],"w":"Unused joints stiffen and can become permanently fixed."},"fr":{"q":"Le but principal des exercices d'amplitude articulaire est de :","o":["Augmenter le volume musculaire","Garder les articulations mobiles et prevenir les retractions","Ameliorer l'appetit","Faire baisser le pouls"],"w":"Une articulation inutilisee se raidit et peut se bloquer definitivement."}},{"id":"b47","level":"beginner","ref":"mental","area":"Emotional and Mental Health Needs","a":1,"en":{"q":"A resident with dementia should be approached:","o":["From behind, quietly","From the front, with eye contact","Quickly, to save time","Only with two staff members"],"w":"Approaching from the front with eye contact and a name prevents startling and fear."},"fr":{"q":"Un resident atteint de demence doit etre aborde :","o":["Par derriere, sans bruit","Par devant, en croisant son regard","Rapidement, pour gagner du temps","Toujours a deux soignants"],"w":"Aborder par devant, en croisant le regard et en nommant, evite la surprise et la peur."}},{"id":"b48","level":"beginner","ref":"communication","area":"Communication","a":1,"en":{"q":"When speaking with a resident who has hearing loss, the nurse aide should:","o":["Shout from the doorway","Face the resident and reduce background noise","Speak very quickly","Cover the mouth"],"w":"Facing the resident allows lip reading; lowering noise helps more than volume."},"fr":{"q":"Avec un resident malentendant, l'aide-soignant doit :","o":["Crier depuis la porte","Lui faire face et reduire le bruit de fond","Parler tres vite","Se couvrir la bouche"],"w":"Lui faire face permet la lecture labiale ; baisser le bruit aide plus que le volume."}},{"id":"b49","level":"beginner","ref":"rights","area":"Client Rights","a":2,"en":{"q":"A resident refuses to be weighed. The nurse aide should:","o":["Weigh the resident anyway","Wait until the resident is asleep","Accept the refusal and tell the nurse","Tell the resident there is no choice"],"w":"Residents have the right to refuse care; the refusal is reported and documented."},"fr":{"q":"Un resident refuse d'etre pese. L'aide-soignant doit :","o":["Le peser quand meme","Attendre qu'il dorme","Accepter le refus et prevenir l'infirmiere","Lui dire qu'il n'a pas le choix"],"w":"Le resident a le droit de refuser un soin ; le refus se signale et se documente."}},{"id":"b50","level":"beginner","ref":"rights","area":"Client Rights","a":1,"en":{"q":"A resident's mail should be:","o":["Opened and read to the resident","Given to the resident unopened","Given to the family","Held at the nurses' station"],"w":"Residents have the right to receive mail unopened."},"fr":{"q":"Le courrier d'un resident doit etre :","o":["Ouvert et lu au resident","Remis au resident, non ouvert","Donne a la famille","Garde au poste de soins"],"w":"Le resident a le droit de recevoir son courrier non ouvert."}},{"id":"b51","level":"beginner","ref":"team","area":"Member of the Health Care Team","a":1,"en":{"q":"A nurse aide may NOT:","o":["Take vital signs","Give medications","Assist with bathing","Feed a resident"],"w":"Administering medication is outside the nurse aide's scope of practice."},"fr":{"q":"Un aide-soignant ne peut PAS :","o":["Prendre les signes vitaux","Donner des medicaments","Aider a la toilette","Faire manger un resident"],"w":"L'administration de medicaments sort du champ d'exercice de l'aide-soignant."}},{"id":"i1","level":"intermediate","ref":"infection","area":"Basic Nursing Skills","a":1,"en":{"q":"The nurse aide finishes perineal care and is about to set up the resident's breakfast tray. The aide should:","o":["Keep the same gloves on since it is the same resident","Remove gloves, perform hand hygiene, and apply clean gloves","Rinse the gloves with alcohol gel","Wipe the gloves on a paper towel"],"w":"Gloves are changed between a dirty task and a clean task even for the same resident."},"fr":{"q":"L'aide-soignant termine des soins peri-genitaux et s'apprete a installer le plateau du petit-dejeuner. Il doit :","o":["Garder les memes gants puisque c'est le meme resident","Retirer les gants, se laver les mains et mettre des gants propres","Rincer les gants au gel hydro-alcoolique","Essuyer les gants sur un essuie-tout"],"w":"On change de gants entre une tache sale et une tache propre, meme chez le meme resident."}},{"id":"i2","level":"intermediate","ref":"infection","area":"Basic Nursing Skills","a":2,"en":{"q":"Alcohol-based hand rub is NOT sufficient when:","o":["The aide has just arrived on the unit","Gloves were worn","Caring for a resident with diarrhea","Before serving trays"],"w":"Spore-forming organisms that cause diarrhea are not killed by alcohol; soap and water are required."},"fr":{"q":"La solution hydro-alcoolique n'est PAS suffisante quand :","o":["L'aide vient d'arriver dans le service","Des gants ont ete portes","On soigne un resident qui a la diarrhee","On sert les plateaux"],"w":"Les germes sporules responsables de diarrhees resistent a l'alcool ; le savon et l'eau sont obligatoires."}},{"id":"i3","level":"intermediate","ref":"ppe","area":"Basic Nursing Skills","a":3,"en":{"q":"A resident is on droplet precautions. In addition to standard precautions, the nurse aide needs:","o":["A fitted respirator","Gown and gloves only","Shoe covers","A mask"],"w":"Droplet precautions add a mask for organisms spread by coughing, sneezing and talking."},"fr":{"q":"Un resident est en precautions gouttelettes. En plus des precautions standard, l'aide-soignant a besoin :","o":["D'un appareil respiratoire ajuste","D'une blouse et de gants seulement","De surchaussures","D'un masque"],"w":"Les precautions gouttelettes ajoutent un masque pour les germes transmis en toussant, eternuant et parlant."}},{"id":"i4","level":"intermediate","ref":"precautions","area":"Basic Nursing Skills","a":2,"en":{"q":"A resident in isolation tells the nurse aide he feels forgotten. The aide should:","o":["Explain that isolation cannot be changed","Limit time in the room to reduce risk","Spend time talking with him while wearing the required PPE","Ask the family to visit less often"],"w":"Isolation is a medical measure, not a punishment; loneliness is a real and preventable harm."},"fr":{"q":"Un resident isole dit a l'aide-soignant qu'il se sent oublie. L'aide doit :","o":["Expliquer que l'isolement ne peut pas changer","Limiter le temps passe dans la chambre","Passer du temps a lui parler en portant l'EPI requis","Demander a la famille de venir moins souvent"],"w":"L'isolement est une mesure medicale, pas une punition ; la solitude est un prejudice reel et evitable."}},{"id":"i5","level":"intermediate","ref":"vitals1","area":"Basic Nursing Skills","a":2,"en":{"q":"An oral temperature should not be taken right after the resident has:","o":["Walked to the bathroom","Been repositioned","Had a hot drink","Had a bath"],"w":"Hot or cold intake, smoking and gum change the oral reading; wait about 15 minutes."},"fr":{"q":"On ne doit pas prendre une temperature buccale juste apres que le resident a :","o":["Marche jusqu'aux toilettes","Ete repositionne","Bu une boisson chaude","Pris un bain"],"w":"Boisson chaude ou froide, tabac et chewing-gum faussent la mesure buccale ; attendre environ 15 minutes."}},{"id":"i6","level":"intermediate","ref":"vitals1","area":"Basic Nursing Skills","a":1,"en":{"q":"A resident's pulse is irregular. The nurse aide should count it for:","o":["15 seconds and multiply by four","A full minute","30 seconds and multiply by two","10 seconds and multiply by six"],"w":"An irregular rhythm cannot be extrapolated from a short count; a full minute is required."},"fr":{"q":"Le pouls d'un resident est irregulier. L'aide-soignant doit le compter pendant :","o":["15 secondes en multipliant par quatre","Une minute entiere","30 secondes en multipliant par deux","10 secondes en multipliant par six"],"w":"Un rythme irregulier ne peut pas etre extrapole d'un comptage court ; il faut une minute entiere."}},{"id":"i7","level":"intermediate","ref":"vitals2","area":"Basic Nursing Skills","a":1,"en":{"q":"A blood pressure cuff that is too narrow for the resident's arm will give a reading that is:","o":["Falsely low","Falsely high","Accurate","Impossible to obtain"],"w":"A small cuff must be inflated harder to compress the artery, reporting a higher pressure than the true one."},"fr":{"q":"Un brassard trop etroit pour le bras du resident donnera une valeur :","o":["Faussement basse","Faussement elevee","Exacte","Impossible a obtenir"],"w":"Un brassard trop petit doit etre gonfle davantage pour comprimer l'artere, ce qui surestime la tension."}},{"id":"i8","level":"intermediate","ref":"vitals2","area":"Basic Nursing Skills","a":2,"en":{"q":"Blood pressure should NOT be taken on an arm that:","o":["Is the resident's dominant arm","Has a watch on it","Has a dialysis access site","Was used yesterday"],"w":"Avoid an arm with an IV, dialysis access, cast, injury, or on the side of a mastectomy."},"fr":{"q":"On ne doit PAS prendre la tension sur un bras qui :","o":["Est le bras dominant du resident","Porte une montre","Porte un abord de dialyse","A servi hier"],"w":"Eviter un bras avec perfusion, abord de dialyse, platre, blessure, ou du cote d'une mastectomie."}},{"id":"i9","level":"intermediate","ref":"measure","area":"Basic Nursing Skills","a":2,"en":{"q":"A resident has gained three pounds since yesterday. The nurse aide should:","o":["Record it and say nothing","Reweigh tomorrow","Report it to the nurse","Reduce the resident's fluids"],"w":"A rapid gain often means fluid retention, which the nurse must evaluate."},"fr":{"q":"Un resident a pris un kilo et demi depuis hier. L'aide-soignant doit :","o":["Le noter sans rien dire","Repeser demain","Le signaler a l'infirmiere","Reduire ses boissons"],"w":"Une prise rapide signifie souvent une retention d'eau, que l'infirmiere doit evaluer."}},{"id":"i10","level":"intermediate","ref":"measure","area":"Basic Nursing Skills","a":1,"en":{"q":"Ice chips are recorded as intake at:","o":["Their full measured volume","About half their volume","Double their volume","They are not recorded"],"w":"Melted ice occupies less space than the packed chips, so about half the volume is recorded."},"fr":{"q":"Les glacons se notent comme entree pour :","o":["Leur volume mesure entier","Environ la moitie de leur volume","Le double de leur volume","Ils ne se notent pas"],"w":"La glace fondue occupe moins de place que les glacons tasses : on note environ la moitie du volume."}},{"id":"i11","level":"intermediate","ref":"hygiene","area":"Activities of Daily Living","a":2,"en":{"q":"A resident can wash her face and arms but cannot reach her legs. The nurse aide should:","o":["Complete the entire bath to save time","Wash only what she asks for","Let her wash what she can and assist with the rest","Ask the nurse for a shower order"],"w":"Independence is part of the care; doing everything for a resident removes function and dignity."},"fr":{"q":"Une residente peut laver son visage et ses bras mais ne peut pas atteindre ses jambes. L'aide-soignant doit :","o":["Faire toute la toilette pour gagner du temps","Laver seulement ce qu'elle demande","La laisser laver ce qu'elle peut et l'aider pour le reste","Demander une prescription de douche"],"w":"L'autonomie fait partie du soin ; tout faire a la place du resident lui retire fonction et dignite."}},{"id":"i12","level":"intermediate","ref":"hygiene","area":"Activities of Daily Living","a":2,"en":{"q":"A resident with diabetes has thick, uneven toenails. The nurse aide should:","o":["Trim them straight across","File them smooth","Report them to the nurse and not cut them","Soak and trim after softening"],"w":"Nail care on a resident with diabetes risks injury and serious infection; it is not done by the aide."},"fr":{"q":"Un resident diabetique a des ongles de pieds epais et irreguliers. L'aide-soignant doit :","o":["Les couper droit","Les limer","Les signaler a l'infirmiere et ne pas les couper","Les ramollir puis les couper"],"w":"Couper les ongles d'un diabetique risque blessure et infection grave ; ce n'est pas le role de l'aide."}},{"id":"i13","level":"intermediate","ref":"hygiene","area":"Activities of Daily Living","a":1,"en":{"q":"Oral care for an unconscious resident should be given:","o":["Once a shift","Every two hours, with the head turned to the side","Only at bedtime","Only when the family asks"],"w":"Frequent care keeps the mouth moist, and side positioning prevents fluid entering the airway."},"fr":{"q":"Les soins de bouche d'un resident inconscient doivent etre faits :","o":["Une fois par service","Toutes les deux heures, tete tournee sur le cote","Seulement au coucher","Seulement si la famille le demande"],"w":"Des soins frequents gardent la bouche humide, et la tete sur le cote evite le passage de liquide dans les voies respiratoires."}},{"id":"i14","level":"intermediate","ref":"dressing","area":"Activities of Daily Living","a":3,"en":{"q":"On an uncircumcised male resident, after washing and drying the penis the nurse aide must:","o":["Leave the foreskin retracted","Apply powder","Cover it with a dressing","Return the foreskin to its normal position"],"w":"A foreskin left retracted causes swelling and can cut off circulation."},"fr":{"q":"Chez un resident non circoncis, apres avoir lave et seche le penis, l'aide-soignant doit :","o":["Laisser le prepuce retracte","Mettre du talc","Poser un pansement","Remettre le prepuce en place"],"w":"Un prepuce laisse retracte provoque un gonflement et peut couper la circulation."}},{"id":"i15","level":"intermediate","ref":"skin","area":"Basic Nursing Skills","a":1,"en":{"q":"Which action helps prevent shearing injury to the skin?","o":["Dragging the resident up in bed","Using a lift sheet with a second person","Raising the head of the bed to 90 degrees","Leaving the sheets loose"],"w":"Dragging tears skin layers; a lift sheet moves the resident without friction."},"fr":{"q":"Quelle action previent les lesions de cisaillement de la peau ?","o":["Trainer le resident vers le haut du lit","Utiliser un drap de glissement a deux soignants","Relever la tete du lit a 90 degres","Laisser les draps laches"],"w":"Trainer dechire les couches de la peau ; le drap de glissement deplace sans friction."}},{"id":"i16","level":"intermediate","ref":"skin","area":"Basic Nursing Skills","a":2,"en":{"q":"Which resident is at highest risk for a pressure injury?","o":["A resident who walks with a cane","A resident who feeds himself slowly","A resident who is incontinent and cannot reposition himself","A resident who refuses dessert"],"w":"Immobility plus moisture is the highest-risk combination for skin breakdown."},"fr":{"q":"Quel resident presente le risque d'escarre le plus eleve ?","o":["Un resident qui marche avec une canne","Un resident qui mange lentement seul","Un resident incontinent qui ne peut pas se repositionner","Un resident qui refuse le dessert"],"w":"L'immobilite associee a l'humidite est la combinaison la plus a risque pour la peau."}},{"id":"i17","level":"intermediate","ref":"transfers","area":"Basic Nursing Skills","a":2,"en":{"q":"When transferring a resident with left-sided weakness from bed to chair, the chair should be placed:","o":["On the left side","At the foot of the bed","On the right side","Directly in front of the bed"],"w":"Transfer toward the stronger side so the resident can bear weight and pivot safely."},"fr":{"q":"Pour transferer du lit au fauteuil un resident faible du cote gauche, le fauteuil se place :","o":["Du cote gauche","Au pied du lit","Du cote droit","Juste devant le lit"],"w":"On transfere vers le cote fort pour que le resident puisse prendre appui et pivoter en securite."}},{"id":"i18","level":"intermediate","ref":"transfers","area":"Basic Nursing Skills","a":3,"en":{"q":"While being transferred, the resident should hold onto:","o":["The aide's neck","The IV pole","The bed rail only","The aide's waist or shoulders"],"w":"Holding the neck can injure the aide's spine; the waist or shoulders are safe."},"fr":{"q":"Pendant un transfert, le resident doit se tenir :","o":["Au cou de l'aide-soignant","Au pied a perfusion","A la barriere du lit seulement","A la taille ou aux epaules de l'aide-soignant"],"w":"S'accrocher au cou peut blesser la colonne de l'aide ; la taille ou les epaules sont sures."}},{"id":"i19","level":"intermediate","ref":"ambulation","area":"Restorative Skills","a":1,"en":{"q":"A resident using a walker should:","o":["Walk ahead of the walker","Move the walker forward, then step into it","Lift the walker with one hand","Push the walker while leaning on it"],"w":"All four points must be steady on the ground before the resident steps forward."},"fr":{"q":"Un resident qui utilise un deambulateur doit :","o":["Marcher devant le deambulateur","Avancer le deambulateur puis avancer dedans","Soulever le deambulateur d'une main","Pousser le deambulateur en s'appuyant dessus"],"w":"Les quatre points doivent etre stables au sol avant que le resident n'avance."}},{"id":"i20","level":"intermediate","ref":"ambulation","area":"Restorative Skills","a":2,"en":{"q":"When a resident climbs stairs, which leg goes first?","o":["The weaker leg","Either leg","The stronger leg","Both together"],"w":"Up with the good, down with the bad: the strong leg leads going up."},"fr":{"q":"Quand un resident monte un escalier, quelle jambe passe en premier ?","o":["La jambe faible","N'importe laquelle","La jambe forte","Les deux ensemble"],"w":"Monter avec la bonne, descendre avec la mauvaise : la jambe forte passe en premier a la montee."}},{"id":"i21","level":"intermediate","ref":"ambulation","area":"Restorative Skills","a":2,"en":{"q":"After a resident falls, the nurse aide should FIRST:","o":["Help the resident back to bed","Check for injuries by moving the limbs","Stay with the resident and call the nurse","Complete an incident report"],"w":"Moving a resident after a fall can worsen a fracture or head injury; the nurse assesses first."},"fr":{"q":"Apres la chute d'un resident, l'aide-soignant doit D'ABORD :","o":["Le remettre au lit","Verifier les blessures en bougeant ses membres","Rester aupres de lui et appeler l'infirmiere","Remplir la declaration d'incident"],"w":"Deplacer un resident apres une chute peut aggraver une fracture ou un traumatisme cranien ; l'infirmiere evalue d'abord."}},{"id":"i22","level":"intermediate","ref":"nutrition","area":"Basic Nursing Skills","a":2,"en":{"q":"Which observation suggests a swallowing problem and must be reported?","o":["Eating slowly","Asking for salt","Coughing during meals and a wet, gurgly voice","Finishing only the dessert"],"w":"Coughing, a wet voice, pocketing food and drooling are warning signs of dysphagia."},"fr":{"q":"Quelle observation evoque un trouble de la deglutition et doit etre signalee ?","o":["Manger lentement","Demander du sel","Tousser pendant le repas avec une voix mouillee","Ne finir que le dessert"],"w":"Toux, voix mouillee, aliments gardes dans la joue et bave sont des signes de dysphagie."}},{"id":"i23","level":"intermediate","ref":"nutrition","area":"Basic Nursing Skills","a":2,"en":{"q":"For a resident with right-sided weakness, food should be placed:","o":["On the right side of the mouth","In the center of the tongue","On the left side of the mouth","It does not matter"],"w":"Place food on the stronger side, then check the weak side for pocketed food afterward."},"fr":{"q":"Chez un resident faible du cote droit, les aliments doivent etre deposes :","o":["Du cote droit de la bouche","Au centre de la langue","Du cote gauche de la bouche","Peu importe"],"w":"Deposer du cote fort, puis verifier ensuite le cote faible pour des aliments stockes."}},{"id":"i24","level":"intermediate","ref":"nutrition","area":"Basic Nursing Skills","a":2,"en":{"q":"The nurse aide should record a resident's meal intake as:","o":["Ate well","Ate poorly","The percentage of the meal eaten","Had an appetite"],"w":"A percentage is measurable; the other entries are the aide's impression."},"fr":{"q":"L'aide-soignant doit noter la prise alimentaire comme :","o":["A bien mange","A peu mange","Le pourcentage du repas consomme","Avait de l'appetit"],"w":"Un pourcentage est mesurable ; les autres formulations sont des impressions."}},{"id":"i25","level":"intermediate","ref":"elimination","area":"Basic Nursing Skills","a":1,"en":{"q":"When emptying a urinary drainage bag, the nurse aide should:","o":["Let the spout rest in the graduate","Avoid letting the drain spout touch anything","Rinse the spout with tap water","Empty it onto a paper towel"],"w":"Touching the spout contaminates the closed system and invites infection."},"fr":{"q":"En vidant un sac collecteur d'urine, l'aide-soignant doit :","o":["Poser l'embout dans le pot gradue","Eviter que l'embout ne touche quoi que ce soit","Rincer l'embout a l'eau du robinet","Le vider sur un essuie-tout"],"w":"Toucher l'embout contamine le systeme clos et favorise l'infection."}},{"id":"i26","level":"intermediate","ref":"elimination","area":"Basic Nursing Skills","a":2,"en":{"q":"Which observation about urine should be reported to the nurse?","o":["Pale yellow color","A volume of 300 mL","Cloudy urine with a strong odor","Urination four times in a shift"],"w":"Cloudy, bloody or foul-smelling urine can signal infection."},"fr":{"q":"Quelle observation sur les urines doit etre signalee a l'infirmiere ?","o":["Une couleur jaune pale","Un volume de 300 mL","Des urines troubles a odeur forte","Quatre mictions dans le service"],"w":"Des urines troubles, sanglantes ou malodorantes peuvent signaler une infection."}},{"id":"i27","level":"intermediate","ref":"elimination","area":"Basic Nursing Skills","a":2,"en":{"q":"A resident has had no bowel movement for three days. The nurse aide should:","o":["Give a laxative","Increase the resident's exercise","Report it to the nurse","Wait two more days"],"w":"Three days without a bowel movement is reported; the aide never gives a laxative."},"fr":{"q":"Un resident n'a pas eu de selles depuis trois jours. L'aide-soignant doit :","o":["Donner un laxatif","Augmenter son activite physique","Le signaler a l'infirmiere","Attendre deux jours de plus"],"w":"Trois jours sans selles se signalent ; l'aide ne donne jamais de laxatif."}},{"id":"i28","level":"intermediate","ref":"emergency","area":"Basic Nursing Skills","a":1,"en":{"q":"A resident suddenly has facial drooping, one-sided weakness and slurred speech. The nurse aide should:","o":["Help the resident to bed and recheck later","Get the nurse immediately and note the time","Offer fluids","Document at the end of the shift"],"w":"These are stroke signs; treatment is time-critical and the onset time matters."},"fr":{"q":"Un resident presente brutalement un visage qui tombe, une faiblesse d'un cote et une parole pateuse. L'aide-soignant doit :","o":["Le coucher et revoir plus tard","Prevenir l'infirmiere immediatement et noter l'heure","Lui donner a boire","Documenter en fin de service"],"w":"Ce sont des signes d'AVC ; le traitement depend du temps et l'heure de debut compte."}},{"id":"i29","level":"intermediate","ref":"emergency","area":"Basic Nursing Skills","a":2,"en":{"q":"During a seizure, the nurse aide should:","o":["Hold the resident still","Place a spoon in the mouth","Protect the head and move furniture away","Sit the resident upright"],"w":"Never restrain and never put anything in the mouth; protect from injury and time the episode."},"fr":{"q":"Pendant une crise convulsive, l'aide-soignant doit :","o":["Maintenir le resident immobile","Mettre une cuillere dans sa bouche","Proteger sa tete et ecarter les meubles","L'asseoir bien droit"],"w":"Ne jamais maintenir ni rien mettre dans la bouche ; proteger des blessures et chronometrer la crise."}},{"id":"i30","level":"intermediate","ref":"emergency","area":"Basic Nursing Skills","a":1,"en":{"q":"In the extinguisher word PASS, the first S stands for:","o":["Spray","Squeeze","Stop","Shout"],"w":"Pull, Aim at the base, Squeeze the handle, Sweep side to side."},"fr":{"q":"Dans le mot PASS pour l'extincteur, le premier S signifie :","o":["Vaporiser","Presser la poignee","Stopper","Crier"],"w":"Tirer la goupille, viser la base, presser la poignee, balayer."}},{"id":"i31","level":"intermediate","ref":"restorative","area":"Restorative Skills","a":1,"en":{"q":"During passive range of motion the resident says the movement hurts. The nurse aide should:","o":["Push a little further","Stop the movement and report it","Move faster to finish","Move the joint the other way"],"w":"Joints are moved to the point of resistance, never through pain."},"fr":{"q":"Pendant une mobilisation passive, le resident dit que le mouvement fait mal. L'aide-soignant doit :","o":["Forcer un peu plus","Arreter le mouvement et le signaler","Aller plus vite pour finir","Mobiliser dans l'autre sens"],"w":"On mobilise jusqu'au point de resistance, jamais au-dela de la douleur."}},{"id":"i32","level":"intermediate","ref":"restorative","area":"Restorative Skills","a":2,"en":{"q":"Active range of motion means the exercises are performed:","o":["By the nurse aide alone","By the physical therapist only","By the resident","By a machine"],"w":"Active means the resident does it; passive means the aide moves the joint for them."},"fr":{"q":"L'amplitude active signifie que les exercices sont realises :","o":["Par l'aide-soignant seul","Par le kinesitherapeute seulement","Par le resident","Par une machine"],"w":"Active veut dire que le resident le fait ; passive veut dire que l'aide mobilise pour lui."}},{"id":"i33","level":"intermediate","ref":"mental","area":"Emotional and Mental Health Needs","a":1,"en":{"q":"A resident with dementia repeatedly asks for her husband, who died years ago. The best response is to:","o":["Remind her each time that he died","Acknowledge her feelings and gently redirect","Promise he will visit today","Ignore the question"],"w":"Repeated bad news causes fresh grief; a false promise breaks trust when it is not kept."},"fr":{"q":"Une residente atteinte de demence demande sans cesse son mari, decede il y a des annees. La meilleure reponse est de :","o":["Lui rappeler chaque fois qu'il est mort","Reconnaitre son sentiment et rediriger en douceur","Promettre qu'il viendra aujourd'hui","Ignorer la question"],"w":"Repeter la mauvaise nouvelle ravive le deuil ; une fausse promesse brise la confiance."}},{"id":"i34","level":"intermediate","ref":"mental","area":"Emotional and Mental Health Needs","a":1,"en":{"q":"Increased confusion and agitation in the late afternoon is called:","o":["Delirium","Sundowning","Aphasia","Dysphagia"],"w":"Sundowning responds to more light, less noise and a predictable routine."},"fr":{"q":"Une confusion et une agitation accrues en fin d'apres-midi s'appellent :","o":["Delire aigu","Syndrome crepusculaire","Aphasie","Dysphagie"],"w":"Le syndrome crepusculaire s'ameliore avec plus de lumiere, moins de bruit et une routine stable."}},{"id":"i35","level":"intermediate","ref":"mental","area":"Emotional and Mental Health Needs","a":1,"en":{"q":"A resident with dementia suddenly shouts and strikes out during care. The nurse aide should FIRST:","o":["Hold the resident's hands","Stop the care, step back and speak calmly","Finish the care quickly","Tell the resident this is not allowed"],"w":"Stopping and lowering stimulation defuses a catastrophic reaction; restraining escalates it."},"fr":{"q":"Un resident atteint de demence se met soudain a crier et a frapper pendant le soin. L'aide-soignant doit D'ABORD :","o":["Lui tenir les mains","Arreter le soin, reculer et parler calmement","Finir le soin rapidement","Lui dire que c'est interdit"],"w":"Arreter et baisser la stimulation desamorce la reaction catastrophique ; maintenir l'aggrave."}},{"id":"i36","level":"intermediate","ref":"mental","area":"Emotional and Mental Health Needs","a":2,"en":{"q":"A resident who enjoyed activities now stays in bed, eats little and says nothing matters. The nurse aide should:","o":["Accept that he needs rest","Insist he attend activities","Report the change to the nurse","Ask the family to cheer him up"],"w":"Withdrawal, appetite loss and hopelessness may be depression, which is treatable."},"fr":{"q":"Un resident qui aimait les activites reste au lit, mange peu et dit que rien n'a d'importance. L'aide-soignant doit :","o":["Accepter qu'il a besoin de repos","Insister pour qu'il participe","Signaler le changement a l'infirmiere","Demander a la famille de le remonter"],"w":"Repli, perte d'appetit et desespoir peuvent signaler une depression, qui se soigne."}},{"id":"i37","level":"intermediate","ref":"mental","area":"Emotional and Mental Health Needs","a":2,"en":{"q":"A resident with dementia is agitated. The nurse aide should first consider that the behavior may be caused by:","o":["A wish to annoy staff","A personality problem","An unmet need such as pain, hunger or a full bladder","The weather"],"w":"Behavior is communication; look for the unmet need before anything else."},"fr":{"q":"Un resident atteint de demence est agite. L'aide-soignant doit d'abord envisager que ce comportement vienne :","o":["D'une envie d'embeter le personnel","D'un probleme de caractere","D'un besoin non satisfait : douleur, faim, vessie pleine","De la meteo"],"w":"Le comportement est un langage ; chercher d'abord le besoin non satisfait."}},{"id":"i38","level":"intermediate","ref":"mental","area":"Emotional and Mental Health Needs","a":1,"en":{"q":"Managing a resident who wanders is best done by:","o":["Applying a lap restraint","Supervision and a safe environment","Locking the resident's door","Sedating the resident"],"w":"Restraints increase injury, confusion and death; safety and supervision are the standard."},"fr":{"q":"La prise en charge d'un resident qui deambule repose surtout sur :","o":["Une contention au fauteuil","La surveillance et un environnement securise","Fermer sa chambre a cle","Le sedater"],"w":"Les contentions augmentent blessures, confusion et mortalite ; securite et surveillance sont la regle."}},{"id":"i39","level":"intermediate","ref":"communication","area":"Communication","a":1,"en":{"q":"A resident with aphasia after a stroke struggles to find words. The nurse aide should:","o":["Finish his sentences","Allow extra time and use yes-or-no questions","Speak to the family instead","Speak louder and faster"],"w":"Time and simple questions let the resident communicate; finishing sentences takes away his voice."},"fr":{"q":"Un resident aphasique apres un AVC cherche ses mots. L'aide-soignant doit :","o":["Finir ses phrases","Laisser plus de temps et poser des questions par oui ou non","Parler a la famille a la place","Parler plus fort et plus vite"],"w":"Le temps et des questions simples lui permettent de communiquer ; finir ses phrases lui retire la parole."}},{"id":"i40","level":"intermediate","ref":"communication","area":"Communication","a":2,"en":{"q":"Which is an open-ended question?","o":["Are you comfortable?","Would you like juice?","How are you feeling this morning?","Did you sleep well?"],"w":"An open-ended question cannot be answered yes or no and invites the resident to say more."},"fr":{"q":"Laquelle est une question ouverte ?","o":["Etes-vous confortable ?","Voulez-vous du jus ?","Comment vous sentez-vous ce matin ?","Avez-vous bien dormi ?"],"w":"Une question ouverte ne se repond pas par oui ou non et invite le resident a en dire plus."}},{"id":"i41","level":"intermediate","ref":"communication","area":"Communication","a":3,"en":{"q":"Which entry is the best example of objective reporting?","o":["The resident seemed sad","The resident was uncooperative","The resident had a bad night","The resident ate 25 percent of lunch"],"w":"Objective information is observed and measurable; the others are interpretation."},"fr":{"q":"Quelle note est le meilleur exemple de transmission objective ?","o":["Le resident semblait triste","Le resident n'etait pas cooperant","Le resident a passe une mauvaise nuit","Le resident a mange 25 pour cent du dejeuner"],"w":"Une information objective est observee et mesurable ; les autres sont des interpretations."}},{"id":"i42","level":"intermediate","ref":"communication","area":"Communication","a":1,"en":{"q":"When entering the room of a resident who is blind, the nurse aide should:","o":["Touch the resident first","Announce herself and explain what she is going to do","Turn on the television","Rearrange the furniture for safety"],"w":"Announcing prevents startling, and belongings are never moved without telling the resident."},"fr":{"q":"En entrant dans la chambre d'un resident aveugle, l'aide-soignant doit :","o":["Le toucher d'abord","S'annoncer et expliquer ce qu'il va faire","Allumer la television","Deplacer les meubles par securite"],"w":"S'annoncer evite de surprendre, et on ne deplace jamais ses affaires sans le lui dire."}},{"id":"i43","level":"intermediate","ref":"rights","area":"Client Rights","a":1,"en":{"q":"Two nurse aides discuss a resident's diagnosis in the elevator. This is:","o":["Acceptable if no visitors are present","A violation of confidentiality","Acceptable if only first names are used","Required for continuity of care"],"w":"Resident information is shared only with those involved in care, and only in private."},"fr":{"q":"Deux aides-soignants parlent du diagnostic d'un resident dans l'ascenseur. C'est :","o":["Acceptable s'il n'y a pas de visiteurs","Une violation de la confidentialite","Acceptable si on n'utilise que les prenoms","Necessaire a la continuite des soins"],"w":"Les informations se partagent uniquement entre soignants concernes, et en prive."}},{"id":"i44","level":"intermediate","ref":"rights","area":"Client Rights","a":1,"en":{"q":"A resident wants to keep a quilt and photographs from home. The nurse aide should:","o":["Explain personal items are not allowed","Help arrange them safely in the room","Store them for visits","Send them home with the family"],"w":"Residents have the right to keep and use personal possessions as space and safety allow."},"fr":{"q":"Un resident souhaite garder une couverture et des photos de chez lui. L'aide-soignant doit :","o":["Expliquer que les objets personnels sont interdits","L'aider a les installer en securite dans la chambre","Les ranger pour les visites","Les rendre a la famille"],"w":"Le resident a le droit de garder et d'utiliser ses effets personnels, dans les limites de place et de securite."}},{"id":"i45","level":"intermediate","ref":"rights","area":"Client Rights","a":1,"en":{"q":"Which is the best restraint alternative?","o":["Raising all four side rails","Frequent checks and meeting needs before the resident tries to get up","A lap belt in the wheelchair","Tucking the sheets tightly"],"w":"Four raised rails, a lap belt and tight sheets can all be restraints."},"fr":{"q":"Quelle est la meilleure alternative a la contention ?","o":["Relever les quatre barrieres","Des passages frequents et repondre aux besoins avant que le resident ne se leve","Une ceinture au fauteuil","Border les draps tres serres"],"w":"Quatre barrieres relevees, une ceinture et des draps trop serres peuvent tous constituer une contention."}},{"id":"i46","level":"intermediate","ref":"rights","area":"Client Rights","a":1,"en":{"q":"A resident complains her breakfast is always cold. The nurse aide should:","o":["Explain the kitchen is short staffed","Report the complaint to the nurse","Suggest she complain less","Bring food from outside"],"w":"Residents have the right to voice grievances without fear of retaliation."},"fr":{"q":"Une residente se plaint que son petit-dejeuner est toujours froid. L'aide-soignant doit :","o":["Expliquer que la cuisine manque de personnel","Signaler la plainte a l'infirmiere","Lui suggerer de moins se plaindre","Apporter de la nourriture de l'exterieur"],"w":"Le resident a le droit d'exprimer une plainte sans crainte de represailles."}},{"id":"i47","level":"intermediate","ref":"rights","area":"Client Rights","a":1,"en":{"q":"A nurse aide sees a coworker slap a resident. The aide should:","o":["Speak privately with the coworker","Report it to the nurse or supervisor immediately","Chart it at the end of the shift","Wait to see if it happens again"],"w":"Suspected abuse is reported immediately; handling it privately leaves the resident in danger."},"fr":{"q":"Un aide-soignant voit un collegue gifler un resident. Il doit :","o":["En parler en prive au collegue","Le signaler immediatement a l'infirmiere ou au superieur","Le noter en fin de service","Attendre de voir si cela se reproduit"],"w":"Un abus suspecte se signale immediatement ; le gerer en prive laisse le resident en danger."}},{"id":"i48","level":"intermediate","ref":"rights","area":"Client Rights","a":2,"en":{"q":"A resident asks to attend a religious service instead of his scheduled exercise group. The nurse aide should:","o":["Explain the schedule cannot change","Ask the family to decide","Support the choice and report it so the schedule can be adjusted","Tell him to do both"],"w":"Residents have the right to make choices and to participate in planning their care."},"fr":{"q":"Un resident demande a assister a un office religieux plutot qu'a son groupe d'exercice. L'aide-soignant doit :","o":["Expliquer que le planning ne peut pas changer","Demander a la famille de trancher","Soutenir son choix et le signaler pour adapter le planning","Lui dire de faire les deux"],"w":"Le resident a le droit de choisir et de participer a l'elaboration de son plan de soins."}},{"id":"i49","level":"intermediate","ref":"rights","area":"Client Rights","a":1,"en":{"q":"A resident refuses her pork at lunch, saying her religion forbids it. The nurse aide should:","o":["Encourage her to eat it for the protein","Remove it and report the dietary preference","Chart a meal refusal","Offer a different pork dish"],"w":"Religious dietary practice is respected and reported so nutrition is still adequate."},"fr":{"q":"Une residente refuse le porc au dejeuner en disant que sa religion l'interdit. L'aide-soignant doit :","o":["L'encourager a en manger pour les proteines","Le retirer et signaler la preference alimentaire","Noter un refus de repas","Proposer un autre plat au porc"],"w":"La pratique religieuse alimentaire se respecte et se signale pour garantir une nutrition suffisante."}},{"id":"i50","level":"intermediate","ref":"team","area":"Member of the Health Care Team","a":1,"en":{"q":"A resident asks the nurse aide to hand him the pain pill left on his bedside table. The aide should:","o":["Hand him the pill","Tell the nurse the resident is asking for his medication","Crush it in applesauce","Leave it and document"],"w":"Administering medication is outside the nurse aide's scope of practice."},"fr":{"q":"Un resident demande a l'aide-soignant de lui donner le comprime contre la douleur pose sur sa table. L'aide doit :","o":["Lui donner le comprime","Prevenir l'infirmiere que le resident demande son medicament","L'ecraser dans de la compote","Le laisser et le documenter"],"w":"L'administration de medicaments sort du champ d'exercice de l'aide-soignant."}},{"id":"i51","level":"intermediate","ref":"team","area":"Member of the Health Care Team","a":1,"en":{"q":"When should the nurse aide report a change in a resident's condition?","o":["At the end of the shift","As soon as it is noticed","At the next scheduled rounds","Only if the resident asks"],"w":"Delay is what turns a change into an emergency."},"fr":{"q":"Quand l'aide-soignant doit-il signaler un changement d'etat d'un resident ?","o":["En fin de service","Des qu'il le constate","Au prochain tour prevu","Seulement si le resident le demande"],"w":"Le retard est ce qui transforme un changement en urgence."}},{"id":"i52","level":"intermediate","ref":"team","area":"Member of the Health Care Team","a":1,"en":{"q":"A nurse aide makes an error in the chart. She should:","o":["Erase it completely","Draw one line through it, initial it and write the correction","Use correction fluid","Tear out the page"],"w":"The original entry must remain readable; erasing or whiting out looks like falsification."},"fr":{"q":"Une aide-soignante fait une erreur dans le dossier. Elle doit :","o":["L'effacer completement","Barrer d'un trait, parapher et ecrire la correction","Utiliser du correcteur blanc","Arracher la page"],"w":"L'ecriture initiale doit rester lisible ; effacer ou blanchir ressemble a une falsification."}},{"id":"a1","level":"advanced","ref":"emergency","area":"Basic Nursing Skills","a":2,"en":{"q":"The nurse aide enters a room and finds a resident on the floor, awake and complaining of hip pain. The FIRST action is to:","o":["Help the resident into bed","Check the resident's vital signs","Stay with the resident and call for the nurse","Complete the incident report"],"w":"Moving a resident with possible hip fracture can displace the bone; never move, never leave, call for help."},"fr":{"q":"L'aide-soignant trouve un resident au sol, conscient, qui se plaint de la hanche. La PREMIERE action est de :","o":["L'aider a se recoucher","Prendre ses signes vitaux","Rester pres de lui et appeler l'infirmiere","Remplir la declaration d'incident"],"w":"Deplacer un resident avec une fracture de hanche possible peut deplacer l'os ; ne pas bouger, ne pas laisser seul, appeler."}},{"id":"a2","level":"advanced","ref":"emergency","area":"Basic Nursing Skills","a":1,"en":{"q":"Four residents call at once. Which does the nurse aide attend to FIRST?","o":["A resident who wants the television changed","A resident whose lips are turning blue","A resident asking for a second dessert","A resident who dropped a magazine"],"w":"Airway and breathing always come before comfort or convenience requests."},"fr":{"q":"Quatre residents appellent en meme temps. Lequel l'aide-soignant voit-il EN PREMIER ?","o":["Celui qui veut changer de chaine","Celui dont les levres deviennent bleues","Celui qui demande un second dessert","Celui qui a fait tomber un magazine"],"w":"Les voies respiratoires et la respiration passent toujours avant le confort ou la commodite."}},{"id":"a3","level":"advanced","ref":"emergency","area":"Basic Nursing Skills","a":2,"en":{"q":"A resident who was choking and coughing forcefully now makes no sound and cannot speak. The nurse aide should:","o":["Continue to encourage coughing","Offer sips of water","Call for help and begin abdominal thrusts if trained and permitted","Lay the resident flat and wait"],"w":"A silent choking resident is not moving air; the obstruction is now complete and needs intervention."},"fr":{"q":"Un resident qui s'etouffait et toussait fortement ne fait plus aucun bruit et ne peut plus parler. L'aide-soignant doit :","o":["Continuer a encourager la toux","Proposer de petites gorgees d'eau","Appeler a l'aide et commencer les compressions abdominales s'il est forme et autorise","L'allonger a plat et attendre"],"w":"Un etouffement silencieux signifie qu'aucun air ne passe : l'obstruction est complete et exige une intervention."}},{"id":"a4","level":"advanced","ref":"emergency","area":"Basic Nursing Skills","a":2,"en":{"q":"A resident with a history of heart disease reports chest pressure and is sweating and grey. The nurse aide should:","o":["Give the resident an aspirin","Walk the resident to the nurses' station","Stay with the resident and get the nurse immediately","Take a full set of vital signs first"],"w":"Do not move or medicate; get the nurse at once and stay with the resident."},"fr":{"q":"Un resident cardiaque signale une oppression thoracique, transpire et a le teint gris. L'aide-soignant doit :","o":["Lui donner une aspirine","L'accompagner a pied jusqu'au poste de soins","Rester pres de lui et prevenir l'infirmiere immediatement","Prendre d'abord tous ses signes vitaux"],"w":"Ne pas deplacer ni donner de medicament ; prevenir l'infirmiere sur-le-champ et rester pres de lui."}},{"id":"a5","level":"advanced","ref":"skin","area":"Basic Nursing Skills","a":2,"en":{"q":"A resident is incontinent of urine three times during the shift. The most important preventive action is to:","o":["Restrict fluids","Apply powder to the skin","Clean and dry the skin and change linen each time","Put the resident on a bedpan schedule only"],"w":"Moisture plus pressure is what breaks skin down; restricting fluids causes dehydration and infection."},"fr":{"q":"Un resident est incontinent urinaire trois fois pendant le service. L'action preventive la plus importante est de :","o":["Restreindre les boissons","Mettre du talc sur la peau","Nettoyer et secher la peau et changer le linge a chaque fois","Le mettre seulement sur un horaire de bassin"],"w":"L'humidite associee a la pression detruit la peau ; restreindre les boissons provoque deshydratation et infection."}},{"id":"a6","level":"advanced","ref":"skin","area":"Basic Nursing Skills","a":3,"en":{"q":"A resident sits in a wheelchair most of the day. To protect the skin, the nurse aide should:","o":["Use a donut-shaped cushion","Leave the resident up as long as tolerated","Place a plastic sheet on the chair","Reposition or shift the resident's weight at least every hour"],"w":"Sitting concentrates pressure on the tailbone; a chair needs repositioning more often than a bed. Donut cushions cut circulation."},"fr":{"q":"Un resident reste au fauteuil roulant une grande partie de la journee. Pour proteger sa peau, l'aide-soignant doit :","o":["Utiliser un coussin en forme de bouee","Le laisser leve aussi longtemps qu'il le supporte","Poser une alese plastique sur le fauteuil","Le repositionner ou soulager son poids au moins toutes les heures"],"w":"La position assise concentre la pression sur le sacrum ; le fauteuil demande plus de changements que le lit. Les coussins bouee coupent la circulation."}},{"id":"a7","level":"advanced","ref":"nutrition","area":"Basic Nursing Skills","a":1,"en":{"q":"A resident on a thickened-liquid diet asks for a glass of plain water. The nurse aide should:","o":["Give the water since the resident asked","Explain kindly and check with the nurse","Give ice chips instead","Give half a glass"],"w":"Thin liquids can be aspirated by a resident with dysphagia; the diet order exists for safety."},"fr":{"q":"Un resident sous regime a liquides epaissis demande un verre d'eau plate. L'aide-soignant doit :","o":["Donner l'eau puisqu'il la demande","Expliquer gentiment et verifier aupres de l'infirmiere","Donner des glacons a la place","Donner un demi-verre"],"w":"Les liquides fluides peuvent passer dans les voies respiratoires en cas de dysphagie ; le regime existe pour la securite."}},{"id":"a8","level":"advanced","ref":"nutrition","area":"Basic Nursing Skills","a":3,"en":{"q":"A resident with dementia repeatedly pushes the food tray away. The nurse aide should FIRST:","o":["Document a refusal and remove the tray","Feed the resident anyway","Report the resident as non-compliant","Check for pain, poorly fitting dentures or a dislike of the food"],"w":"Refusing food is communication; look for a cause such as mouth pain, ill-fitting dentures or the wrong food."},"fr":{"q":"Un resident atteint de demence repousse sans cesse son plateau. L'aide-soignant doit D'ABORD :","o":["Noter un refus et retirer le plateau","Le faire manger quand meme","Le signaler comme non cooperant","Chercher une douleur, une prothese mal adaptee ou un plat qu'il n'aime pas"],"w":"Refuser de manger est un message ; chercher une cause : douleur buccale, prothese mal adaptee, aliment non apprecie."}},{"id":"a9","level":"advanced","ref":"nutrition","area":"Basic Nursing Skills","a":2,"en":{"q":"A resident on fluid restriction asks repeatedly for water. The nurse aide should:","o":["Give water whenever asked","Ignore the requests","Offer frequent mouth care and ice chips within the allowed amount, and tell the nurse","Tell the resident to stop asking"],"w":"Thirst is real and distressing; mouth care relieves it without exceeding the restriction."},"fr":{"q":"Un resident sous restriction hydrique demande sans cesse de l'eau. L'aide-soignant doit :","o":["Donner de l'eau a chaque demande","Ignorer les demandes","Proposer des soins de bouche frequents et des glacons dans la quantite autorisee, et prevenir l'infirmiere","Lui dire d'arreter de demander"],"w":"La soif est reelle et penible ; les soins de bouche la soulagent sans depasser la restriction."}},{"id":"a10","level":"advanced","ref":"transfers","area":"Basic Nursing Skills","a":2,"en":{"q":"A resident is halfway through a stand-pivot transfer when her knees buckle. The nurse aide should:","o":["Pull her up by the arms","Let go and call for help","Lower her to the chair or floor in a controlled way","Hold her under the armpits"],"w":"Pulling on arms and lifting under the armpits cause dislocation and nerve injury."},"fr":{"q":"Une residente est a mi-chemin d'un transfert debout-pivot quand ses genoux flechissent. L'aide-soignant doit :","o":["La tirer par les bras","La lacher et appeler a l'aide","La descendre au fauteuil ou au sol de facon controlee","La tenir sous les aisselles"],"w":"Tirer sur les bras et soulever sous les aisselles provoquent luxations et lesions nerveuses."}},{"id":"a11","level":"advanced","ref":"transfers","area":"Basic Nursing Skills","a":1,"en":{"q":"Two aides are moving a heavy resident up in bed. The safest method is to:","o":["Each pull on one arm","Use a lift sheet and move on a count together","One lifts the shoulders while the other pulls the legs","Raise the head of the bed and slide the resident"],"w":"A lift sheet distributes the load and prevents shearing; pulling on limbs injures the resident."},"fr":{"q":"Deux aides doivent remonter un resident lourd dans son lit. La methode la plus sure est de :","o":["Tirer chacun sur un bras","Utiliser un drap de glissement et bouger ensemble au compte","L'un souleve les epaules pendant que l'autre tire les jambes","Relever la tete du lit et faire glisser le resident"],"w":"Le drap de glissement repartit la charge et evite le cisaillement ; tirer sur les membres blesse le resident."}},{"id":"a12","level":"advanced","ref":"ambulation","area":"Restorative Skills","a":2,"en":{"q":"A resident on a walker says she feels dizzy after standing. The nurse aide should:","o":["Continue walking slowly","Encourage her to push through it","Have her sit down and report the dizziness","Give her a glass of juice"],"w":"Dizziness on standing suggests a drop in blood pressure; sitting prevents a fall and the nurse must know."},"fr":{"q":"Une residente avec deambulateur dit avoir un vertige apres s'etre levee. L'aide-soignant doit :","o":["Continuer a marcher lentement","L'encourager a passer outre","La faire asseoir et signaler le vertige","Lui donner un verre de jus"],"w":"Un vertige au lever evoque une chute de tension ; s'asseoir evite la chute et l'infirmiere doit etre prevenue."}},{"id":"a13","level":"advanced","ref":"mental","area":"Emotional and Mental Health Needs","a":3,"en":{"q":"A resident with dementia insists she must go home to cook dinner for her children. The most helpful response is:","o":["Your children are grown up now","You live here, this is your home","There is no kitchen here","Tell me about your children. What did you like to cook?"],"w":"Joining the feeling and inviting a memory calms; correcting the reality provokes distress and argument."},"fr":{"q":"Une residente atteinte de demence insiste pour rentrer preparer le diner de ses enfants. La reponse la plus utile est :","o":["Vos enfants sont adultes maintenant","Vous vivez ici, c'est chez vous","Il n'y a pas de cuisine ici","Parlez-moi de vos enfants. Qu'aimiez-vous cuisiner ?"],"w":"Rejoindre le sentiment et inviter le souvenir apaise ; corriger la realite provoque detresse et conflit."}},{"id":"a14","level":"advanced","ref":"mental","area":"Emotional and Mental Health Needs","a":1,"en":{"q":"A resident says quietly that he would be better off dead. The nurse aide should:","o":["Change the subject to something cheerful","Stay with him and report the statement to the nurse right away","Tell him not to talk like that","Wait to see if he says it again"],"w":"Any mention of wanting to die is taken seriously and reported immediately."},"fr":{"q":"Un resident dit calmement qu'il vaudrait mieux qu'il soit mort. L'aide-soignant doit :","o":["Changer de sujet pour quelque chose de gai","Rester avec lui et signaler ses propos a l'infirmiere immediatement","Lui dire de ne pas parler ainsi","Attendre de voir s'il le repete"],"w":"Toute evocation d'un desir de mourir se prend au serieux et se signale immediatement."}},{"id":"a15","level":"advanced","ref":"mental","area":"Emotional and Mental Health Needs","a":2,"en":{"q":"A resident with dementia becomes agitated every evening at shower time. The best first step is to:","o":["Have two aides complete the shower quickly","Tell her she must bathe","Try the shower at a different time of day and note what works","Skip bathing entirely"],"w":"Changing the approach and the timing is the intervention; force and skipping care are both wrong."},"fr":{"q":"Une residente atteinte de demence s'agite chaque soir a l'heure de la douche. La meilleure premiere demarche est de :","o":["Faire la douche vite a deux soignants","Lui dire qu'elle doit se laver","Essayer la douche a un autre moment et noter ce qui fonctionne","Supprimer completement la toilette"],"w":"Changer l'approche et l'horaire est l'intervention ; forcer ou supprimer le soin sont tous deux fautifs."}},{"id":"a16","level":"advanced","ref":"rights","area":"Client Rights","a":2,"en":{"q":"A family member asks the nurse aide how their mother's cancer treatment is going. The aide should:","o":["Share what she knows","Say she cannot discuss it and refer them to the nurse","Say the resident is doing fine","Give a general summary only"],"w":"Discussing diagnosis and prognosis is outside the aide's role, even with family."},"fr":{"q":"Un proche demande a l'aide-soignant comment se passe le traitement du cancer de sa mere. L'aide doit :","o":["Partager ce qu'il sait","Dire qu'il ne peut pas en discuter et le renvoyer vers l'infirmiere","Dire que la residente va bien","Donner seulement un resume general"],"w":"Parler du diagnostic et du pronostic sort du role de l'aide-soignant, meme avec la famille."}},{"id":"a17","level":"advanced","ref":"rights","area":"Client Rights","a":1,"en":{"q":"A resident with capacity refuses to take a shower for the third day. The nurse aide should:","o":["Shower her while she is drowsy","Continue offering, respect the refusal and report the pattern","Tell her she will get an infection","Ask two aides to assist"],"w":"The right to refuse stands; a repeated refusal is reported so the team can find the reason."},"fr":{"q":"Une residente lucide refuse la douche pour le troisieme jour. L'aide-soignant doit :","o":["La doucher pendant qu'elle est somnolente","Continuer a proposer, respecter le refus et signaler la repetition","Lui dire qu'elle va attraper une infection","Demander a deux aides d'intervenir"],"w":"Le droit de refuser s'applique ; un refus repete se signale pour que l'equipe en cherche la cause."}},{"id":"a18","level":"advanced","ref":"rights","area":"Client Rights","a":2,"en":{"q":"A resident tells the nurse aide that another staff member took money from her drawer. The aide should:","o":["Search the accused person's belongings","Tell the resident she is confused","Report it to the nurse or supervisor immediately","Ask other residents if they saw anything"],"w":"Financial abuse is abuse; it is reported, never investigated by the aide."},"fr":{"q":"Une residente dit a l'aide-soignant qu'un autre membre du personnel a pris de l'argent dans son tiroir. L'aide doit :","o":["Fouiller les affaires de la personne accusee","Dire a la residente qu'elle confond","Le signaler immediatement a l'infirmiere ou au superieur","Demander aux autres residents s'ils ont vu quelque chose"],"w":"L'abus financier est un abus ; il se signale, il ne s'enquete jamais par l'aide-soignant."}},{"id":"a19","level":"advanced","ref":"rights","area":"Client Rights","a":3,"en":{"q":"A nurse aide posts a photo of a resident's birthday party on social media. This is:","o":["Acceptable if the resident smiled","Acceptable if no names are used","Acceptable if the family is tagged","A violation of privacy and confidentiality"],"w":"Posting any identifiable resident image or information is a breach, regardless of intent."},"fr":{"q":"Un aide-soignant publie sur les reseaux sociaux une photo de la fete d'anniversaire d'un resident. C'est :","o":["Acceptable si le resident souriait","Acceptable si aucun nom n'est cite","Acceptable si la famille est identifiee","Une violation de l'intimite et de la confidentialite"],"w":"Publier une image ou une information identifiante d'un resident est une violation, quelle que soit l'intention."}},{"id":"a20","level":"advanced","ref":"rights","area":"Client Rights","a":2,"en":{"q":"A resident's daughter asks the nurse aide to keep her mother in bed all day so she will not fall. The aide should:","o":["Follow the daughter's request","Refuse and say nothing further","Explain that the care plan directs the care and report the request to the nurse","Keep the resident in bed only in the afternoon"],"w":"Family cannot order care, and keeping a resident in bed unnecessarily is a restraint and causes harm."},"fr":{"q":"La fille d'une residente demande a l'aide-soignant de garder sa mere au lit toute la journee pour eviter une chute. L'aide doit :","o":["Suivre la demande de la fille","Refuser sans rien ajouter","Expliquer que le plan de soins dirige les soins et signaler la demande a l'infirmiere","Garder la residente au lit seulement l'apres-midi"],"w":"La famille ne prescrit pas les soins, et garder inutilement un resident au lit est une contention nuisible."}},{"id":"a21","level":"advanced","ref":"team","area":"Member of the Health Care Team","a":2,"en":{"q":"A nurse asks the nurse aide to perform a task the aide has never been trained to do. The aide should:","o":["Attempt it and ask a coworker afterward","Refuse without explanation","Say she has not been trained and ask for instruction or reassignment","Have another aide do it"],"w":"Performing an untrained task endangers the resident and the aide's certification."},"fr":{"q":"Une infirmiere demande a l'aide-soignant un geste pour lequel il n'a jamais ete forme. L'aide doit :","o":["Essayer puis demander a un collegue","Refuser sans explication","Dire qu'il n'est pas forme et demander une formation ou une reaffectation","Demander a un autre aide de le faire"],"w":"Realiser un geste non maitrise met en danger le resident et le certificat de l'aide-soignant."}},{"id":"a22","level":"advanced","ref":"team","area":"Member of the Health Care Team","a":1,"en":{"q":"A nurse aide realizes at the end of the shift that she forgot to record a resident's output. She should:","o":["Estimate the amount and record it","Tell the nurse and record only what she can verify","Leave it blank and say nothing","Ask a coworker to guess"],"w":"Documentation must be true; inventing a number is falsification that can affect treatment."},"fr":{"q":"Une aide-soignante s'apercoit en fin de service qu'elle a oublie de noter les sorties d'un resident. Elle doit :","o":["Estimer la quantite et la noter","Prevenir l'infirmiere et ne noter que ce qu'elle peut verifier","Laisser vide et ne rien dire","Demander a un collegue de deviner"],"w":"La documentation doit etre vraie ; inventer un chiffre est une falsification qui peut fausser le traitement."}},{"id":"a23","level":"advanced","ref":"team","area":"Member of the Health Care Team","a":2,"en":{"q":"A nurse aide is assigned more residents than she believes she can safely care for. She should:","o":["Work faster and skip documentation","Refuse the assignment and leave","Tell the charge nurse before the shift begins and ask how to prioritize","Care for only half of them"],"w":"Raise the concern up front so the nurse can reassign or set priorities; abandoning residents is not an option."},"fr":{"q":"Une aide-soignante recoit plus de residents qu'elle ne pense pouvoir prendre en charge en securite. Elle doit :","o":["Travailler plus vite et sauter la documentation","Refuser l'affectation et partir","Prevenir l'infirmiere responsable avant le debut du service et demander comment prioriser","Ne s'occuper que de la moitie"],"w":"Signaler le probleme d'emblee pour que l'infirmiere reaffecte ou priorise ; abandonner les residents n'est pas une option."}},{"id":"a24","level":"advanced","ref":"team","area":"Member of the Health Care Team","a":2,"en":{"q":"During the end-of-shift report, the most important information for the nurse aide to pass on is:","o":["Which residents were pleasant","Personal opinions about families","Changes in condition, intake and output, skin and refusals of care","Which call lights rang most"],"w":"The next shift needs facts that affect safe care, not impressions."},"fr":{"q":"Lors de la transmission de fin de service, l'information la plus importante a transmettre est :","o":["Quels residents etaient agreables","Les opinions personnelles sur les familles","Les changements d'etat, entrees et sorties, etat de la peau et refus de soins","Quelles sonnettes ont le plus sonne"],"w":"L'equipe suivante a besoin de faits qui influencent la securite des soins, pas d'impressions."}},{"id":"a25","level":"advanced","ref":"infection","area":"Basic Nursing Skills","a":3,"en":{"q":"A nurse aide has a small open cut on her hand. Before giving care she should:","o":["Wash it and continue without gloves","Cover it with a tissue","Avoid resident contact for the shift","Cover it with a waterproof dressing and wear gloves"],"w":"Broken skin is an entry point for infection in both directions; cover and glove."},"fr":{"q":"Une aide-soignante a une petite coupure ouverte a la main. Avant de donner des soins, elle doit :","o":["La laver et continuer sans gants","La couvrir d'un mouchoir","Eviter tout contact avec les residents pour la journee","La couvrir d'un pansement impermeable et porter des gants"],"w":"Une peau lesee est une porte d'entree pour l'infection dans les deux sens ; couvrir et mettre des gants."}},{"id":"a26","level":"advanced","ref":"infection","area":"Basic Nursing Skills","a":2,"en":{"q":"A nurse aide notices a coworker leaving an isolation room still wearing the gown. The aide should:","o":["Say nothing, it is not her business","Report it at the end of the shift","Speak up immediately and tell the nurse","Follow the coworker to clean the floor"],"w":"Contaminated PPE leaving the room spreads infection to every resident on the hall; this is urgent."},"fr":{"q":"Une aide-soignante voit un collegue sortir d'une chambre d'isolement en gardant sa blouse. Elle doit :","o":["Ne rien dire, ce n'est pas son affaire","Le signaler en fin de service","Intervenir immediatement et prevenir l'infirmiere","Suivre le collegue pour nettoyer le sol"],"w":"Un EPI contamine qui sort de la chambre propage l'infection a tout le couloir ; c'est urgent."}},{"id":"a27","level":"advanced","ref":"vitals2","area":"Basic Nursing Skills","a":2,"en":{"q":"A resident's blood pressure reads much higher than usual. The nurse aide should:","o":["Record it and move on","Retake it on the other arm and report the reading to the nurse","Tell the resident to relax and forget it","Subtract the usual difference"],"w":"Confirm the reading, then report. Never adjust or discard an unexpected number."},"fr":{"q":"La tension d'un resident est bien plus elevee que d'habitude. L'aide-soignant doit :","o":["La noter et passer a autre chose","La reprendre a l'autre bras et signaler la valeur a l'infirmiere","Dire au resident de se detendre et oublier","Soustraire l'ecart habituel"],"w":"Confirmer la mesure puis signaler. Ne jamais ajuster ni ecarter une valeur inattendue."}},{"id":"a28","level":"advanced","ref":"vitals1","area":"Basic Nursing Skills","a":1,"en":{"q":"A resident's temperature is 101.4 F (38.6 C) and the skin is hot and flushed. The nurse aide should:","o":["Cover the resident with extra blankets","Report it to the nurse and offer fluids if allowed","Give a cool bath immediately","Open the window"],"w":"Report the fever. Extra blankets raise temperature further and treatments are the nurse's decision."},"fr":{"q":"Un resident a 38,6 C, la peau chaude et rouge. L'aide-soignant doit :","o":["Le couvrir de couvertures supplementaires","Le signaler a l'infirmiere et proposer a boire si c'est autorise","Lui donner un bain froid immediatement","Ouvrir la fenetre"],"w":"Signaler la fievre. Des couvertures supplementaires font monter la temperature et les traitements relevent de l'infirmiere."}},{"id":"a29","level":"advanced","ref":"elimination","area":"Basic Nursing Skills","a":2,"en":{"q":"A resident with an indwelling catheter has no urine in the bag for four hours. The nurse aide should:","o":["Irrigate the catheter","Increase the resident's fluids and wait","Check for kinks and report it to the nurse","Reposition the bag higher"],"w":"Check the simple mechanical causes, then report. Aides never irrigate a catheter."},"fr":{"q":"Un resident porteur d'une sonde a demeure n'a pas d'urine dans le sac depuis quatre heures. L'aide-soignant doit :","o":["Irriguer la sonde","Augmenter ses boissons et attendre","Verifier les coudes de la tubulure et prevenir l'infirmiere","Remonter le sac plus haut"],"w":"Verifier les causes mecaniques simples, puis signaler. L'aide n'irrigue jamais une sonde."}},{"id":"a30","level":"advanced","ref":"elimination","area":"Basic Nursing Skills","a":1,"en":{"q":"A resident says it burns when she urinates and she feels she must go constantly. The nurse aide should:","o":["Report the symptoms to the nurse","Offer cranberry juice and observe","Restrict fluids to reduce the urge","Tell her it is normal with age"],"w":"Burning and urgency suggest a urinary tract infection, which needs the nurse's assessment."},"fr":{"q":"Une residente dit que ca brule quand elle urine et qu'elle a constamment envie. L'aide-soignant doit :","o":["Signaler les symptomes a l'infirmiere","Proposer du jus de canneberge et observer","Restreindre les boissons pour reduire l'envie","Lui dire que c'est normal avec l'age"],"w":"Brulure et urgence evoquent une infection urinaire, qui exige l'evaluation de l'infirmiere."}},{"id":"a31","level":"advanced","ref":"communication","area":"Communication","a":2,"en":{"q":"A resident who is usually alert becomes confused and cannot say where she is. The nurse aide should:","o":["Reorient her and continue the routine","Assume it is dementia beginning","Report the sudden change to the nurse immediately","Ask the family if she is always like this"],"w":"A sudden change in mental status can signal infection, low oxygen or medication effects, and is urgent."},"fr":{"q":"Une residente habituellement lucide devient confuse et ne sait plus ou elle est. L'aide-soignant doit :","o":["La reorienter et poursuivre la routine","Supposer que la demence commence","Signaler immediatement ce changement brutal a l'infirmiere","Demander a la famille si elle est toujours ainsi"],"w":"Un changement brutal de l'etat mental peut signaler infection, manque d'oxygene ou effet medicamenteux : c'est urgent."}},{"id":"a32","level":"advanced","ref":"communication","area":"Communication","a":1,"en":{"q":"A resident is crying and says she does not want to talk about it. The nurse aide should:","o":["Sit quietly nearby and let her know she is there","Leave immediately and close the door","Insist she explain what is wrong","Call the family at once"],"w":"Presence without pressure respects the refusal while not abandoning the resident."},"fr":{"q":"Une residente pleure et dit qu'elle ne veut pas en parler. L'aide-soignant doit :","o":["S'asseoir calmement pres d'elle et lui faire savoir qu'il est la","Partir immediatement et fermer la porte","Insister pour qu'elle explique","Appeler la famille tout de suite"],"w":"Une presence sans pression respecte le refus sans abandonner la residente."}},{"id":"a33","level":"advanced","ref":"hygiene","area":"Activities of Daily Living","a":2,"en":{"q":"A resident refuses to let the nurse aide look at a reddened area on her back, saying she is embarrassed. The aide should:","o":["Look anyway while turning her","Skip the skin check and document a refusal","Explain why the check matters, offer privacy and a same-gender aide if possible, and report the refusal","Tell her the doctor ordered it"],"w":"Respect the refusal, remove the barrier where possible, and report so the skin still gets assessed."},"fr":{"q":"Une residente refuse que l'aide-soignant regarde une rougeur dans son dos, par gene. L'aide doit :","o":["Regarder quand meme en la retournant","Sauter la verification et noter un refus","Expliquer l'interet, proposer l'intimite et un soignant du meme sexe si possible, et signaler le refus","Lui dire que le medecin l'a prescrit"],"w":"Respecter le refus, lever l'obstacle si possible, et signaler pour que la peau soit quand meme evaluee."}},{"id":"a34","level":"advanced","ref":"dressing","area":"Activities of Daily Living","a":1,"en":{"q":"A resident who is incontinent is embarrassed and apologizes repeatedly. The nurse aide should:","o":["Say nothing and work quickly","Reassure her matter-of-factly, keep her covered, and change her without comment on the accident","Tell her it happens to everyone here","Ask her to try harder to call in time"],"w":"Calm, unhurried, non-judgmental care preserves dignity; shame makes residents delay calling and fall."},"fr":{"q":"Une residente incontinente est genee et s'excuse sans cesse. L'aide-soignant doit :","o":["Ne rien dire et travailler vite","La rassurer simplement, la garder couverte, et la changer sans commenter l'accident","Lui dire que cela arrive a tout le monde ici","Lui demander de faire un effort pour appeler a temps"],"w":"Des soins calmes, sans jugement, preservent la dignite ; la honte pousse a ne pas appeler et provoque des chutes."}},{"id":"a35","level":"advanced","ref":"restorative","area":"Restorative Skills","a":2,"en":{"q":"A resident recovering from a stroke can do part of his own grooming but it takes a long time. The nurse aide should:","o":["Do it for him to keep the schedule","Do the difficult parts and let him do the rest","Allow the time and encourage him to do what he can","Ask the family to do it at visits"],"w":"Restorative care means building function back, which takes time now to save function later."},"fr":{"q":"Un resident en recuperation d'AVC peut faire une partie de sa toilette mais cela prend longtemps. L'aide-soignant doit :","o":["Le faire a sa place pour tenir le planning","Faire les parties difficiles et lui laisser le reste","Lui laisser le temps et l'encourager a faire ce qu'il peut","Demander a la famille de le faire aux visites"],"w":"La readaptation vise a reconstruire la fonction : du temps maintenant evite une perte plus tard."}},{"id":"a36","level":"advanced","ref":"mental","area":"Emotional and Mental Health Needs","a":2,"en":{"q":"Two residents who share a room argue constantly. The nurse aide should:","o":["Tell them to work it out","Move one resident's belongings to another room","Report the conflict to the nurse so the team can address it","Keep one of them out of the room during the day"],"w":"Room changes and conflict resolution are team decisions; the aide observes and reports."},"fr":{"q":"Deux residents partageant une chambre se disputent sans arret. L'aide-soignant doit :","o":["Leur dire de se debrouiller","Deplacer les affaires de l'un dans une autre chambre","Signaler le conflit a l'infirmiere pour que l'equipe intervienne","Garder l'un des deux hors de la chambre la journee"],"w":"Les changements de chambre et la mediation sont des decisions d'equipe ; l'aide observe et signale."}},{"id":"a37","level":"advanced","ref":"mental","area":"Emotional and Mental Health Needs","a":1,"en":{"q":"A resident in the last stage of a terminal illness asks the nurse aide whether she is dying. The aide should:","o":["Stay with her, listen, and tell the nurse she raised the question","Say that everyone dies eventually","Change the subject","Tell her she has a long time left"],"w":"The aide does not give prognosis but does not abandon the resident; listen and involve the nurse."},"fr":{"q":"Une residente en phase terminale demande a l'aide-soignant si elle est en train de mourir. L'aide doit :","o":["Rester avec elle, l'ecouter et prevenir l'infirmiere qu'elle a pose la question","Dire que tout le monde meurt un jour","Changer de sujet","Lui dire qu'il lui reste longtemps"],"w":"L'aide ne donne pas de pronostic mais n'abandonne pas la residente : ecouter et impliquer l'infirmiere."}},{"id":"a38","level":"advanced","ref":"team","area":"Member of the Health Care Team","a":1,"en":{"q":"A resident dies during the shift. The nurse aide's role includes:","o":["Deciding when the family should be called","Removing all tubes and dressings","Providing respectful post-mortem care as directed and following facility
