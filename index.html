 policy","Telling the family the cause of death"],"w":"Post-mortem care follows policy and the nurse's direction; tubes are not removed by the aide."},"fr":{"q":"Un resident decede pendant le service. Le role de l'aide-soignant comprend :","o":["Decider quand appeler la famille","Retirer tous les tubes et pansements","Assurer des soins post-mortem respectueux selon les consignes et la politique de l'etablissement","Annoncer a la famille la cause du deces"],"w":"Les soins post-mortem suivent la politique et les consignes de l'infirmiere ; l'aide ne retire pas les tubes."}},{"id":"a39","level":"advanced","ref":"precautions","area":"Basic Nursing Skills","a":1,"en":{"q":"A resident's room has a sign requiring a fitted respirator and the door kept closed. These are:","o":["Airborne precautions","Contact precautions","Droplet precautions","Standard precautions"],"w":"Airborne precautions require a fitted respirator, a controlled-airflow room and a closed door."},"fr":{"q":"La chambre d'un resident porte une consigne exigeant un appareil respiratoire ajuste et la porte fermee. Ce sont :","o":["Des precautions air","Des precautions contact","Des precautions gouttelettes","Des precautions standard"],"w":"Les precautions air exigent un appareil ajuste, une chambre a flux controle et une porte fermee."}},{"id":"a40","level":"advanced","ref":"measure","area":"Basic Nursing Skills","a":2,"en":{"q":"A resident on strict intake and output drinks part of a 240 mL cup of juice, leaving about a quarter. The aide records intake as:","o":["240 mL","60 mL","180 mL","120 mL"],"w":"Three quarters of 240 mL is 180 mL. Record what was consumed, not what was served."},"fr":{"q":"Un resident sous surveillance stricte des entrees boit une partie d'un verre de jus de 240 mL, en laissant environ un quart. L'aide note une entree de :","o":["240 mL","60 mL","180 mL","120 mL"],"w":"Trois quarts de 240 mL font 180 mL. On note ce qui a ete consomme, pas ce qui a ete servi."}},{"id":"a41","level":"advanced","ref":"emergency","area":"Basic Nursing Skills","a":1,"en":{"q":"A small fire starts in a waste basket in an empty room. Following RACE, after rescuing anyone in danger the nurse aide should:","o":["Sound the alarm","Try to put it out first","Open the windows","Move residents to the far end of the hall"],"w":"Alarm comes second so help is on the way before anyone attempts to confine or extinguish."},"fr":{"q":"Un petit feu demarre dans une poubelle d'une chambre vide. Selon RACE, apres avoir mis les personnes en securite, l'aide-soignant doit :","o":["Declencher l'alarme","Essayer d'abord de l'eteindre","Ouvrir les fenetres","Deplacer les residents au bout du couloir"],"w":"L'alarme vient en second pour que les secours soient prevenus avant toute tentative de confinement ou d'extinction."}},{"id":"a42","level":"advanced","ref":"ppe","area":"Basic Nursing Skills","a":2,"en":{"q":"After removing gloves and gown in an isolation room, the nurse aide should remove the mask:","o":["By touching the front","After leaving the room and washing hands","By the ties or ear loops, then perform hand hygiene","Before removing the gown"],"w":"The front of the mask is contaminated; handle only the ties, and wash hands immediately after."},"fr":{"q":"Apres avoir retire gants et blouse dans une chambre d'isolement, l'aide-soignant doit retirer le masque :","o":["En touchant le devant","Apres etre sorti et s'etre lave les mains","Par les liens ou les elastiques, puis se laver les mains","Avant de retirer la blouse"],"w":"Le devant du masque est contamine ; le manipuler par les liens, puis se laver les mains immediatement."}},{"id":"a43","level":"advanced","ref":"rights","area":"Client Rights","a":1,"en":{"q":"A resident who is alert asks the nurse aide not to tell her family that she fell. The aide should:","o":["Agree to keep it private","Explain that the fall must be reported to the nurse, and that the nurse will discuss family notification with her","Tell the family anyway","Ask the resident to write it down"],"w":"Safety events must be reported; the aide does not promise secrecy but does not go around the resident either."},"fr":{"q":"Une residente lucide demande a l'aide-soignant de ne pas dire a sa famille qu'elle est tombee. L'aide doit :","o":["Accepter de garder le secret","Expliquer que la chute doit etre signalee a l'infirmiere, et que celle-ci discutera avec elle de l'information a la famille","Prevenir la famille quand meme","Demander a la residente de l'ecrire"],"w":"Un evenement de securite doit etre signale ; l'aide ne promet pas le secret mais ne contourne pas la residente non plus."}},{"id":"a44","level":"advanced","ref":"infection","area":"Basic Nursing Skills","a":1,"en":{"q":"The correct order for putting on PPE before entering a contact-precaution room is:","o":["Gown, gloves","Gloves, gown","Gown, mask, gloves","Gloves, mask, gown"],"w":"For contact precautions the gown goes on first, then gloves over the gown cuffs."},"fr":{"q":"L'ordre correct pour mettre l'EPI avant d'entrer dans une chambre en precautions contact est :","o":["Blouse, gants","Gants, blouse","Blouse, masque, gants","Gants, masque, blouse"],"w":"En precautions contact, la blouse se met en premier, puis les gants par-dessus les manches."}},{"id":"a45","level":"advanced","ref":"skin","area":"Basic Nursing Skills","a":1,"en":{"q":"When inspecting the skin of a resident who lies mostly on her back, the nurse aide pays closest attention to:","o":["The palms and the abdomen","The heels, tailbone, elbows, shoulder blades and back of the head","The forearms and the shins","The fingertips"],"w":"These are the bony pressure points that bear weight in the supine position."},"fr":{"q":"En examinant la peau d'une residente surtout allongee sur le dos, l'aide-soignant surveille en priorite :","o":["Les paumes et l'abdomen","Les talons, le sacrum, les coudes, les omoplates et l'arriere de la tete","Les avant-bras et les tibias","Le bout des doigts"],"w":"Ce sont les points d'appui osseux qui portent le poids en position couchee sur le dos."}},{"id":"a46","level":"advanced","ref":"transfers","area":"Basic Nursing Skills","a":2,"en":{"q":"A mechanical lift is ordered for a resident. The nurse aide should:","o":["Use it alone to save time","Use it only if the resident agrees to stand","Use it with the number of staff the care plan specifies, usually two","Use it only at night"],"w":"A mechanical lift is a two-person procedure unless the manufacturer and care plan state otherwise."},"fr":{"q":"Un leve-personne est prescrit pour un resident. L'aide-soignant doit :","o":["L'utiliser seul pour gagner du temps","L'utiliser seulement si le resident accepte de se lever","L'utiliser avec le nombre de soignants prevu au plan de soins, en general deux","L'utiliser seulement la nuit"],"w":"Le leve-personne est une manoeuvre a deux, sauf indication contraire du fabricant et du plan de soins."}},{"id":"a47","level":"advanced","ref":"nutrition","area":"Basic Nursing Skills","a":1,"en":{"q":"A resident begins coughing and turning red during a meal but is still able to speak. The nurse aide should:","o":["Stop the meal, stay with him and encourage coughing","Give him water to clear it","Perform abdominal thrusts","Continue feeding slowly"],"w":"He is moving air; stop feeding, stay, and let the cough work. Water can worsen aspiration."},"fr":{"q":"Un resident se met a tousser et devient rouge pendant le repas mais peut encore parler. L'aide-soignant doit :","o":["Arreter le repas, rester pres de lui et encourager la toux","Lui donner de l'eau pour faire passer","Faire des compressions abdominales","Continuer a le faire manger lentement"],"w":"De l'air passe encore ; arreter le repas, rester la, laisser la toux agir. L'eau peut aggraver la fausse route."}},{"id":"a48","level":"advanced","ref":"team","area":"Member of the Health Care Team","a":2,"en":{"q":"A nurse aide disagrees with an instruction from the nurse about a resident's transfer method. The aide should:","o":["Use the method she prefers","Ask another aide to do the transfer","Raise the concern with the nurse before performing the transfer","Perform it and document her disagreement"],"w":"Raise a safety concern before acting; performing a transfer you believe is unsafe risks real injury."},"fr":{"q":"Un aide-soignant n'est pas d'accord avec la consigne de l'infirmiere sur la methode de transfert d'un resident. Il doit :","o":["Utiliser la methode qu'il prefere","Demander a un autre aide de faire le transfert","Exprimer sa reserve a l'infirmiere avant de faire le transfert","Le faire et documenter son desaccord"],"w":"Exprimer une reserve de securite avant d'agir ; realiser un transfert juge dangereux expose a une blessure reelle."}},{"id":"a49","level":"advanced","ref":"communication","area":"Communication","a":3,"en":{"q":"A resident who speaks little English becomes distressed during care. The nurse aide should:","o":["Speak louder in English","Continue and finish quickly","Use the family member present to interpret medical information","Stop, use gestures and simple words, and ask the nurse about interpreter services"],"w":"Slow down and get proper interpretation; relying on family for medical communication is not appropriate."},"fr":{"q":"Un resident qui parle peu la langue s'affole pendant un soin. L'aide-soignant doit :","o":["Parler plus fort dans la meme langue","Continuer et finir rapidement","Utiliser le proche present pour traduire les informations medicales","S'arreter, utiliser gestes et mots simples, et demander a l'infirmiere un service d'interpretation"],"w":"Ralentir et obtenir une vraie interpretation ; s'appuyer sur la famille pour la communication medicale n'est pas approprie."}},{"id":"a50","level":"advanced","ref":"vitals1","area":"Basic Nursing Skills","a":3,"en":{"q":"A resident's pulse is 52 and he says he feels fine. The nurse aide should:","o":["Record it as normal","Recheck in four hours","Ask him to walk and recheck","Report the rate to the nurse"],"w":"A pulse below 60 is outside the normal range and is reported even when the resident feels well."},"fr":{"q":"Le pouls d'un resident est a 52 et il dit se sentir bien. L'aide-soignant doit :","o":["Le noter comme normal","Le recontroler dans quatre heures","Lui demander de marcher puis recontroler","Signaler la frequence a l'infirmiere"],"w":"Un pouls inferieur a 60 sort de la plage normale et se signale meme si le resident se sent bien."}}],"areaFr":{"Activities of Daily Living":"Activites de la vie quotidienne","Basic Nursing Skills":"Soins infirmiers de base","Restorative Skills":"Soins de readaptation","Emotional and Mental Health Needs":"Besoins emotionnels et de sante mentale","Communication":"Communication","Client Rights":"Droits du resident","Member of the Health Care Team":"Membre de l'equipe de soins"},"blueprint":{"Activities of Daily Living":4,"Basic Nursing Skills":22,"Restorative Skills":3,"Emotional and Mental Health Needs":8,"Communication":6,"Client Rights":12,"Member of the Health Care Team":5}};

const shuffle = a => { const r=a.slice(); for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; };

const STOP = new Set(("the a an of to in on for is are be do does should must when what how why which that this with and or not no as at by from it its resident nurse aide "+
 "le la les un une des de du a au aux et ou ne pas est sont doit doivent quand comment pourquoi quel quelle que qui dans sur pour avec resident aide soignant il elle").split(/\s+/));
function tokens(s){ return strip(s).replace(/[^a-z0-9\s]/g," ").split(/\s+/).filter(w=>w.length>2 && !STOP.has(w)); }

const INDEX = [];
DATA.guide.forEach(sec=>{
  ["en","fr"].forEach(lg=>{
    sec[lg].points.forEach((p,i)=>{
      INDEX.push({sec:sec.id, lang:lg, page:sec.page, title:sec[lg].title, text:p,
                  tok:new Set(tokens(p)), ttok:new Set(tokens(sec[lg].title))});
    });
  });
});

/* Inverse document frequency: a word that appears in almost every section
   (often, should, care) tells us far less than a rare one (reposition, catheter). */
const IDF = {en:{}, fr:{}};
["en","fr"].forEach(lg=>{
  const rows = INDEX.filter(r=>r.lang===lg);
  const df = {};
  rows.forEach(r=>{ new Set([...r.tok, ...r.ttok]).forEach(w=>{ df[w]=(df[w]||0)+1; }); });
  Object.keys(df).forEach(w=>{ IDF[lg][w] = Math.log(rows.length / (1 + df[w])) + 0.35; });
});
const idf = (lg,w) => IDF[lg][w] !== undefined ? Math.max(IDF[lg][w], 0.05) : 1.4;

function search(q, lang){
  const qt = [...new Set(tokens(q))];
  if(!qt.length) return [];
  const scored = INDEX.filter(r=>r.lang===lang).map(r=>{
    let s=0;
    qt.forEach(w=>{
      const weight = idf(lang,w);
      if(r.ttok.has(w)) s += 3*weight;          // in the section heading
      else if(r.tok.has(w)) s += 2*weight;      // exact word in the text
      else {
        for(const rw of r.tok){
          if(rw.length>4 && (rw.startsWith(w)||w.startsWith(rw)) && Math.abs(rw.length-w.length)<=3){ s += 0.9*weight; break; }
        }
      }
    });
    return {r,s};
  }).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);
  if(!scored.length) return [];
  const best = scored[0].s;
  const out=[]; const seen=new Set();
  for(const x of scored){
    if(x.s < best*0.35) break;                  // drop weak tail matches
    const key=x.r.sec+"|"+x.r.text.slice(0,30);
    if(seen.has(key)) continue; seen.add(key);
    out.push(x.r);
    if(out.length>=4) break;
  }
  return out;
}
function highlight(text, q){
  const qt=tokens(q); if(!qt.length) return text;
  let html = text.replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  qt.forEach(w=>{
    try{ html = html.replace(new RegExp("("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"[a-zA-Zàâçéèêëîïôûùüÿñ]*)","gi"), "<mark>$1</mark>"); }catch(e){}
  });
  return html;
}

/* ------------------------------------------------------------------ quiz */
function pick(level){
  if(level==="exam"){
    const byArea = {};
    DATA.q.forEach(q=>{ (byArea[q.area] = byArea[q.area]||[]).push(q); });
    const want = DATA.blueprint;
    let out=[];
    Object.keys(want).forEach(a=>{
      const pool = shuffle(byArea[a]||[]);
      out = out.concat(pool.slice(0, want[a]));
    });
    if(out.length<60) out = out.concat(shuffle(DATA.q.filter(q=>!out.includes(q))).slice(0,60-out.length));
    return shuffle(out).slice(0,60);
  }
  return shuffle(DATA.q.filter(q=>q.level===level));
}
function startQuiz(level){
  quiz = {level, items:pick(level), i:0, answers:[], score:0};
  go("quiz", level); paintQ();
}
function paintQ(){
  const q = quiz.items[quiz.i];
  const L = q[LANG];
  $("#q-meta").textContent = t("question")+" "+(quiz.i+1)+" "+t("of")+" "+quiz.items.length;
  $("#q-bar").style.width = ((quiz.i)/quiz.items.length*100)+"%";
  const c = $("#q-card"); c.innerHTML="";
  c.appendChild(el("div","tag", (LANG==="fr"? DATA.areaFr[q.area] : q.area)));
  c.appendChild(el("h2","stem", L.q));
  const opts = el("div","opts");
  L.o.forEach((text,idx)=>{
    const b = el("button","opt");
    b.appendChild(el("i",null,"ABCD"[idx]));
    b.appendChild(el("span",null,text));
    b.onclick = ()=> answer(idx);
    opts.appendChild(b);
  });
  c.appendChild(opts);
  const chosen = quiz.answers[quiz.i];
  $("#q-next").style.display = (chosen==null) ? "none" : "block";
  $("#q-next").textContent = (quiz.i===quiz.items.length-1) ? t("finish") : t("next");
  if(chosen!=null) showFeedback(chosen, true);
}
function answer(idx){
  if(quiz.answers[quiz.i]!=null) return;
  quiz.answers[quiz.i]=idx;
  if(idx===quiz.items[quiz.i].a) quiz.score++;
  showFeedback(idx);
  $("#q-next").style.display="block";
}
function showFeedback(idx, replay){
  const q=quiz.items[quiz.i], L=q[LANG];
  const btns=[...document.querySelectorAll("#q-card .opt")];
  btns.forEach((b,i)=>{
    b.disabled=true;
    if(i===q.a) b.classList.add("correct");
    else if(i===idx) b.classList.add("wrong");
  });
  const ok = idx===q.a;
  const w = el("div","why");
  const v = el("p","verdict "+(ok?"ok":"no"), ok? t("correct") : t("incorrect"));
  w.appendChild(v);
  w.appendChild(el("p",null,L.w));
  const sec = secById(q.ref);
  if(sec){
    const sb = el("button","srcbtn", t("source")+" — "+sec[LANG].title+", "+t("page")+sec.page);
    sb.onclick = ()=>{ openGuide(sec.id); };
    w.appendChild(sb);
  }
  $("#q-card").appendChild(w);
}
$("#q-next").onclick = ()=>{
  if(quiz.i < quiz.items.length-1){ quiz.i++; paintQ(); }
  else finish();
};
$("#q-quit").onclick = ()=>{ quiz=null; go("home"); };

function finish(){
  const total=quiz.items.length, sc=quiz.score;
  $("#r-score").textContent = sc;
  $("#r-of").textContent = " / "+total;
  const pct = sc/total*100;
  $("#r-verdict").textContent = pct>=80? t("vgood") : pct>=70? t("vok") : t("vlow");
  // breakdown
  const by={};
  quiz.items.forEach((q,i)=>{
    by[q.area]=by[q.area]||{n:0,ok:0};
    by[q.area].n++;
    if(quiz.answers[i]===q.a) by[q.area].ok++;
  });
  const brk=$("#r-brk"); brk.innerHTML="";
  Object.keys(by).sort((a,b)=> (by[a].ok/by[a].n)-(by[b].ok/by[b].n)).forEach(a=>{
    const row=el("div","brkrow");
    row.appendChild(el("span",null, LANG==="fr"? DATA.areaFr[a] : a));
    const m=el("span","mini"); const i=el("i"); i.style.width=Math.round(by[a].ok/by[a].n*100)+"%"; m.appendChild(i);
    row.append(m, el("b",null, by[a].ok+"/"+by[a].n));
    brk.appendChild(row);
  });
  // missed
  const box=$("#r-missed"); box.innerHTML="";
  quiz.items.forEach((q,i)=>{
    if(quiz.answers[i]===q.a) return;
    const L=q[LANG], sec=secById(q.ref);
    const d=document.createElement("details");
    const s=document.createElement("summary"); s.textContent=L.q; d.appendChild(s);
    const b=el("div","body");
    b.appendChild(el("p",null,"")).innerHTML = "<b>"+"ABCD"[q.a]+") "+L.o[q.a].replace(/</g,"&lt;")+"</b>";
    b.appendChild(el("p",null,L.w));
    if(sec){
      const sb=el("button","srcbtn", t("source")+" — "+sec[LANG].title+", "+t("page")+sec.page);
      sb.onclick=()=>openGuide(sec.id);
      b.appendChild(sb);
    }
    d.appendChild(b); box.appendChild(d);
  });
  // persist
  const p=store.get();
  p.runs = (p.runs||[]).concat([{level:quiz.level, score:sc, total, at:Date.now()}]).slice(-40);
  p.answered = (p.answered||0)+total;
  p.areas = p.areas||{};
  Object.keys(by).forEach(a=>{
    p.areas[a]=p.areas[a]||{n:0,ok:0};
    p.areas[a].n+=by[a].n; p.areas[a].ok+=by[a].ok;
  });
  store.set(p);
  renderRecent(); renderBrand();
  go("res", quiz.level);
}

function renderGuide(filter){
  const box=$("#g-list"); box.innerHTML="";
  const qv = (filter!=null? filter : $("#g-q").value) || "";
  const qt = tokens(qv);
  DATA.guide.forEach(sec=>{
    const L=sec[LANG];
    let points=L.points;
    if(qt.length){
      const hay = strip(L.title+" "+L.points.join(" "));
      if(!qt.some(w=>hay.includes(w))) return;
      points = L.points.filter(p=> qt.some(w=>strip(p).includes(w)) ) ;
      if(!points.length) points=L.points;
    }
    const d=document.createElement("details"); d.className="gitem"; d.id="sec-"+sec.id;
    if(qt.length) d.open=true;
    const s=document.createElement("summary");
    const gt=el("span","gt",L.title); const gp=el("span","gp", t("page")+sec.page);
    s.append(gt,gp); d.appendChild(s);
    const ul=document.createElement("ul");
    points.forEach(p=>{ const li=document.createElement("li"); li.innerHTML = qt.length? highlight(p,qv) : p.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); ul.appendChild(li); });
    d.appendChild(ul); box.appendChild(d);
  });
  if(!box.children.length) box.appendChild(el("div","nores", t("nores")));
}
$("#g-q").addEventListener("input", ()=> renderGuide());
function openGuide(id){
  go("guide"); $("#g-q").value=""; renderGuide("");
  const d=$("#sec-"+id);
  if(d){ d.open=true; setTimeout(()=>d.scrollIntoView({block:"start", behavior:"smooth"}), 60); }
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-current", String(b.dataset.go==="guide")));
}

/* ------------------------------------------------------------------ ask */
$("#a-go").onclick = ()=> doAsk();
$("#a-in").addEventListener("keydown", e=>{ if(e.key==="Enter" && (e.metaKey||e.ctrlKey)) doAsk(); });
function doAsk(){
  const q = $("#a-in").value.trim();
  const out=$("#a-out"); out.innerHTML="";
  if(!q) return;
  const hits = search(q, LANG);
  if(!hits.length){
    const n=el("div","nores", t("nores"));
    out.appendChild(n);
    addPostButton(out, q);
    return;
  }
  out.appendChild(el("div","sectionlabel", t("found")));
  hits.forEach(h=>{
    const c=el("div","hit");
    c.appendChild(el("div","src", h.title+" — "+t("page")+h.page));
    const p=el("p"); p.innerHTML = highlight(h.text, q); c.appendChild(p);
    const b=el("button","srcbtn", t("source"));
    b.onclick=()=>openGuide(h.sec);
    c.appendChild(b);
    out.appendChild(c);
  });
  addPostButton(out, q);
}
function addPostButton(out, q){
  if(!DB) return;
  const b=el("button","btn ghost", t("postq"));
  b.onclick = async ()=>{
    b.disabled=true;
    try{
      const id = "q"+Date.now()+Math.floor(Math.random()*1000);
      await DB.doc("questions/"+id).set({text:q, lang:LANG, at:Date.now(), answer:""});
      b.textContent = t("posted");
      $("#a-in").value="";
      renderBoard();
    }catch(e){ b.textContent = t("boardoff"); }
  };
  out.appendChild(b);
}
let DB=null, BOARD=[];
async function initDB(){
  try{
    DB = await window.claude?.use?.("db");
  }catch(e){ DB=null; }
  if(!DB){ renderBoard(); return; }
  try{
    DB.collection("questions").orderBy("at","desc").limit(30).onSnapshot(docs=>{
      BOARD = (docs||[]).map(d=> d.data? d.data() : d);
      renderBoard();
    });
  }catch(e){ renderBoard(); }
}
function renderBoard(){
  const box=$("#a-board"); if(!box) return; box.innerHTML="";
  if(!DB){ box.appendChild(el("div","nores", t("boardoff"))); return; }
  if(!BOARD.length){ box.appendChild(el("div","nores", t("noboard"))); return; }
  BOARD.forEach(p=>{
    const c=el("div","post");
    c.appendChild(el("div","q", p.text||""));
    c.appendChild(el("div","m", new Date(p.at||Date.now()).toLocaleDateString()));
    if(p.answer) c.appendChild(el("div","a", p.answer));
    box.appendChild(c);
  });
}

/* ------------------------------------------------------------------ progress */
function renderProg(){
  const p=store.get();
  const runs=p.runs||[];
  $("#p-att").textContent = runs.length;
  $("#p-ans").textContent = p.answered||0;
  const best = runs.length? Math.max(...runs.map(r=>Math.round(r.score/r.total*100))) : 0;
  $("#p-best").textContent = best+"%";
  const box=$("#p-weak"); box.innerHTML="";
  const areas=p.areas||{};
  const keys=Object.keys(areas).filter(a=>areas[a].n>=3).sort((a,b)=> (areas[a].ok/areas[a].n)-(areas[b].ok/areas[b].n)).slice(0,6);
  if(!keys.length){ box.appendChild(el("div","nores", t("noweak"))); return; }
  keys.forEach(a=>{
    const row=el("div","brkrow");
    row.appendChild(el("span",null, LANG==="fr"? DATA.areaFr[a] : a));
    const m=el("span","mini"); const i=el("i"); i.style.width=Math.round(areas[a].ok/areas[a].n*100)+"%"; m.appendChild(i);
    row.append(m, el("b",null, Math.round(areas[a].ok/areas[a].n*100)+"%"));
    box.appendChild(row);
  });
}
$("#p-reset").onclick = ()=>{
  if(confirm(t("resetq"))){ store.set({}); renderProg(); renderRecent(); }
};

/* ------------------------------------------------------------------ PWA */
(function pwa(){
  try{
    const add = (rel, href)=>{ const l=document.createElement("link"); l.rel=rel; l.href=href; document.head.appendChild(l); };
    add("manifest", "manifest.json");
    add("apple-touch-icon", "apple-touch-icon.png");
    const m1=document.createElement("meta"); m1.name="apple-mobile-web-app-capable"; m1.content="yes"; document.head.appendChild(m1);
    const m2=document.createElement("meta"); m2.name="apple-mobile-web-app-title"; m2.content="CNA Prep"; document.head.appendChild(m2);
    const m3=document.createElement("meta"); m3.name="theme-color"; m3.content="#23106B"; document.head.appendChild(m3);
  }catch(e){}
  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  }
  let deferred=null;
  window.addEventListener("beforeinstallprompt", e=>{
    e.preventDefault(); deferred=e; $("#install").classList.add("on");
  });
  $("#installbtn").onclick = async ()=>{
    if(!deferred) { $("#install").classList.remove("on"); return; }
    deferred.prompt();
    try{ const c = await deferred.userChoice; if(c && c.outcome === "accepted") pushRoute("installed"); }catch(e){}
    deferred=null; $("#install").classList.remove("on");
  };
})();

/* ------------------------------------------------------------------ brand footer */
function renderBrand(){
  const live = BRAND.links.filter(l => l.url && l.url.trim());
  ["#brand-home","#brand-res"].forEach(sel=>{
    const box = $(sel); if(!box) return;
    box.innerHTML = "";

    box.appendChild(el("h3", null, LANG==="fr" ? "Retrouvez-nous" : "Find us"));
    box.appendChild(el("p","bn", BRAND.name));
    box.appendChild(el("p","bt", BRAND.tagline[LANG] || ""));

    if(live.length){
      const grid = el("div","links");
      live.forEach(l=>{
        const a = document.createElement("a");
        a.className = "lk"; a.href = l.url;
        a.target = "_blank"; a.rel = "noopener noreferrer";
        const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
        svg.setAttribute("viewBox","0 0 24 24");
        svg.innerHTML = ICONS[l.icon] || ICONS.globe;
        const tx = el("span","tx");
        tx.appendChild(el("b", null, l.label));
        if(l.note) tx.appendChild(el("span", null, l.note));
        a.append(svg, tx);
        grid.appendChild(a);
      });
      box.appendChild(grid);
    }

    if(BRAND.more && BRAND.more.length){
      const d = document.createElement("details"); d.className="more";
      const sm = document.createElement("summary");
      sm.textContent = LANG==="fr" ? "Nos autres sites" : "Our other sites";
      d.appendChild(sm);
      const mg = el("div","mg");
      BRAND.more.filter(m=>m.url && m.url.trim()).forEach(m=>{
        const a=document.createElement("a");
        a.href=m.url; a.target="_blank"; a.rel="noopener noreferrer"; a.textContent=m.label;
        mg.appendChild(a);
      });
      d.appendChild(mg);
      box.appendChild(d);
    }

    const pr = BRAND.promo;
    if(pr && pr.show && pr.url && (pr.title[LANG] || pr.image)){
      const a = document.createElement("a");
      a.className="promo"; a.href=pr.url; a.target="_blank"; a.rel="noopener noreferrer";
      if(pr.image){
        const im=document.createElement("img"); im.src=pr.image; im.alt=pr.title[LANG]||BRAND.name;
        im.loading="lazy"; a.appendChild(im);
      }
      const pb = el("div","pb");
      if(pr.kicker && pr.kicker[LANG]) pb.appendChild(el("div","pk", pr.kicker[LANG]));
      if(pr.title[LANG]) pb.appendChild(el("p","pt", pr.title[LANG]));
      if(pr.text[LANG])  pb.appendChild(el("p","px", pr.text[LANG]));
      pb.appendChild(el("span","pc", pr.cta[LANG] || "→"));
      a.appendChild(pb);
      box.appendChild(a);
    }

    box.appendChild(el("p","legal", t("foot")));
  });
}

/* ------------------------------------------------------------------ boot */
paintChrome();
renderGuide("");
initDB();
</script>
