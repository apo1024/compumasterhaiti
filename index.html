<title>CNA Prep Haiti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{
  --indigo:#23106B; --indigo-2:#3A22A8; --blue:#2E6FD0;
  --gold:#E8A91D; --green:#2E9E4F; --red:#CE3A2C;
  --ground:#F6F5FB; --card:#FFFFFF; --ink:#171331; --ink-2:#514B72; --ink-3:#8A84A6;
  --line:#E3E0EE; --line-2:#CFCADF;
  --ok-bg:#E9F6ED; --ok-line:#2E9E4F; --no-bg:#FCECEA; --no-line:#CE3A2C;
  --on-accent:#FFFFFF;
  --shadow:0 1px 2px rgba(23,19,49,.05), 0 8px 24px rgba(23,19,49,.07);
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --indigo:#B9AEF0; --indigo-2:#8E79E8; --blue:#6FA3EC;
    --gold:#EFC75E; --green:#63C983; --red:#F08375;
    --ground:#100D1E; --card:#191430; --ink:#EFECFA; --ink-2:#BAB3D6; --ink-3:#847DA3;
    --line:#2B2447; --line-2:#3A3159;
    --ok-bg:#15301F; --ok-line:#63C983; --no-bg:#33161A; --no-line:#F08375;
    --on-accent:#171331;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --indigo:#B9AEF0; --indigo-2:#8E79E8; --blue:#6FA3EC;
  --gold:#EFC75E; --green:#63C983; --red:#F08375;
  --ground:#100D1E; --card:#191430; --ink:#EFECFA; --ink-2:#BAB3D6; --ink-3:#847DA3;
  --line:#2B2447; --line-2:#3A3159;
  --ok-bg:#15301F; --ok-line:#63C983; --no-bg:#33161A; --no-line:#F08375;
  --on-accent:#171331;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{overflow-x:hidden;}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.5;
  padding:0 0 84px;
  overscroll-behavior-y:contain;
}
.wrap{max-width:720px;margin:0 auto;padding:0 16px;}
h1,h2,h3{font-family:"Bricolage Grotesque","Manrope",sans-serif;font-weight:700;letter-spacing:-.02em;margin:0;text-wrap:balance;}

/* ---------- top bar ---------- */
header{
  position:sticky;top:0;z-index:30;background:var(--ground);
  border-bottom:1px solid var(--line);
}
.bar{max-width:720px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;}
.bar img{height:30px;width:auto;display:block;background:#fff;padding:3px 5px;border-radius:6px;}
.bar .who{flex:1;min-width:0;}
.bar .who b{display:block;font-size:13px;font-weight:700;line-height:1.15;}
.bar .who span{display:block;font-size:10.5px;color:var(--ink-3);letter-spacing:.07em;text-transform:uppercase;}
.lang{display:flex;border:1px solid var(--line-2);border-radius:999px;overflow:hidden;flex:none;}
.lang button{
  font:inherit;font-size:12px;font-weight:700;border:0;background:transparent;color:var(--ink-2);
  padding:6px 11px;cursor:pointer;
}
.lang button[aria-pressed="true"]{background:var(--indigo);color:var(--on-accent);}

/* ---------- views ---------- */
.view{display:none;padding-top:18px;}
.view.on{display:block;}

.hero h1{font-size:26px;line-height:1.1;margin-bottom:6px;}
.hero p{color:var(--ink-2);margin:0 0 18px;font-size:14px;}

.levels{display:grid;gap:12px;}
.lvl{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:15px 16px;cursor:pointer;font:inherit;color:inherit;box-shadow:var(--shadow);
}
.lvl:active{transform:scale(.995);}
.lvl .dot{width:10px;height:10px;border-radius:50%;flex:none;}
.lvl .t{flex:1;min-width:0;}
.lvl .t b{display:block;font-size:16px;font-weight:700;font-family:"Bricolage Grotesque",sans-serif;}
.lvl .t span{display:block;font-size:12.5px;color:var(--ink-2);margin-top:1px;}
.lvl .n{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;flex:none;font-weight:600;}
.lvl:focus-visible{outline:2px solid var(--indigo-2);outline-offset:2px;}

.exam{background:var(--indigo);border-color:var(--indigo);color:var(--on-accent);}
.exam .t span,.exam .n{color:color-mix(in srgb, var(--on-accent) 75%, transparent);}

.sectionlabel{
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);
  font-weight:700;margin:26px 0 10px;
}

/* ---------- quiz ---------- */
.qtop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
.qtop .meta{font-size:12px;color:var(--ink-3);font-weight:600;font-variant-numeric:tabular-nums;}
.qtop button{font:inherit;font-size:12.5px;font-weight:600;background:none;border:0;color:var(--ink-2);cursor:pointer;padding:4px;}
.pbar{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:18px;}
.pbar i{display:block;height:100%;background:var(--indigo-2);border-radius:99px;transition:width .25s ease;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);}
.stem{font-size:17px;line-height:1.4;font-weight:600;margin:0 0 4px;font-family:"Bricolage Grotesque",sans-serif;}
.tag{display:inline-block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--ink-3);margin-bottom:10px;}
.opts{display:grid;gap:9px;margin-top:14px;}
.opt{
  display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;font:inherit;
  background:var(--card);border:1.5px solid var(--line-2);border-radius:11px;padding:12px 13px;
  cursor:pointer;color:inherit;line-height:1.35;
}
.opt i{
  flex:none;font-style:normal;font-weight:700;font-size:12px;width:22px;height:22px;border-radius:50%;
  border:1.5px solid var(--line-2);display:grid;place-items:center;color:var(--ink-3);margin-top:1px;
}
.opt:focus-visible{outline:2px solid var(--indigo-2);outline-offset:2px;}
.opt[disabled]{cursor:default;}
.opt.correct{background:var(--ok-bg);border-color:var(--ok-line);}
.opt.correct i{border-color:var(--ok-line);color:var(--ok-line);}
.opt.wrong{background:var(--no-bg);border-color:var(--no-line);}
.opt.wrong i{border-color:var(--no-line);color:var(--no-line);}

.why{margin-top:14px;border-top:1px solid var(--line);padding-top:13px;}
.why .verdict{font-weight:700;font-size:14px;margin:0 0 5px;font-family:"Bricolage Grotesque",sans-serif;}
.why .verdict.ok{color:var(--green);}
.why .verdict.no{color:var(--red);}
.why p{margin:0;font-size:14px;color:var(--ink-2);}
.srcbtn{
  margin-top:11px;display:inline-flex;align-items:center;gap:7px;font:inherit;font-size:12.5px;font-weight:700;
  background:transparent;border:1.5px solid var(--line-2);border-radius:999px;padding:7px 13px;cursor:pointer;color:var(--indigo);
}
.srcbtn:focus-visible{outline:2px solid var(--indigo-2);outline-offset:2px;}

.btn{
  display:block;width:100%;font:inherit;font-size:15px;font-weight:700;
  background:var(--indigo);color:var(--on-accent);border:0;border-radius:11px;padding:14px;margin-top:14px;cursor:pointer;
}
.btn.ghost{background:transparent;color:var(--ink-2);border:1.5px solid var(--line-2);}
.btn:focus-visible{outline:2px solid var(--indigo-2);outline-offset:2px;}

/* ---------- results ---------- */
.score{text-align:center;padding:26px 18px;}
.score .big{font-family:"Bricolage Grotesque",sans-serif;font-size:52px;font-weight:700;line-height:1;letter-spacing:-.03em;}
.score .big small{font-size:20px;color:var(--ink-3);font-weight:600;}
.score .verdict{font-size:14px;color:var(--ink-2);margin-top:8px;}
.brk{margin-top:8px;}
.brkrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
.brkrow span{flex:1;min-width:0;}
.brkrow b{font-variant-numeric:tabular-nums;font-weight:700;flex:none;}
.brkrow .mini{height:5px;width:62px;background:var(--line);border-radius:99px;overflow:hidden;flex:none;}
.brkrow .mini i{display:block;height:100%;background:var(--indigo-2);}
.missed{margin-top:8px;}
.missed details{border:1px solid var(--line);border-radius:11px;margin-bottom:8px;background:var(--card);}
.missed summary{padding:12px 14px;cursor:pointer;font-weight:600;font-size:14px;line-height:1.35;}
.missed summary::-webkit-details-marker{display:none;}
.missed .body{padding:0 14px 14px;font-size:13.5px;color:var(--ink-2);}
.missed .body b{color:var(--ink);}

/* ---------- guide ---------- */
.gsearch{display:flex;gap:8px;margin-bottom:14px;}
.gsearch input{
  flex:1;font:inherit;font-size:15px;padding:12px 14px;border-radius:11px;
  border:1.5px solid var(--line-2);background:var(--card);color:var(--ink);min-width:0;
}
.gsearch input:focus{outline:2px solid var(--indigo-2);outline-offset:0;border-color:transparent;}
.gitem{border-bottom:1px solid var(--line);}
.gitem summary{
  padding:14px 2px;cursor:pointer;display:flex;gap:12px;align-items:baseline;list-style:none;
}
.gitem summary::-webkit-details-marker{display:none;}
.gitem summary .gt{flex:1;font-weight:700;font-size:15px;font-family:"Bricolage Grotesque",sans-serif;line-height:1.3;}
.gitem summary .gp{font-size:11.5px;color:var(--ink-3);font-weight:700;flex:none;font-variant-numeric:tabular-nums;}
.gitem ul{margin:0 0 16px;padding-left:19px;}
.gitem li{margin:0 0 9px;font-size:14px;color:var(--ink-2);line-height:1.5;}
.gitem[open] summary .gt{color:var(--indigo);}
mark{background:rgba(232,169,29,.35);color:inherit;border-radius:2px;padding:0 1px;}

/* ---------- ask ---------- */
.askbox{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);}
.askbox textarea{
  width:100%;font:inherit;font-size:15px;padding:12px 13px;border-radius:11px;resize:vertical;min-height:84px;
  border:1.5px solid var(--line-2);background:var(--ground);color:var(--ink);
}
.askbox textarea:focus{outline:2px solid var(--indigo-2);border-color:transparent;}
.hit{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--indigo-2);border-radius:11px;padding:14px;margin-bottom:10px;}
.hit .src{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--ink-3);margin-bottom:6px;}
.hit p{margin:0 0 10px;font-size:14.5px;line-height:1.5;}
.nores{background:var(--card);border:1px dashed var(--line-2);border-radius:11px;padding:16px;text-align:center;color:var(--ink-2);font-size:14px;}
.board{margin-top:8px;}
.post{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:13px 14px;margin-bottom:9px;}
.post .q{font-weight:600;font-size:14.5px;line-height:1.4;}
.post .m{font-size:11.5px;color:var(--ink-3);margin-top:5px;}
.post .a{margin-top:9px;padding-top:9px;border-top:1px solid var(--line);font-size:14px;color:var(--ink-2);}

/* ---------- progress ---------- */
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px;}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:13px 12px;text-align:center;}
.stat b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:24px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;}
.stat span{display:block;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin-top:5px;font-weight:700;}

/* ---------- bottom nav ---------- */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
}
.navin{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);}
nav button{
  font:inherit;background:none;border:0;padding:9px 4px 11px;cursor:pointer;color:var(--ink-3);
  display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;
  letter-spacing:.02em;
}
nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
nav button[aria-current="true"]{color:var(--indigo);}
nav button:focus-visible{outline:2px solid var(--indigo-2);outline-offset:-3px;}

.foot{margin-top:26px;padding:16px 0 4px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-3);line-height:1.6;}
.install{
  display:none;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line-2);
  border-radius:11px;padding:12px 14px;margin-bottom:16px;box-shadow:var(--shadow);
}
.install.on{display:flex;}
.install p{margin:0;flex:1;font-size:13px;color:var(--ink-2);}
/* ---------- brand footer ---------- */
.brand{margin-top:30px;padding-top:22px;border-top:1px solid var(--line);}
.brand h3{
  font-family:"Archivo",sans-serif;font-size:11px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--ink-3);font-weight:700;margin:0 0 4px;
}
.brand .bn{font-family:"Bricolage Grotesque",sans-serif;font-size:19px;font-weight:700;margin:0 0 3px;color:var(--indigo);}
.brand .bt{font-size:13.5px;color:var(--ink-2);margin:0 0 16px;line-height:1.5;max-width:46ch;}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:9px;}
.lk{
  display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;
  background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 12px;
  box-shadow:var(--shadow);
}
.lk:active{transform:scale(.99);}
.lk:focus-visible{outline:2px solid var(--indigo-2);outline-offset:2px;}
.lk svg{width:19px;height:19px;flex:none;stroke:var(--indigo);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
.lk b{font-size:13.5px;font-weight:700;display:block;line-height:1.2;}
.lk span{font-size:11px;color:var(--ink-3);display:block;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lk .tx{min-width:0;}

.promo{
  display:block;text-decoration:none;color:inherit;margin-top:14px;
  background:var(--indigo);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);
}
.promo img{display:block;width:100%;height:auto;}
.promo .pb{padding:15px 16px;}
.promo .pk{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;
  color:color-mix(in srgb, var(--on-accent) 62%, transparent);margin-bottom:5px;}
.promo .pt{font-family:"Bricolage Grotesque",sans-serif;font-size:17px;font-weight:700;color:var(--on-accent);margin:0 0 4px;line-height:1.25;}
.promo .px{font-size:13px;color:color-mix(in srgb, var(--on-accent) 80%, transparent);margin:0 0 11px;line-height:1.45;}
.promo .pc{display:inline-block;font-size:12.5px;font-weight:700;color:var(--indigo);
  background:var(--on-accent);border-radius:999px;padding:7px 14px;}
.promo:focus-visible{outline:2px solid var(--indigo-2);outline-offset:3px;}
.more{margin-top:12px;border:1px solid var(--line);border-radius:11px;background:var(--card);}
.more summary{
  list-style:none;cursor:pointer;padding:12px 14px;font-size:13px;font-weight:700;color:var(--ink-2);
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.more summary::-webkit-details-marker{display:none;}
.more summary::after{content:"+";font-size:16px;color:var(--ink-3);font-weight:700;}
.more[open] summary::after{content:"\2013";}
.more .mg{display:flex;flex-wrap:wrap;gap:7px;padding:0 14px 14px;}
.more .mg a{
  font-size:12.5px;font-weight:600;text-decoration:none;color:var(--indigo);
  border:1px solid var(--line-2);border-radius:999px;padding:6px 12px;background:var(--ground);
}
.more .mg a:focus-visible{outline:2px solid var(--indigo-2);outline-offset:2px;}
.brand .legal{margin-top:16px;font-size:11px;color:var(--ink-3);line-height:1.6;}

.install button{font:inherit;font-size:13px;font-weight:700;background:var(--indigo);color:var(--on-accent);border:0;border-radius:999px;padding:8px 15px;cursor:pointer;flex:none;}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
</style>

<header>
  <div class="bar">
    <img src="logo.png" alt="CompuMaster Haiti">
    <div class="who"><b id="appname">CNA Prep</b><span id="appby">CompuMaster Haiti</span></div>
    <div class="lang" role="group" aria-label="Language">
      <button id="btn-en" aria-pressed="true">EN</button>
      <button id="btn-fr" aria-pressed="false">FR</button>
    </div>
  </div>
</header>

<main class="wrap">

  <!-- HOME -->
  <section class="view on" id="v-home">
    <div class="install" id="install"><p id="installtxt"></p><button id="installbtn">Install</button></div>
    <div class="hero">
      <h1 id="h-title"></h1>
      <p id="h-sub"></p>
    </div>
    <div class="levels" id="levels"></div>
    <div class="sectionlabel" id="l-recent"></div>
    <div id="recent"></div>
    <div class="brand" id="brand-home"></div>
  </section>

  <!-- QUIZ -->
  <section class="view" id="v-quiz">
    <div class="qtop">
      <span class="meta" id="q-meta"></span>
      <button id="q-quit"></button>
    </div>
    <div class="pbar"><i id="q-bar" style="width:0%"></i></div>
    <div class="card" id="q-card"></div>
    <button class="btn" id="q-next"></button>
  </section>

  <!-- RESULTS -->
  <section class="view" id="v-res">
    <div class="card score">
      <div class="big"><span id="r-score">0</span><small id="r-of"></small></div>
      <div class="verdict" id="r-verdict"></div>
    </div>
    <div class="sectionlabel" id="l-break"></div>
    <div class="brk" id="r-brk"></div>
    <div class="sectionlabel" id="l-missed"></div>
    <div class="missed" id="r-missed"></div>
    <button class="btn" id="r-again"></button>
    <button class="btn ghost" id="r-home"></button>
    <div class="brand" id="brand-res"></div>
  </section>

  <!-- GUIDE -->
  <section class="view" id="v-guide">
    <div class="hero"><h1 id="g-title"></h1><p id="g-sub"></p></div>

const strip = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const shuffle = a => { const r=a.slice(); for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; };

const STOP = new Set(("the a an of to in on for is are be do does should must when what how why which that this with and or not no as at by from it its resident nurse aide "+
 "le la les un une des de du a au aux et ou ne pas est sont doit doivent quand comment pourquoi quel quelle que qui dans sur pour avec resident aide soignant il elle").split(/\s+/));
function tokens(s){ return strip(s).replace(/[^a-z0-9\s]/g," ").split(/\s+/).filter(w=>w.length>2 && !STOP.has(w)); }

const INDEX = [];
DATA.guide.forEach(sec=>{
  ["en","fr"].forEach(lg=>{
    sec[lg].points.forEach((p,i)=>{
      INDEX.push({sec:sec.id, lang:lg, page:sec.page, title:sec[lg].title, text:p,
                  tok:new Set(tokens(p)), ttok:new Set(tokens(sec[lg].title))});
    });
  });
});

/* Inverse document frequency: a word that appears in almost every section
   (often, should, care) tells us far less than a rare one (reposition, catheter). */
const IDF = {en:{}, fr:{}};
["en","fr"].forEach(lg=>{
  const rows = INDEX.filter(r=>r.lang===lg);
  const df = {};
  rows.forEach(r=>{ new Set([...r.tok, ...r.ttok]).forEach(w=>{ df[w]=(df[w]||0)+1; }); });
  Object.keys(df).forEach(w=>{ IDF[lg][w] = Math.log(rows.length / (1 + df[w])) + 0.35; });
});
const idf = (lg,w) => IDF[lg][w] !== undefined ? Math.max(IDF[lg][w], 0.05) : 1.4;

function search(q, lang){
  const qt = [...new Set(tokens(q))];
  if(!qt.length) return [];
  const scored = INDEX.filter(r=>r.lang===lang).map(r=>{
    let s=0;
    qt.forEach(w=>{
      const weight = idf(lang,w);
      if(r.ttok.has(w)) s += 3*weight;          // in the section heading
      else if(r.tok.has(w)) s += 2*weight;      // exact word in the text
      else {
        for(const rw of r.tok){
          if(rw.length>4 && (rw.startsWith(w)||w.startsWith(rw)) && Math.abs(rw.length-w.length)<=3){ s += 0.9*weight; break; }
        }
      }
    });
    return {r,s};
  }).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);
  if(!scored.length) return [];
  const best = scored[0].s;
  const out=[]; const seen=new Set();
  for(const x of scored){
    if(x.s < best*0.35) break;                  // drop weak tail matches
    const key=x.r.sec+"|"+x.r.text.slice(0,30);
    if(seen.has(key)) continue; seen.add(key);
    out.push(x.r);
    if(out.length>=4) break;
  }
  return out;
}
function highlight(text, q){
  const qt=tokens(q); if(!qt.length) return text;
  let html = text.replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  qt.forEach(w=>{
    try{ html = html.replace(new RegExp("("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"[a-zA-Zàâçéèêëîïôûùüÿñ]*)","gi"), "<mark>$1</mark>"); }catch(e){}
  });
  return html;
}

/* ------------------------------------------------------------------ quiz */
function pick(level){
  if(level==="exam"){
    const byArea = {};
    DATA.q.forEach(q=>{ (byArea[q.area] = byArea[q.area]||[]).push(q); });
    const want = DATA.blueprint;
    let out=[];
    Object.keys(want).forEach(a=>{
      const pool = shuffle(byArea[a]||[]);
      out = out.concat(pool.slice(0, want[a]));
    });
    if(out.length<60) out = out.concat(shuffle(DATA.q.filter(q=>!out.includes(q))).slice(0,60-out.length));
    return shuffle(out).slice(0,60);
  }
  return shuffle(DATA.q.filter(q=>q.level===level));
}
function startQuiz(level){
  quiz = {level, items:pick(level), i:0, answers:[], score:0};

function paintQ(){
  const q = quiz.items[quiz.i];

    b.onclick = ()=> answer(idx);

  const chosen = quiz.answers[quiz.i];
  $("#q-next").style.display = (chosen==null) ? "none" : "block";
  $("#q-next").textContent = (quiz.i===quiz.items.length-1) ? t("finish") : t("next");
  if(chosen!=null) showFeedback(chosen, true);
}
function answer(idx){
  if(quiz.answers[quiz.i]!=null) return;
  quiz.answers[quiz.i]=idx;
  if(idx===quiz.items[quiz.i].a) quiz.score++;

function showFeedback(idx, replay){
  const q=quiz.items[quiz.i], L=q[LANG];
  const btns=[...document.querySelectorAll("#q-card .opt")];
  btns.forEach((b,i)=>{
    b.disabled=true;
    if(i===q.a) b.classList.add("correct");
    else if(i===idx) b.classList.add("wrong");
  });
  const ok = idx===q.a;
  const w = el("div","why");
  const v = el("p","verdict "+(ok?"ok":"no"), ok? t("correct") : t("incorrect"));
  w.appendChild(v);
  w.appendChild(el("p",null,L.w));
  const sec = secById(q.ref);
  if(sec){
    const sb = el("button","srcbtn", t("source")+" — "+sec[LANG].title+", "+t("page")+sec.page);
    sb.onclick = ()=>{ openGuide(sec.id); };
    w.appendChild(sb);
  }
  $("#q-card").appendChild(w);
}
$("#q-next").onclick = ()=>{
  if(quiz.i < quiz.items.length-1){ quiz.i++; paintQ(); }
  else finish();
};
$("#q-quit").onclick = ()=>{ quiz=null; go("home"); };

function finish(){
  const total=quiz.items.length, sc=quiz.score;
  $("#r-score").textContent = sc;
  $("#r-of").textContent = " / "+total;
  const pct = sc/total*100;
  $("#r-verdict").textContent = pct>=80? t("vgood") : pct>=70? t("vok") : t("vlow");
  // breakdown
  const by={};
  quiz.items.forEach((q,i)=>{
    by[q.area]=by[q.area]||{n:0,ok:0};
    by[q.area].n++;
    if(quiz.answers[i]===q.a) by[q.area].ok++;
  });
  const brk=$("#r-brk"); brk.innerHTML="";
  Object.keys(by).sort((a,b)=> (by[a].ok/by[a].n)-(by[b].ok/by[b].n)).forEach(a=>{
    const row=el("div","brkrow");
    row.appendChild(el("span",null, LANG==="fr"? DATA.areaFr[a] : a));
    const m=el("span","mini"); const i=el("i"); i.style.width=Math.round(by[a].ok/by[a].n*100)+"%"; m.appendChild(i);
    row.append(m, el("b",null, by[a].ok+"/"+by[a].n));
    brk.appendChild(row);
  });
  // missed
  const box=$("#r-missed"); box.innerHTML="";
  quiz.items.forEach((q,i)=>{
    if(quiz.answers[i]===q.a) return;
    const L=q[LANG], sec=secById(q.ref);
    const d=document.createElement("details");
    const s=document.createElement("summary"); s.textContent=L.q; d.appendChild(s);
    const b=el("div","body");
    b.appendChild(el("p",null,"")).innerHTML = "<b>"+"ABCD"[q.a]+") "+L.o[q.a].replace(/</g,"&lt;")+"</b>";
    b.appendChild(el("p",null,L.w));
    if(sec){
      const sb=el("button","srcbtn", t("source")+" — "+sec[LANG].title+", "+t("page")+sec.page);
      sb.onclick=()=>openGuide(sec.id);
      b.appendChild(sb);
    }
    d.appendChild(b); box.appendChild(d);
  });
  // persist
  const p=store.get();
  p.runs = (p.runs||[]).concat([{level:quiz.level, score:sc, total, at:Date.now()}]).slice(-40);
  p.answered = (p.answered||0)+total;
  p.areas = p.areas||{};
  Object.keys(by).forEach(a=>{
    p.areas[a]=p.areas[a]||{n:0,ok:0};
    p.areas[a].n+=by[a].n; p.areas[a].ok+=by[a].ok;
  });
  store.set(p);
  renderRecent(); renderBrand();
  go("res", quiz.level);
}
$("#r-again").onclick = ()=> startQuiz(quiz.level);
$("#r-home").onclick = ()=> go("home");

/* ------------------------------------------------------------------ guide */
function renderGuide(filter){
  const box=$("#g-list"); box.innerHTML="";
  const qv = (filter!=null? filter : $("#g-q").value) || "";
  const qt = tokens(qv);
  DATA.guide.forEach(sec=>{
    const L=sec[LANG];
    let points=L.points;
    if(qt.length){
      const hay = strip(L.title+" "+L.points.join(" "));
      if(!qt.some(w=>hay.includes(w))) return;
      points = L.points.filter(p=> qt.some(w=>strip(p).includes(w)) ) ;
      if(!points.length) points=L.points;
    }
    const d=document.createElement("details"); d.className="gitem"; d.id="sec-"+sec.id;
    if(qt.length) d.open=true;
    const s=document.createElement("summary");
    const gt=el("span","gt",L.title); const gp=el("span","gp", t("page")+sec.page);
    s.append(gt,gp); d.appendChild(s);
    const ul=document.createElement("ul");
    points.forEach(p=>{ const li=document.createElement("li"); li.innerHTML = qt.length? highlight(p,qv) : p.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); ul.appendChild(li); });
    d.appendChild(ul); box.appendChild(d);
  });
  if(!box.children.length) box.appendChild(el("div","nores", t("nores")));
}
$("#g-q").addEventListener("input", ()=> renderGuide());
function openGuide(id){
  go("guide"); $("#g-q").value=""; renderGuide("");
  const d=$("#sec-"+id);
  if(d){ d.open=true; setTimeout(()=>d.scrollIntoView({block:"start", behavior:"smooth"}), 60); }
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-current", String(b.dataset.go==="guide")));
}

/* ------------------------------------------------------------------ ask */
$("#a-go").onclick = ()=> doAsk();
$("#a-in").addEventListener("keydown", e=>{ if(e.key==="Enter" && (e.metaKey||e.ctrlKey)) doAsk(); });
function doAsk(){
  const q = $("#a-in").value.trim();
  const out=$("#a-out"); out.innerHTML="";
  if(!q) return;
  const hits = search(q, LANG);
  if(!hits.length){
    const n=el("div","nores", t("nores"));
    out.appendChild(n);
    addPostButton(out, q);
    return;
  }
  out.appendChild(el("div","sectionlabel", t("found")));
  hits.forEach(h=>{
    const c=el("div","hit");
    c.appendChild(el("div","src", h.title+" — "+t("page")+h.page));
    const p=el("p"); p.innerHTML = highlight(h.text, q); c.appendChild(p);
    const b=el("button","srcbtn", t("source"));
    b.onclick=()=>openGuide(h.sec);
    c.appendChild(b);
    out.appendChild(c);
  });
  addPostButton(out, q);
}
function addPostButton(out, q){
  if(!DB) return;
  const b=el("button","btn ghost", t("postq"));
  b.onclick = async ()=>{
    b.disabled=true;
    try{
      const id = "q"+Date.now()+Math.floor(Math.random()*1000);
      await DB.doc("questions/"+id).set({text:q, lang:LANG, at:Date.now(), answer:""});
      b.textContent = t("posted");
      $("#a-in").value="";
      renderBoard();
    }catch(e){ b.textContent = t("boardoff"); }
  };
  out.appendChild(b);
}
let DB=null, BOARD=[];
async function initDB(){
  try{
    DB = await window.claude?.use?.("db");
  }catch(e){ DB=null; }
  if(!DB){ renderBoard(); return; }
  try{
    DB.collection("questions").orderBy("at","desc").limit(30).onSnapshot(docs=>{
      BOARD = (docs||[]).map(d=> d.data? d.data() : d);
      renderBoard();
    });
  }catch(e){ renderBoard(); }
}
function renderBoard(){
  const box=$("#a-board"); if(!box) return; box.innerHTML="";
  if(!DB){ box.appendChild(el("div","nores", t("boardoff"))); return; }
  if(!BOARD.length){ box.appendChild(el("div","nores", t("noboard"))); return; }
  BOARD.forEach(p=>{
    const c=el("div","post");
    c.appendChild(el("div","q", p.text||""));
    c.appendChild(el("div","m", new Date(p.at||Date.now()).toLocaleDateString()));
    if(p.answer) c.appendChild(el("div","a", p.answer));
    box.appendChild(c);
  });
}

/* ------------------------------------------------------------------ progress */
function renderProg(){
  const p=store.get();
  const runs=p.runs||[];
  $("#p-att").textContent = runs.length;
  $("#p-ans").textContent = p.answered||0;
  const best = runs.length? Math.max(...runs.map(r=>Math.round(r.score/r.total*100))) : 0;
  $("#p-best").textContent = best+"%";
  const box=$("#p-weak"); box.innerHTML="";
  const areas=p.areas||{};
  const keys=Object.keys(areas).filter(a=>areas[a].n>=3).sort((a,b)=> (areas[a].ok/areas[a].n)-(areas[b].ok/areas[b].n)).slice(0,6);
  if(!keys.length){ box.appendChild(el("div","nores", t("noweak"))); return; }
  keys.forEach(a=>{
    const row=el("div","brkrow");
    row.appendChild(el("span",null, LANG==="fr"? DATA.areaFr[a] : a));
    const m=el("span","mini"); const i=el("i"); i.style.width=Math.round(areas[a].ok/areas[a].n*100)+"%"; m.appendChild(i);
    row.append(m, el("b",null, Math.round(areas[a].ok/areas[a].n*100)+"%"));
    box.appendChild(row);
  });
}
$("#p-reset").onclick = ()=>{
  if(confirm(t("resetq"))){ store.set({}); renderProg(); renderRecent(); }
};

/* ------------------------------------------------------------------ PWA */
(function pwa(){
  try{
    const add = (rel, href)=>{ const l=document.createElement("link"); l.rel=rel; l.href=href; document.head.appendChild(l); };
    add("manifest", "manifest.json");
    add("apple-touch-icon", "apple-touch-icon.png");
    const m1=document.createElement("meta"); m1.name="apple-mobile-web-app-capable"; m1.content="yes"; document.head.appendChild(m1);
    const m2=document.createElement("meta"); m2.name="apple-mobile-web-app-title"; m2.content="CNA Prep"; document.head.appendChild(m2);
    const m3=document.createElement("meta"); m3.name="theme-color"; m3.content="#23106B"; document.head.appendChild(m3);
  }catch(e){}
  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  }
  let deferred=null;
  window.addEventListener("beforeinstallprompt", e=>{
    e.preventDefault(); deferred=e; IOS_HINT=false; $("#install").classList.add("on"); paintInstall();
  });

  /* Safari on iPhone and iPad offers no install prompt at all — Apple does not
     provide one. Those users must use Share -> Add to Home Screen, so say so. */
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent||"");
  const standalone = window.navigator.standalone === true
                  || window.matchMedia("(display-mode: standalone)").matches;
  let dismissed = false;
  try{ dismissed = localStorage.getItem("cna_ios_hint") === "off"; }catch(e){}
  if(isIOS && !standalone && !dismissed){
    IOS_HINT = true;
    $("#install").classList.add("on");
    paintInstall();
  }
  $("#installbtn").onclick = async ()=>{
    if(IOS_HINT){
      try{ localStorage.setItem("cna_ios_hint","off"); }catch(e){}
      $("#install").classList.remove("on");
      return;
    }
    if(!deferred) { $("#install").classList.remove("on"); return; }
    deferred.prompt();
    try{ const c = await deferred.userChoice; if(c && c.outcome === "accepted") pushRoute("installed"); }catch(e){}
    deferred=null; $("#install").classList.remove("on");
  };
})();

/* ------------------------------------------------------------------ brand footer */
function renderBrand(){
  const live = BRAND.links.filter(l => l.url && l.url.trim());
  ["#brand-home","#brand-res"].forEach(sel=>{
    const box = $(sel); if(!box) return;
    box.innerHTML = "";

    box.appendChild(el("h3", null, LANG==="fr" ? "Retrouvez-nous" : "Find us"));
    box.appendChild(el("p","bn", BRAND.name));
    box.appendChild(el("p","bt", BRAND.tagline[LANG] || ""));

    if(live.length){
      const grid = el("div","links");
      live.forEach(l=>{
        const a = document.createElement("a");
        a.className = "lk"; a.href = l.url;
        a.target = "_blank"; a.rel = "noopener noreferrer";
        const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
        svg.setAttribute("viewBox","0 0 24 24");
        svg.innerHTML = ICONS[l.icon] || ICONS.globe;
        const tx = el("span","tx");
        tx.appendChild(el("b", null, l.label));
        if(l.note) tx.appendChild(el("span", null, l.note));
        a.append(svg, tx);
        grid.appendChild(a);
      });
      box.appendChild(grid);
    }

    if(BRAND.more && BRAND.more.length){
      const d = document.createElement("details"); d.className="more";
      const sm = document.createElement("summary");
      sm.textContent = LANG==="fr" ? "Nos autres sites" : "Our other sites";
      d.appendChild(sm);
      const mg = el("div","mg");
      BRAND.more.filter(m=>m.url && m.url.trim()).forEach(m=>{
        const a=document.createElement("a");
        a.href=m.url; a.target="_blank"; a.rel="noopener noreferrer"; a.textContent=m.label;
        mg.appendChild(a);
      });
      d.appendChild(mg);
      box.appendChild(d);
    }

    const pr = BRAND.promo;
    if(pr && pr.show && pr.url && (pr.title[LANG] || pr.image)){
      const a = document.createElement("a");
      a.className="promo"; a.href=pr.url; a.target="_blank"; a.rel="noopener noreferrer";
      if(pr.image){
        const im=document.createElement("img"); im.src=pr.image; im.alt=pr.title[LANG]||BRAND.name;
        im.loading="lazy"; a.appendChild(im);
      }
      const pb = el("div","pb");
      if(pr.kicker && pr.kicker[LANG]) pb.appendChild(el("div","pk", pr.kicker[LANG]));
      if(pr.title[LANG]) pb.appendChild(el("p","pt", pr.title[LANG]));
      if(pr.text[LANG])  pb.appendChild(el("p","px", pr.text[LANG]));
      pb.appendChild(el("span","pc", pr.cta[LANG] || "→"));
      a.appendChild(pb);
      box.appendChild(a);
    }

    box.appendChild(el("p","legal", t("foot")));
  });
}

paintChrome();
renderGuide("");
initDB();
</script>

on, quel element s'enleve EN PREMIER ?", "o": ["La blouse", "Le masque", "Les gants", "La protection oculaire"], "w": "Les gants sont l'element le plus contamine : ils partent avant que les mains touchent autre chose."}}, {"id": "b9", "level": "beginner", "ref": "ppe", "area": "Basic Nursing Skills", "a": 2, "en": {"q": "A disposable gown should be:", "o": ["Hung behind the door for reuse", "Worn for the whole hall", "Used once and discarded in the room", "Folded and kept in the pocket"], "w": "One gown, one resident, discarded before leaving the room."}, "fr": {"q": "Une blouse jetable doit etre :", "o": ["Suspendue derriere la porte pour etre reutilisee", "Portee pour tout le couloir", "Utilisee une fois et jetee dans la chambre", "Pliee et gardee dans la poche"], "w": "Une blouse, un resident, jetee avant de quitter la chambre."}}, {"id": "b10", "level": "beginner", "ref": "precautions", "area": "Basic Nursing Skills", "a": 1, "en": {"q": "Standard precautions are used:", "o": ["Only with residents who have an infection", "With every resident, every time", "Only in isolation rooms", "Only when blood is visible"], "w": "All blood and body fluids are treated as infectious regardless of diagnosis."}, "fr": {"q": "Les precautions standard s'appliquent :", "o": ["Seulement aux residents infectes", "A chaque resident, a chaque fois", "Seulement en chambre d'isolement", "Seulement quand du sang est visible"], "w": "Tout sang et liquide biologique est traite comme infectieux, quel que soit le diagnostic."}}], "areaFr": {"Activities of Daily Living": "Activites de la vie quotidienne", "Basic Nursing Skills": "Soins infirmiers de base", "Restorative Skills": "Soins de readaptation", "Emotional and Mental Health Needs": "Besoins emotionnels et de sante mentale", "Communication": "Communication", "Client Rights": "Droits du resident", "Member of the Health Care Team": "Membre de l'equipe de soins"}, "blueprint": {"Activities of Daily Living": 4, "Basic Nursing Skills": 22, " function cnaT(k){ const l=(typeof LANG!=="undefined"?LANG:(localStorage.getItem("cna_lang")||"en")); return (CNA_TXT[l]||CNA_TXT.en)[k]; }
async function cnaDecrypt(code){
  const P=CNA_PAYLOAD, b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const base=await crypto.subtle.importKey("raw", new TextEncoder().encode(String(code).trim().toUpperCase()), "PBKDF2", false, ["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2", salt:b(P.salt), iterations:P.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:b(P.iv)}, key, b(P.data))));
}

}

(function () {

  if (typeof location === 'undefined' || !document.head || location.protocol === 'file:' || /[?&]nopresence\b/.test(location.search)) return;

        try { client.publish(TOPIC + id, ''); client.end(true); } catch (e) {}

  };
